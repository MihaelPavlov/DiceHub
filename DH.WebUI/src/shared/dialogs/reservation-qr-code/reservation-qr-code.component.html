<div class="qr-ticket">
  <div class="qr-ticket__close" mat-dialog-close>
    <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6l-12 12"/></svg>
  </div>

  <span class="qr-ticket__badge" style="background:var(--games-violet-soft);color:var(--games-violet);">
    {{ "qr_scanner.qr_code_type.game_reservation" | translate | uppercase }}
  </span>

  <span class="qr-ticket__title">
    {{ "games.game.availability.reservation_qr_code.show_to_staff" | translate }}
  </span>

  <div class="qr-ticket__code" *ngIf="this.encryptedQrData">
    <qrcode
      [qrdata]="this.encryptedQrData"
      [width]="176"
      [margin]="0"
      [errorCorrectionLevel]="'M'"
    ></qrcode>
  </div>

  <button class="qr-ticket__btn" style="background:var(--games-violet);color:#1c0e33;" mat-dialog-close>
    {{ "close" | translate }}
  </button>
</div>
