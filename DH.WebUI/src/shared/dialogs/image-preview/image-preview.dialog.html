<div class="image-preview">
  <div class="image-preview__close" mat-dialog-close>
    <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6l-12 12"/></svg>
  </div>

  <span class="image-preview__title">{{ data.title || ('preview' | translate) }}</span>

  <div class="image-preview__frame" [class.image-preview__frame--tall]="!data.removeHeight">
    <img [src]="data.imageUrl" alt="preview" />
  </div>
</div>
