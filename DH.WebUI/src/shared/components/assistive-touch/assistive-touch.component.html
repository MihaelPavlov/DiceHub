<!-- This should be on the div if we want to move the assistive-touch -->
<!-- (mousedown)="startDragging($event)"
(mouseup)="stopDragging($event)"
(touchstart)="startDragging($event)"
(touchend)="stopDragging($event)" -->
<div
  class="freeze-overlay"
  *ngIf="isScreenFrozen"
  (touchmove)="$event.preventDefault()"
  (wheel)="$event.preventDefault()"
  (touchend)="stopDragging($event)"
  (mouseup)="stopDragging($event)"
></div>
<div
  #assistive_btn
  class="assistive_btn"
  [class.has-unread]="areAnyActiveNotifications | async"
  [class.is-muted]="!notificationsAllowed"
  (click)="openNotifications()"
  [ngStyle]="{
    top: positionY + 'px',
    left: positionX + 'px',
    opacity: buttonOpacity
  }"
  (mousedown)="startDragging($event)"
  (mouseup)="stopDragging($event)"
  (touchstart)="startDragging($event)"
  (touchend)="stopDragging($event)"
>
  <svg
    class="bell"
    viewBox="0 0 24 24"
    fill="none"
    stroke="currentColor"
    stroke-width="1.9"
    stroke-linecap="round"
    stroke-linejoin="round"
    aria-hidden="true"
  >
    <path
      class="bell__body"
      d="M6 15V10a6 6 0 0 1 12 0v5l1.6 2.2a.6.6 0 0 1-.5 1H4.9a.6.6 0 0 1-.5-1L6 15Z"
    />
    <path class="bell__clapper" d="M9.7 19.5a2.4 2.4 0 0 0 4.6 0" />
    <line class="bell__slash" x1="3.5" y1="3" x2="20.5" y2="21" />
    <circle class="bell__badge" cx="18.5" cy="5.5" r="3" />
  </svg>
</div>
