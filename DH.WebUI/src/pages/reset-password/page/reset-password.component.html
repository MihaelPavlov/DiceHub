<app-language-switch />
<div class="wrapper">
  <div class="interactive-option">
    <div class="icon_wrapper">
      <img
        class="dicehub-logo"
        src="shared/assets/images/dicehub_logo_1.png"
        alt="DiceHub"
      />
    </div>
  </div>
  <span class="header">{{ this.clubName ?? ("club" | translate) }}</span>

  <form [formGroup]="this.form" class="container">
    <div class="input-field password-field">
      <label for="newPassword" class="required">{{
        "reset_password.labels.new_password" | translate
      }}</label>
      <input
        [placeholder]="'reset_password.placeholders.new_password' | translate"
        [type]="showNewPassword ? 'text' : 'password'"
        formControlName="newPassword"
        class="surface-elevated"
      />
      <app-password-visibility-toggle
        [(isVisible)]="showNewPassword"
      ></app-password-visibility-toggle>
    </div>
    <div class="input-field password-field">
      <label for="confirmPassword" class="required">{{
        "reset_password.labels.confirm_password" | translate
      }}</label>
      <input
        [placeholder]="
          'reset_password.placeholders.confirm_password' | translate
        "
        [type]="showConfirmPassword ? 'text' : 'password'"
        formControlName="confirmPassword"
        class="surface-elevated"
      />
      <app-password-visibility-toggle
        [(isVisible)]="showConfirmPassword"
      ></app-password-visibility-toggle>
    </div>
    <div *ngIf="getFirstErrorMessage()" class="errors">
      {{ getFirstErrorMessage() }}
    </div>

    <div class="btn-container">
      <button
        [disabled]="this.form.invalid"
        type="button"
        (click)="onSubmit()"
        class="games-cta"
      >
        {{ "reset_password.reset_password_btn" | translate }}
      </button>
    </div>
  </form>
</div>
