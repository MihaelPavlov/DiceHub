<section class="instructions-hub">
  <header class="instructions-hub__header">
    <button
      type="button"
      class="games-icon-btn"
      (click)="backNavigateBtn()"
      aria-label="Back"
    >
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M15 5l-7 7 7 7" />
      </svg>
    </button>
    <h1 class="instructions-hub__title">
      {{ "instruction.instructions_header" | translate }}
    </h1>
    <button
      type="button"
      class="games-icon-btn"
      (click)="controls.toggleMenu()"
      aria-label="Info"
    >
      <svg viewBox="0 -960 960 960" aria-hidden="true">
        <path
          d="M448-284h66v-236h-66v236Zm31.82-308.92q14.64 0 24.72-9.9 10.08-9.91 10.08-24.54 0-14.64-9.91-24.72-9.9-10.07-24.53-10.07-14.64 0-24.72 9.9-10.08 9.9-10.08 24.54 0 14.63 9.91 24.71 9.9 10.08 24.53 10.08ZM480.13-88q-81.31 0-152.89-30.86-71.57-30.86-124.52-83.76-52.95-52.9-83.83-124.42Q88-398.55 88-479.87q0-81.56 30.92-153.37 30.92-71.8 83.92-124.91 53-53.12 124.42-83.48Q398.67-872 479.87-872q81.55 0 153.35 30.34 71.79 30.34 124.92 83.42 53.13 53.08 83.49 124.84Q872-561.64 872-480.05q0 81.59-30.34 152.83-30.34 71.23-83.41 124.28-53.07 53.05-124.81 84Q561.7-88 480.13-88Zm-.13-66q136.51 0 231.26-94.74Q806-343.49 806-480t-94.74-231.26Q616.51-806 480-806t-231.26 94.74Q154-616.51 154-480t94.74 231.26Q343.49-154 480-154Zm0-326Z"
        />
      </svg>
    </button>
  </header>

  <div class="instructions-hub__grid">
    <a
      *ngFor="let link of defaultLinks"
      class="instructions-hub__card"
      [ngClass]="'instructions-hub__card--' + link.accent"
      (click)="navigateTo(link.path)"
    >
      <div
        class="instructions-hub__icon"
        [ngClass]="'instructions-hub__icon--' + link.accent"
      >
        <svg
          *ngIf="link.icon === 'checklist'"
          viewBox="0 0 24 24"
          aria-hidden="true"
        >
          <rect x="3" y="4" width="18" height="17" rx="2" />
          <path d="M7 9l1.5 1.5L11 8" />
          <path d="M13 9h5" />
          <path d="M7 15l1.5 1.5L11 14" />
          <path d="M13 15h5" />
        </svg>
        <svg
          *ngIf="link.icon === 'install'"
          viewBox="0 0 24 24"
          aria-hidden="true"
        >
          <rect x="4" y="4" width="16" height="16" rx="3" />
          <path d="M8 4v16" />
          <path d="M12 9h5M12 13h5" />
        </svg>
        <svg
          *ngIf="link.icon === 'bell'"
          viewBox="0 0 24 24"
          aria-hidden="true"
        >
          <path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9" />
          <path d="M13.73 21a2 2 0 0 1-3.46 0" />
        </svg>
        <svg
          *ngIf="link.icon === 'table'"
          viewBox="0 0 24 24"
          aria-hidden="true"
        >
          <rect x="4" y="5" width="16" height="15" rx="3" />
          <path d="M4 10h16" />
          <path d="M8 3v4M16 3v4" />
        </svg>
        <svg
          *ngIf="link.icon === 'calendar'"
          viewBox="0 -960 960 960"
          aria-hidden="true"
        >
          <path
            d="M204.62-100q-27.62 0-46.12-18.5T140-164.62v-566.76q0-27.62 18.5-46.12T204.62-796h49.23v-63.85h68.3V-796h324v-63.85h66.16V-796h49.07q27.62 0 46.28 18.5Q826-759 826-731.38v566.76q0 27.62-18.5 46.12T761.38-100H204.62Z"
          />
        </svg>
        <svg
          *ngIf="link.icon === 'trophy'"
          viewBox="0 -960 960 960"
          aria-hidden="true"
        >
          <path
            d="M346.92-70.77 274.15-195.38l-141.07-31.39 14.46-145.08L51.85-480l95.69-108.15-14.46-145.08 141.07-31.39 72.77-124.61L480-832.92l133.08-56.31 72.77 124.61 141.07 31.39-14.46 145.08L908.15-480l-95.69 108.15 14.46 145.08-141.07 31.39-72.77 124.61L480-127.08 346.92-70.77Z"
          />
        </svg>
        <svg
          *ngIf="link.icon === 'meeple'"
          viewBox="0 0 24 24"
          aria-hidden="true"
        >
          <circle cx="9" cy="8" r="3" />
          <path d="M3 19c.8-3.3 3-5 6-5s5.2 1.7 6 5" />
          <circle cx="17" cy="9" r="2.4" />
          <path d="M15.5 12.2c2.6.2 4 1.7 4.6 4.3" />
        </svg>
      </div>

      <div class="instructions-hub__card-text">
        <span class="instructions-hub__card-title">{{ link.name }}</span>
        <span class="instructions-hub__card-summary">{{ link.summary }}</span>
      </div>

      <span
        class="instructions-hub__card-chip"
        [ngClass]="'instructions-hub__card-chip--' + link.accent"
        >{{ "instruction.articles_count" | translate : { count: link.count } }}</span
      >

      <svg
        class="instructions-hub__card-arrow"
        viewBox="0 0 24 24"
        aria-hidden="true"
      >
        <path d="M9 5l7 7-7 7" />
      </svg>
    </a>
  </div>
</section>

<app-controls-menu
  #controls
  [isInfo]="true"
  [infoDescription]="'instruction.info_description' | translate"
></app-controls-menu>

<router-outlet></router-outlet>
