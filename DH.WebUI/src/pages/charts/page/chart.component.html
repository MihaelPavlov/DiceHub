<section class="chart-page games-design-surface">
  <header class="chart-page__header">
    <button type="button" class="chart-page__icon-btn" (click)="backNavigateBtn()" aria-label="Back">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" /></svg>
    </button>
    <span class="chart-page__title games-display">Charts Overview</span>
    <span class="chart-page__icon-btn chart-page__icon-btn--spacer" aria-hidden="true"></span>
  </header>
  <p class="chart-page__subtitle">Every stat canvas on one scrolling page.</p>

  <div class="chart-page__grid">
    <div class="chart-card chart-card--full games-panel">
      <span class="chart-card__eyebrow">Top Rewards by Collections</span>
      <div class="chart-card__body chart-card__body--tall">
        <canvas #rewardsStatsChartCanvas></canvas>
      </div>
    </div>

    <div class="chart-card games-panel">
      <span class="chart-card__eyebrow">Event Attendance</span>
      <div class="chart-card__body chart-card__body--tall">
        <canvas #eventAttendanceChartCanvas></canvas>
      </div>
    </div>

    <div class="chart-card games-panel">
      <span class="chart-card__eyebrow">Rewards Collected / Expired</span>
      <div class="chart-card__body chart-card__body--tall">
        <canvas #rewardsChartCanvas></canvas>
      </div>
    </div>

    <div class="chart-card games-panel">
      <span class="chart-card__eyebrow">Reservations</span>
      <div class="chart-card__body">
        <canvas #reservationChartCanvas></canvas>
      </div>
    </div>
  </div>

  <div class="chart-page__grid chart-page__grid--pair">
    <div class="chart-card games-panel">
      <span class="chart-card__eyebrow">Visitor Activity — Monthly</span>
      <div class="chart-card__body">
        <canvas #visitorMonthActivityChartCanvas></canvas>
      </div>
    </div>

    <div class="chart-card games-panel">
      <span class="chart-card__eyebrow">Visitor Activity — Weekly</span>
      <div class="chart-card__body">
        <canvas #visitorWeekActivityChartCanvas></canvas>
      </div>
    </div>
  </div>
</section>
