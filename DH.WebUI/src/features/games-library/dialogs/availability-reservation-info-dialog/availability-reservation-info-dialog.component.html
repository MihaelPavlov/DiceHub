<div class="confirm-sheet" appSheetDismiss>
  <div class="confirm-sheet__handle"></div>

  <div class="confirm-sheet__head">
    <div
      class="confirm-sheet__icon"
      [class.confirm-sheet__icon--teal]="this.data.status === ReservationStatus.Approved"
      [class.confirm-sheet__icon--coral]="this.data.status === ReservationStatus.Declined"
      [class.confirm-sheet__icon--amber]="this.data.status !== ReservationStatus.Approved && this.data.status !== ReservationStatus.Declined"
    >
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="9"/><path d="M12 8v.01M11 11h1v5h1"/>
      </svg>
    </div>
    <div class="confirm-sheet__title">
      {{ "games.game.availability.reservation_info.information" | translate }}
    </div>
  </div>

  <div style="display:flex;flex-direction:column;gap:0.5rem;">
    <p
      class="confirm-sheet__message"
      *ngIf="this.data.publicNote.length !== 0"
      [innerHtml]="
        'games.game.availability.reservation_info.message_from_staff'
          | translate : { publicNote: this.data.publicNote }
      "
    ></p>
    <p
      class="confirm-sheet__message"
      *ngIf="this.data.status === ReservationStatus.Approved"
    >
      {{ "games.game.availability.reservation_info.approved_reminder" | translate }}
    </p>
    <p
      class="confirm-sheet__message"
      *ngIf="this.data.status === ReservationStatus.Declined"
      [innerHtml]="'games.game.availability.reservation_info.declined_message' | translate"
    ></p>
  </div>

  <div class="confirm-sheet__actions">
    <button class="confirm-sheet__btn confirm-sheet__btn--ghost" mat-dialog-close>
      {{ "close" | translate }}
    </button>
  </div>
</div>
