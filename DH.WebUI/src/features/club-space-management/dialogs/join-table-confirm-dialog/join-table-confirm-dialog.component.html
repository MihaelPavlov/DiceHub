<div class="confirm-sheet">
  <div class="confirm-sheet__handle"></div>

  <div class="confirm-sheet__head">
    <div class="confirm-sheet__icon confirm-sheet__icon--teal">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="8.5" cy="8" r="3"/><path d="M2.5 19.5c.8-3.3 3-5 6-5s5.2 1.7 6 5"/><circle cx="17" cy="9" r="2.4"/><path d="M15.5 12.2c2.6.2 4 1.7 4.6 4.3"/>
      </svg>
    </div>
    <div class="confirm-sheet__title">{{ "space_management.join_room_question" | translate }}</div>
  </div>

  <div class="confirm-sheet__field" *ngIf="this.data.withPassword">
    <label class="confirm-sheet__field-label" for="password">
      {{ "space_management.add_update.labels.password" | translate }}
    </label>
    <input
      [placeholder]="'space_management.add_update.placeholders.enter_password' | translate"
      type="password"
      id="password"
      [formControl]="password"
    />
  </div>

  <p class="confirm-sheet__error" *ngIf="this.data.error">{{ this.data.error }}</p>

  <div class="confirm-sheet__actions">
    <button class="confirm-sheet__btn confirm-sheet__btn--ghost" mat-dialog-close>
      {{ "cancel" | translate }}
    </button>
    <button
      class="confirm-sheet__btn confirm-sheet__btn--teal"
      (click)="join()"
      [disabled]="this.data.withPassword ? this.password.invalid : false"
    >
      {{ "space_management.join_table_btn" | translate }}
    </button>
  </div>
</div>
