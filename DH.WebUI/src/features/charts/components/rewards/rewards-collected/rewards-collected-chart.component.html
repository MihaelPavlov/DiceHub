<section class="charts-shell">
  <header class="charts-shell__header">
    <button type="button" class="games-icon-btn" (click)="backNavigateBtn()" aria-label="Back">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" /></svg>
    </button>
    <h1 class="charts-shell__title games-display">Collected Rewards</h1>
    <button type="button" class="games-icon-btn" (click)="controls.toggleMenu()" aria-label="Info">
      <svg viewBox="0 -960 960 960" aria-hidden="true">
        <path
          d="M448-284h66v-236h-66v236Zm31.82-308.92q14.64 0 24.72-9.9 10.08-9.91 10.08-24.54 0-14.64-9.91-24.72-9.9-10.07-24.53-10.07-14.64 0-24.72 9.9-10.08 9.9-10.08 24.54 0 14.63 9.91 24.71 9.9 10.08 24.53 10.08ZM480.13-88q-81.31 0-152.89-30.86-71.57-30.86-124.52-83.76-52.95-52.9-83.83-124.42Q88-398.55 88-479.87q0-81.56 30.92-153.37 30.92-71.8 83.92-124.91 53-53.12 124.42-83.48Q398.67-872 479.87-872q81.55 0 153.35 30.34 71.79 30.34 124.92 83.42 53.13 53.08 83.49 124.84Q872-561.64 872-480.05q0 81.59-30.34 152.83-30.34 71.23-83.41 124.28-53.07 53.05-124.81 84Q561.7-88 480.13-88Zm-.13-66q136.51 0 231.26-94.74Q806-343.49 806-480t-94.74-231.26Q616.51-806 480-806t-231.26 94.74Q154-616.51 154-480t94.74 231.26Q343.49-154 480-154Zm0-326Z"
        />
      </svg>
    </button>
  </header>

  <nav class="charts-shell__chips" aria-label="Quick range">
    <button
      type="button"
      *ngFor="let range of quickRanges"
      class="games-chip"
      [class.games-chip--active]="currentQuickRangeMonths === range.months"
      (click)="applyQuickRange(range.months)"
    >
      {{ range.label }}
    </button>
  </nav>

  <div class="charts-shell__date-range">
    <label class="charts-shell__date-field">
      <span class="charts-shell__date-field-label">From</span>
      <input type="date" [formControl]="fromDateControl" class="charts-shell__date-input" />
    </label>
    <label class="charts-shell__date-field">
      <span class="charts-shell__date-field-label">To</span>
      <input type="date" [formControl]="toDateControl" class="charts-shell__date-input" />
    </label>
  </div>

  <div class="charts-shell__empty" *ngIf="validationMessageFromDates">
    {{ validationMessageFromDates }}
  </div>

  <div class="games-panel rewards-collected-card">
    <div class="rewards-collected-card__canvas">
      <canvas #rewardsChartCanvas></canvas>
    </div>
  </div>
</section>

<app-controls-menu
  #controls
  [isInfo]="true"
  infoDescription="Overview of rewards collected within the selected dates,
  including how many times each was collected and their total cash value."
></app-controls-menu>
