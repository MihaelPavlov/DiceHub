<section class="chart-menu games-design-surface">
  <header class="chart-menu__header">
    <button type="button" class="chart-menu__icon-btn" (click)="backNavigateBtn()" aria-label="Back">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" /></svg>
    </button>
    <span class="chart-menu__title games-display">Reward Charts</span>
    <button type="button" class="chart-menu__icon-btn chart-menu__icon-btn--fill" (click)="controls.toggleMenu()" aria-label="Info">
      <svg viewBox="0 -960 960 960" aria-hidden="true">
        <path
          d="M448-284h66v-236h-66v236Zm31.82-308.92q14.64 0 24.72-9.9 10.08-9.91 10.08-24.54 0-14.64-9.91-24.72-9.9-10.07-24.53-10.07-14.64 0-24.72 9.9-10.08 9.9-10.08 24.54 0 14.63 9.91 24.71 9.9 10.08 24.53 10.08ZM480.13-88q-81.31 0-152.89-30.86-71.57-30.86-124.52-83.76-52.95-52.9-83.83-124.42Q88-398.55 88-479.87q0-81.56 30.92-153.37 30.92-71.8 83.92-124.91 53-53.12 124.42-83.48Q398.67-872 479.87-872q81.55 0 153.35 30.34 71.79 30.34 124.92 83.42 53.13 53.08 83.49 124.84Q872-561.64 872-480.05q0 81.59-30.34 152.83-30.34 71.23-83.41 124.28-53.07 53.05-124.81 84Q561.7-88 480.13-88Z"
        />
      </svg>
    </button>
  </header>
  <p class="chart-menu__subtitle">Pick a breakdown to explore.</p>

  <div class="chart-menu__list">
    <button type="button" class="chart-menu__card" (click)="navigateToExpiredCollectedChart()">
      <span class="chart-menu__card-icon chart-menu__card-icon--violet">
        <svg viewBox="0 -960 960 960" aria-hidden="true">
          <path
            d="M199.62-138q-38.35 0-64.48-26.14Q109-190.27 109-228.62V-858h66v629.38q0 9.24 7.69 16.93 7.69 7.69 16.93 7.69H851v66H199.62Zm90.76-166v-302.31h92V-304h-92Zm192 0v-506.31h92V-304h-92Zm192 0v-138.31h92.01V-304h-92.01Z"
          />
        </svg>
      </span>
      <span class="chart-menu__card-text">
        <span class="chart-menu__card-title games-display">Expired &amp; Collected</span>
        <span class="chart-menu__card-desc">Rewards collected vs. expired, by month</span>
      </span>
      <svg class="chart-menu__chevron" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7" /></svg>
    </button>

    <button type="button" class="chart-menu__card" (click)="navigateToCollectedRewardsChart()">
      <span class="chart-menu__card-icon chart-menu__card-icon--amber">
        <svg viewBox="0 -960 960 960" aria-hidden="true">
          <path
            d="M480-80 154-411q-35-35-54.5-79T80-580q0-90 63-153t153-63q55 0 103 26t81 70q33-44 81-70t103-26q90 0 153 63t63 153q0 46-19.5 90T806-411L480-80Z"
          />
        </svg>
      </span>
      <span class="chart-menu__card-text">
        <span class="chart-menu__card-title games-display">Rewards Uses</span>
        <span class="chart-menu__card-desc">Which rewards get redeemed the most</span>
      </span>
      <svg class="chart-menu__chevron" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7" /></svg>
    </button>
  </div>
</section>

<app-controls-menu
  #controls
  [isInfo]="true"
  infoDescription="All available charts related to rewards."
></app-controls-menu>
