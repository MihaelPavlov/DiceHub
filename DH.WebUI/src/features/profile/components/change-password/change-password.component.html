<section class="password-section">
  <div class="password-section__header">
    <span class="password-section__title">{{
      "change_password.title" | translate
    }}</span>
    <span class="password-section__subtitle">{{
      "change_password.subtitle" | translate
    }}</span>
  </div>

  <form [formGroup]="form" class="password-section__form">
    <div class="input-field password-field">
      <label for="currentPassword" class="required">{{
        "change_password.labels.current_password" | translate
      }}</label>
      <input
        [placeholder]="
          'change_password.placeholders.current_password' | translate
        "
        [type]="showCurrentPassword ? 'text' : 'password'"
        id="currentPassword"
        formControlName="currentPassword"
        class="surface-elevated"
        autocomplete="current-password"
      />
      <app-password-visibility-toggle
        [(isVisible)]="showCurrentPassword"
      ></app-password-visibility-toggle>
    </div>

    <div class="input-field password-field">
      <label for="newPassword" class="required">{{
        "change_password.labels.new_password" | translate
      }}</label>
      <input
        [placeholder]="'change_password.placeholders.new_password' | translate"
        [type]="showNewPassword ? 'text' : 'password'"
        id="newPassword"
        formControlName="newPassword"
        class="surface-elevated"
        autocomplete="new-password"
      />
      <app-password-visibility-toggle
        [(isVisible)]="showNewPassword"
      ></app-password-visibility-toggle>
    </div>

    <div class="input-field password-field">
      <label for="confirmPassword" class="required">{{
        "change_password.labels.confirm_password" | translate
      }}</label>
      <input
        [placeholder]="
          'change_password.placeholders.confirm_password' | translate
        "
        [type]="showConfirmPassword ? 'text' : 'password'"
        id="confirmPassword"
        formControlName="confirmPassword"
        class="surface-elevated"
        autocomplete="new-password"
      />
      <app-password-visibility-toggle
        [(isVisible)]="showConfirmPassword"
      ></app-password-visibility-toggle>
    </div>

    <div *ngIf="getFirstErrorMessage()" class="errors">
      {{ getFirstErrorMessage() }}
    </div>

    <button
      [disabled]="form.invalid || isSaving"
      type="button"
      (click)="onSubmit()"
      class="btn btn-gray"
      [ngClass]="{
        'btn-border-green': form.valid,
        'btn-font-green': form.valid,
        'btn-border-red': form.invalid,
        'btn-font-red': form.invalid
      }"
    >
      {{
        isSaving
          ? ("change_password.saving_button" | translate)
          : ("change_password.save_button" | translate)
      }}
    </button>
  </form>
</section>
