<main class="container">
  <header class="page-header">
    <div>
      <p class="eyebrow">Platform</p>
      <h1>Tenants</h1>
      <p class="description">Select a venue to inspect its platform access.</p>
    </div>
  </header>

  <p *ngIf="isLoading" class="state">Loading tenants...</p>
  <p *ngIf="!isLoading && tenants.length === 0" class="state">No tenants found.</p>

  <section class="tenant-grid" *ngIf="!isLoading && tenants.length">
    <button class="tenant-card" type="button" *ngFor="let tenant of tenants" (click)="open(tenant)">
      <span class="tenant-mark">{{ tenant.tenantName.charAt(0) }}</span>
      <span class="tenant-copy">
        <strong>{{ tenant.tenantName }}</strong>
        <small>{{ tenant.id }}</small>
      </span>
      <span class="arrow" aria-hidden="true">&#8594;</span>
    </button>
  </section>
</main>
