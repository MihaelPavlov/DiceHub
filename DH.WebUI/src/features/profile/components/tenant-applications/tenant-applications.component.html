<app-profile-settings-nav></app-profile-settings-nav>

<div class="profile-page-body">
  <div class="profile-page">
    <div class="profile-page-header">
      <span class="profile-page-header__title">{{ "profile.applicants" | translate }}</span>
    </div>

    <div class="profile-empty-state" *ngIf="isLoading">Loading applicants...</div>
    <div class="profile-empty-state" *ngIf="!isLoading && applications.length === 0">
      No tenant applicants yet.
    </div>

    <div class="profile-list" *ngIf="!isLoading && applications.length > 0">
      <button
        type="button"
        class="profile-list-row applicant-row"
        *ngFor="let application of applications"
        (click)="open(application)"
      >
        <div class="profile-list-row__body">
          <span class="profile-list-row__title">{{ application.contactName }}</span>
          <span class="profile-list-row__subtitle">{{ application.applicantType }}</span>
          <span class="profile-list-row__subtitle">{{ application.email }}</span>
          <span class="profile-list-row__subtitle">{{ application.phoneNumber }}</span>
        </div>
        <span
          class="profile-status"
          [class.profile-status--pending]="application.status === status.PendingVerification"
          [class.profile-status--verified]="application.status === status.Verified"
          [class.profile-status--rejected]="application.status === status.Rejected"
        >
          {{ getStatusLabel(application.status) }}
        </span>
      </button>
    </div>
  </div>
</div>
