<div class="confirm-sheet">
  <div class="confirm-sheet__handle"></div>

  <div class="confirm-sheet__centered">
    <div class="confirm-sheet__icon confirm-sheet__icon--lg confirm-sheet__icon--coral">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
        <path d="M5 7h14"/><path d="M9 7V5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2"/><path d="M7 7l1 13a2 2 0 0 0 2 2h4a2 2 0 0 0 2-2l1-13"/><path d="M10 11v6M14 11v6"/>
      </svg>
    </div>
    <div class="confirm-sheet__title">{{ "are_you_sure" | translate }}</div>
  </div>

  <div class="confirm-sheet__callout">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;margin-top:0.0625rem;">
      <path d="M12 4 3 20h18z"/><path d="M12 10v5"/><circle cx="12" cy="18" r="0.6" fill="currentColor" stroke="none"/>
    </svg>
    <span>
      <strong>{{ "admin_rewards.delete_dialog.important_note" | translate }}</strong><br />
      {{ "admin_rewards.delete_dialog.important_note_desc_1" | translate }}<br />
      {{ "admin_rewards.delete_dialog.important_note_desc_2" | translate }}
    </span>
  </div>

  <div class="confirm-sheet__actions">
    <button class="confirm-sheet__btn confirm-sheet__btn--ghost" mat-dialog-close>
      {{ "cancel" | translate }}
    </button>
    <button class="confirm-sheet__btn confirm-sheet__btn--coral" (click)="delete()">
      {{ "delete" | translate }}
    </button>
  </div>
</div>
