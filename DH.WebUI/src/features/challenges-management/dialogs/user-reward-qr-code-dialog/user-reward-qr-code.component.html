<div class="qr-ticket">
  <div class="qr-ticket__close" mat-dialog-close>
    <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6l-12 12"/></svg>
  </div>

  <span class="qr-ticket__badge" style="background:var(--games-amber-soft);color:var(--games-amber);">
    {{ "qr_scanner.qr_code_type.reward" | translate | uppercase }}
  </span>

  <span class="qr-ticket__title">{{ "reward" | translate }}</span>

  <div class="qr-ticket__code" *ngIf="qrData">
    <qrcode
      [qrdata]="qrData"
      [width]="240"
      [margin]="2"
      [errorCorrectionLevel]="'L'"
    ></qrcode>
  </div>
  <span *ngIf="qrError" class="qr-ticket__title">
    {{ "qr_scanner.qr_generate_failed" | translate }}
  </span>

  <button class="qr-ticket__btn" style="background:var(--games-amber);color:#2b1a02;" mat-dialog-close>
    {{ "close" | translate }}
  </button>
</div>
