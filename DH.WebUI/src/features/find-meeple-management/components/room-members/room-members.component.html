<section class="room-members-shell games-design-surface">
  <header class="room-members-shell__header">
    <button
      type="button"
      class="games-icon-btn"
      (click)="onBack()"
      aria-label="Back"
    >
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M15 5l-7 7 7 7" />
      </svg>
    </button>
    <span class="room-members-shell__title games-display">{{
      "meeple.room.room_members" | translate
    }}</span>
    <span class="games-icon-btn games-icon-btn--spacer" aria-hidden="true"></span>
  </header>

  <form class="room-members-shell__search">
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <circle cx="10.5" cy="10.5" r="6.5" />
      <path d="M20 20l-4.8-4.8" />
    </svg>
    <input
      type="search"
      [placeholder]="'meeple.room.search_members_placeholder' | translate"
      (input)="handleSearchExpression($any($event.target).value)"
    />
  </form>

  <div class="wrapper">
  <div class="guestlist">
    <ul class="attendes">
      <li *ngFor="let member of members">
        <div class="item">
          <ng-container *ngIf="this.room.createdBy === this.getCurrentUserId()">
            <div
              class="user-actions"
              *ngIf="this.room.createdBy !== member.userId"
            >
              <!-- close icon -->
              <svg
                class="remove"
                (click)="onDelete(member.userId)"
                viewBox="0 -960 960 960"
              >
                <path
                  d="M252-203.69 205.69-252l227-228-227-230L252-758.31l229 230 227-230L754.31-710l-227 230 227 228L708-203.69l-227-230-229 230Z"
                />
              </svg>
            </div>
          </ng-container>

          <!-- FUTURE IMPROVEMENTS -->
          <!-- user image -->
          <!-- <img src="http://placehold.it/50x50" alt="" /> -->
          <div class="user-info">
            <span class="name">
              <span
                class="owner"
                *ngIf="this.room.createdBy === member.userId"
                >{{ "meeple.room.room_owner" | translate }}</span
              >{{ member.username }} 
              <!--   -
            <span class="age">
                {{
                  "meeple.room.room_person_age"
                    | translate : { age: member.age }
                }}</span
              > -->
            </span>
            <br />
            <small
              >{{ "meeple.room.room_person_joined_at" | translate }}
              {{
                member.joinedAt
                  | date : DATE_FORMAT : undefined : this.currentLanguage
              }}</small
            >
          </div>
        </div>
      </li>
    </ul>
  </div>
  </div>
</section>
