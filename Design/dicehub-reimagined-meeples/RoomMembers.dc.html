<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Sora:wght@400;500;600;700&display=swap');
    :root {
      --bg: oklch(0.15 0.018 290);
      --bg-elevated: oklch(0.195 0.02 290);
      --bg-elevated-2: oklch(0.245 0.022 290);
      --border: oklch(0.34 0.02 290 / 0.55);
      --text: oklch(0.96 0.01 90);
      --text-muted: oklch(0.7 0.02 290);
      --text-faint: oklch(0.52 0.02 290);
      --amber: oklch(0.78 0.16 75);
      --amber-soft: oklch(0.78 0.16 75 / 0.16);
      --coral: oklch(0.68 0.19 25);
      --teal: oklch(0.72 0.14 165);
      --violet: oklch(0.66 0.17 300);
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: #0b0b0d; font-family: 'Sora', ui-sans-serif, system-ui, sans-serif; }
    .display { font-family: 'Bricolage Grotesque', ui-sans-serif, system-ui, sans-serif; }
    .icon-btn { width: 42px; height: 42px; border-radius: 999px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .member { display: flex; align-items: center; gap: 12px; background: var(--bg-elevated); border: 1px solid var(--border); border-radius: 16px; padding: 12px 14px; }
    .avatar { width: 40px; height: 40px; border-radius: 50%; flex-shrink: 0; }
    .owner-badge { font-size: 9.5px; font-weight: 800; letter-spacing: 0.04em; color: var(--amber); text-transform: uppercase; }
  </style>
</helmet>

<div style="width:393px;background:var(--bg);color:var(--text);padding:24px 20px 40px;display:flex;flex-direction:column;gap:20px;">

  <div style="display:flex;align-items:center;justify-content:space-between;">
    <div class="icon-btn" style="background:var(--bg-elevated);border:1px solid var(--border);">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--text)" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
    </div>
    <span class="display" style="font-size:17px;font-weight:700;">Room Members</span>
    <div style="width:42px;"></div>
  </div>

  <div style="display:flex;align-items:center;gap:10px;background:var(--bg-elevated);border:1px solid var(--border);border-radius:999px;padding:13px 18px;">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--text-faint)" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M20 20l-4.8-4.8"/></svg>
    <span style="font-size:14px;color:var(--text-faint);font-weight:500;">Search members…</span>
  </div>

  <div style="display:flex;flex-direction:column;gap:10px;">

    <div class="member">
      <div class="avatar" style="background:linear-gradient(135deg,var(--amber),var(--coral));"></div>
      <div style="flex:1;display:flex;flex-direction:column;gap:2px;">
        <span class="owner-badge">Room owner</span>
        <span style="font-size:14px;font-weight:700;">Maya R.</span>
        <span style="font-size:11px;color:var(--text-faint);">Joined Aug 20, 2026</span>
      </div>
    </div>

    <div class="member">
      <div class="avatar" style="background:linear-gradient(135deg,var(--teal),var(--violet));"></div>
      <div style="flex:1;display:flex;flex-direction:column;gap:2px;">
        <span style="font-size:14px;font-weight:700;">Jon C.</span>
        <span style="font-size:11px;color:var(--text-faint);">Joined Aug 20, 2026</span>
      </div>
      <svg width="16" height="16" viewBox="0 -960 960 960" fill="var(--text-faint)" style="flex-shrink:0;"><path d="M252-203.69 205.69-252l227-228-227-230L252-758.31l229 230 227-230L754.31-710l-227 230 227 228L708-203.69l-227-230-229 230Z"/></svg>
    </div>

    <div class="member">
      <div class="avatar" style="background:var(--bg-elevated-2);display:flex;align-items:center;justify-content:center;font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:14px;color:var(--text-muted);">SL</div>
      <div style="flex:1;display:flex;flex-direction:column;gap:2px;">
        <span style="font-size:14px;font-weight:700;">Sara L.</span>
        <span style="font-size:11px;color:var(--text-faint);">Joined Aug 21, 2026</span>
      </div>
      <svg width="16" height="16" viewBox="0 -960 960 960" fill="var(--text-faint)" style="flex-shrink:0;"><path d="M252-203.69 205.69-252l227-228-227-230L252-758.31l229 230 227-230L754.31-710l-227 230 227 228L708-203.69l-227-230-229 230Z"/></svg>
    </div>

  </div>

</div>
</x-dc>
<script data-dc-script data-props='{}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
