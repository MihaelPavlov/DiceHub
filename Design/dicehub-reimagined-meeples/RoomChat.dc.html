<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Sora:wght@400;500;600;700&display=swap');
    :root {
      --bg: oklch(0.15 0.018 290);
      --bg-elevated: oklch(0.195 0.02 290);
      --bg-elevated-2: oklch(0.245 0.022 290);
      --border: oklch(0.34 0.02 290 / 0.55);
      --text: oklch(0.96 0.01 90);
      --text-muted: oklch(0.7 0.02 290);
      --text-faint: oklch(0.52 0.02 290);
      --amber: oklch(0.78 0.16 75);
      --coral: oklch(0.68 0.19 25);
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: #0b0b0d; font-family: 'Sora', ui-sans-serif, system-ui, sans-serif; }
    .display { font-family: 'Bricolage Grotesque', ui-sans-serif, system-ui, sans-serif; }
    .icon-btn { width: 42px; height: 42px; border-radius: 999px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .username { font-size: 10.5px; font-weight: 700; color: var(--text-faint); padding: 0 4px; }
    .bubble { font-size: 13.5px; line-height: 1.4; padding: 11px 15px; border-radius: 18px; max-width: 78%; }
    .bubble.left { background: var(--bg-elevated); border: 1px solid var(--border); border-bottom-left-radius: 5px; align-self: flex-start; }
    .bubble.right { background: linear-gradient(135deg,var(--amber),var(--coral)); color: #2b1502; font-weight: 600; border-bottom-right-radius: 5px; align-self: flex-end; }
    .info-msg { text-align: center; font-size: 11px; color: var(--text-faint); padding: 2px 0; }
  </style>
</helmet>

<div style="width:393px;height:780px;background:var(--bg);color:var(--text);padding:24px 20px 20px;display:flex;flex-direction:column;gap:16px;">

  <div style="display:flex;align-items:center;justify-content:space-between;">
    <div class="icon-btn" style="background:var(--bg-elevated);border:1px solid var(--border);">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--text)" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
    </div>
    <div style="display:flex;flex-direction:column;align-items:center;">
      <span class="display" style="font-size:13px;font-weight:700;color:var(--text-faint);">Lobby</span>
      <span class="display" style="font-size:16px;font-weight:800;">Dice Wizards</span>
    </div>
    <div class="icon-btn" style="background:var(--bg-elevated);border:1px solid var(--border);">
      <svg width="18" height="18" viewBox="0 -960 960 960" fill="var(--text-faint)"><path d="M479.87-192q-25.15 0-42.85-17.69-17.69-17.7-17.69-42.85t17.69-42.85q17.7-17.69 42.85-17.69t42.85 17.69q17.69 17.7 17.69 42.85t-17.69 42.85Q505.02-192 479.87-192Zm0-227.87q-25.15 0-42.85-17.69-17.69-17.7-17.69-42.85t17.69-42.85q17.7-17.69 42.85-17.69t42.85 17.69q17.69 17.7 17.69 42.85t-17.69 42.85q-17.7 17.69-42.85 17.69Zm0-227.86q-25.15 0-42.85-17.7-17.69-17.69-17.69-42.85 0-25.15 17.69-42.85Q454.72-768 479.87-768t42.85 17.69q17.69 17.7 17.69 42.85 0 25.16-17.69 42.85-17.7 17.7-42.85 17.7Z"/></svg>
    </div>
  </div>

  <div style="flex:1;display:flex;flex-direction:column;gap:6px;overflow-y:auto;padding:4px 2px;">

    <div class="info-msg">Sara L. joined the room</div>

    <div style="display:flex;flex-direction:column;align-items:flex-start;">
      <span class="username">Maya R.</span>
      <div class="bubble left">Hey everyone! Table's set up near the window 🎲</div>
    </div>

    <div style="display:flex;flex-direction:column;align-items:flex-start;">
      <div class="bubble left" style="margin-top:2px;">See you all at 7?</div>
    </div>

    <div style="display:flex;flex-direction:column;align-items:flex-end;">
      <span class="username" style="align-self:flex-end;">You</span>
      <div class="bubble right">Yep, on my way now 🚗</div>
    </div>

    <div style="display:flex;flex-direction:column;align-items:flex-start;">
      <span class="username">Jon C.</span>
      <div class="bubble left">Bringing snacks, don't wait on me if I'm a few min late</div>
    </div>

    <div class="info-msg">Theo B. joined the room</div>

  </div>

  <div style="display:flex;align-items:center;gap:10px;background:var(--bg-elevated);border:1px solid var(--border);border-radius:999px;padding:8px 8px 8px 18px;">
    <input type="text" placeholder="Write your message…" style="flex:1;background:transparent;border:none;outline:none;color:var(--text);font-size:14px;font-family:'Sora',sans-serif;" />
    <div class="icon-btn" style="width:38px;height:38px;background:linear-gradient(135deg,var(--amber),var(--coral));">
      <svg width="17" height="17" viewBox="0 -960 960 960" fill="#2b1502"><path d="m317.23-83.69-59.54-59.54L595.46-481 257.69-818.77l59.54-59.54L714.54-481 317.23-83.69Z"/></svg>
    </div>
  </div>

</div>
</x-dc>
<script data-dc-script data-props='{}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
