<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Sora:wght@400;500;600;700&display=swap');
    :root {
      --bg: oklch(0.15 0.018 290);
      --bg-elevated: oklch(0.195 0.02 290);
      --bg-elevated-2: oklch(0.245 0.022 290);
      --border: oklch(0.34 0.02 290 / 0.55);
      --text: oklch(0.96 0.01 90);
      --text-muted: oklch(0.7 0.02 290);
      --text-faint: oklch(0.52 0.02 290);
      --coral: oklch(0.68 0.19 25);
      --coral-soft: oklch(0.68 0.19 25 / 0.16);
      --shadow-card: 0 10px 30px -12px oklch(0 0 0 / 0.55);
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: #0b0b0d; font-family: 'Sora', ui-sans-serif, system-ui, sans-serif; }
    .display { font-family: 'Bricolage Grotesque', ui-sans-serif, system-ui, sans-serif; }
    .icon-btn { width: 42px; height: 42px; border-radius: 999px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .row { display: flex; align-items: center; gap: 14px; background: var(--bg-elevated); border: 1px solid var(--border); border-radius: 18px; padding: 14px; }
    .thumb { width: 52px; height: 52px; border-radius: 14px; flex-shrink: 0; background: var(--bg-elevated-2); display: flex; align-items: center; justify-content: center; }
  </style>
</helmet>

<div style="width:393px;background:var(--bg);color:var(--text);padding:24px 20px 40px;display:flex;flex-direction:column;gap:22px;">

  <div class="icon-btn" style="background:var(--bg-elevated);border:1px solid var(--border);">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--text)" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
  </div>

  <div style="display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center;">
    <div style="width:64px;height:64px;border-radius:20px;background:var(--coral-soft);display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow-card);">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="var(--coral)" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3"/><path d="M3 19c.8-3.3 3-5 6-5s5.2 1.7 6 5"/><circle cx="17" cy="9" r="2.4"/><path d="M15.5 12.2c2.6.2 4 1.7 4.6 4.3"/></svg>
    </div>
    <div style="display:flex;flex-direction:column;gap:4px;">
      <span class="display" style="font-size:19px;font-weight:800;color:var(--coral);">Meeples</span>
      <span style="font-size:12.5px;color:var(--text-muted);line-height:1.55;max-width:280px;">Find a group, host your own room, or jump into someone else's game.</span>
    </div>
  </div>

  <div style="display:flex;flex-direction:column;gap:10px;">

    <a href="#" class="row">
      <div class="thumb">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="var(--text-faint)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3"/><path d="M3 19c.8-3.3 3-5 6-5s5.2 1.7 6 5"/><circle cx="17" cy="9" r="2.4"/><path d="M15.5 12.2c2.6.2 4 1.7 4.6 4.3"/></svg>
      </div>
      <div style="flex:1;display:flex;flex-direction:column;gap:3px;">
        <span style="font-size:14px;font-weight:700;">Viewing available groups</span>
        <span style="font-size:11.5px;color:var(--text-muted);">See who's looking for players right now.</span>
      </div>
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="var(--text-faint)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;"><path d="M9 5l7 7-7 7"/></svg>
    </a>

    <a href="#" class="row">
      <div class="thumb">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="var(--text-faint)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
      </div>
      <div style="flex:1;display:flex;flex-direction:column;gap:3px;">
        <span style="font-size:14px;font-weight:700;">Creating a room</span>
        <span style="font-size:11.5px;color:var(--text-muted);">Host your own table and invite others to join.</span>
      </div>
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="var(--text-faint)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;"><path d="M9 5l7 7-7 7"/></svg>
    </a>

    <a href="#" class="row">
      <div class="thumb">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="var(--text-faint)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M244-420h310M244-285h472M244-555h472"/></svg>
      </div>
      <div style="flex:1;display:flex;flex-direction:column;gap:3px;">
        <span style="font-size:14px;font-weight:700;">Joining a room &amp; chat</span>
        <span style="font-size:11.5px;color:var(--text-muted);">Jump into an existing room and use the lobby chat.</span>
      </div>
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="var(--text-faint)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;"><path d="M9 5l7 7-7 7"/></svg>
    </a>

  </div>

</div>
</x-dc>
<script data-dc-script data-props='{}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
