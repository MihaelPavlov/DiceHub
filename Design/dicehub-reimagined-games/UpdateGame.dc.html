<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Sora:wght@400;500;600;700&display=swap');
    :root {
      --bg: oklch(0.15 0.018 290);
      --bg-elevated: oklch(0.195 0.02 290);
      --bg-elevated-2: oklch(0.245 0.022 290);
      --border: oklch(0.34 0.02 290 / 0.55);
      --text: oklch(0.96 0.01 90);
      --text-muted: oklch(0.7 0.02 290);
      --text-faint: oklch(0.52 0.02 290);
      --teal: oklch(0.72 0.14 165);
      --teal-soft: oklch(0.72 0.14 165 / 0.16);
      --shadow-card: 0 10px 30px -12px oklch(0 0 0 / 0.55);
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: #0b0b0d; font-family: 'Sora', ui-sans-serif, system-ui, sans-serif; }
    .display { font-family: 'Bricolage Grotesque', ui-sans-serif, system-ui, sans-serif; }
    .field-label { font-size: 12px; font-weight: 700; color: var(--text-muted); margin-bottom: 7px; display: block; }
    .field-input { width: 100%; background: var(--bg-elevated-2); border: 1px solid var(--border); border-radius: 14px; padding: 13px 15px; font-size: 14px; color: var(--text); font-family: 'Sora', sans-serif; }
    .icon-btn { width: 42px; height: 42px; border-radius: 999px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  </style>
</helmet>

<div style="width:393px;background:var(--bg);color:var(--text);padding:24px 20px 60px;display:flex;flex-direction:column;gap:20px;">

  <div style="display:flex;align-items:center;justify-content:space-between;">
    <div style="display:flex;align-items:center;gap:14px;">
      <div class="icon-btn" style="background:var(--bg-elevated);border:1px solid var(--border);">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--text)" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
      </div>
      <span class="display" style="font-size:21px;font-weight:800;">Update Game</span>
    </div>
    <div class="icon-btn" style="background:var(--bg-elevated);border:1px solid var(--border);padding:8px;">
      <img src="qr-code.png" alt="QR code" style="width:100%;height:100%;object-fit:contain;">
    </div>
  </div>

  <div style="display:flex;flex-direction:column;align-items:center;gap:10px;">
    <div style="width:120px;height:120px;border-radius:24px;overflow:hidden;background:linear-gradient(150deg,#5a4fcf,#8ea2ff);box-shadow:var(--shadow-card);"></div>
    <span style="font-size:12.5px;color:var(--text-faint);">Tap to change cover image</span>
  </div>

  <div>
    <label class="field-label">Category</label>
    <select class="field-input">
      <option selected>Strategy</option>
      <option>Party</option>
      <option>Co-op</option>
      <option>Card Game</option>
    </select>
  </div>

  <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;">
    <div>
      <label class="field-label">Min age</label>
      <input class="field-input" type="number" value="8" />
    </div>
    <div>
      <label class="field-label">Avg. playtime</label>
      <select class="field-input">
        <option selected>60–90 min</option>
        <option>30–45 min</option>
      </select>
    </div>
  </div>

  <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;">
    <div>
      <label class="field-label">Min players</label>
      <input class="field-input" type="number" value="3" />
    </div>
    <div>
      <label class="field-label">Max players</label>
      <input class="field-input" type="number" value="4" />
    </div>
  </div>

  <div>
    <label class="field-label">Name</label>
    <input class="field-input" type="text" value="Catan" />
  </div>

  <div>
    <label class="field-label">Description</label>
    <textarea class="field-input" rows="4" style="resize:none;">Trade, build and settle the island of Catan before your rivals do.</textarea>
  </div>

  <a href="#" style="text-align:center;font-size:14px;font-weight:700;padding:15px 0;border-radius:999px;background:var(--teal);color:#062017;box-shadow:0 10px 24px -8px var(--teal-soft);margin-top:6px;">Update Game</a>

</div>
</x-dc>
<script data-dc-script data-props='{}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
