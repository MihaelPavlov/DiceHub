<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Sora:wght@400;500;600;700&display=swap');
    :root {
      --bg: oklch(0.15 0.018 290);
      --bg-elevated: oklch(0.195 0.02 290);
      --bg-elevated-2: oklch(0.245 0.022 290);
      --border: oklch(0.34 0.02 290 / 0.55);
      --text: oklch(0.96 0.01 90);
      --text-muted: oklch(0.7 0.02 290);
      --text-faint: oklch(0.52 0.02 290);
      --amber: oklch(0.78 0.16 75);
      --amber-soft: oklch(0.78 0.16 75 / 0.16);
      --coral: oklch(0.68 0.19 25);
      --teal: oklch(0.72 0.14 165);
      --teal-soft: oklch(0.72 0.14 165 / 0.16);
      --shadow-card: 0 10px 30px -12px oklch(0 0 0 / 0.55);
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: #0b0b0d; font-family: 'Sora', ui-sans-serif, system-ui, sans-serif; }
    .display { font-family: 'Bricolage Grotesque', ui-sans-serif, system-ui, sans-serif; }
    .icon-btn { width: 42px; height: 42px; border-radius: 999px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .field-label { font-size: 12px; font-weight: 700; color: var(--text-muted); margin-bottom: 7px; display: block; }
    .field-label.required::after { content: ' *'; color: var(--coral); }
    .field-input { width: 100%; background: var(--bg-elevated-2); border: 1px solid var(--border); border-radius: 14px; padding: 13px 15px; font-size: 14px; color: var(--text); font-family: 'Sora', sans-serif; text-align: center; font-weight: 700; }
    .die { width: 92px; height: 92px; border-radius: 20px; background: linear-gradient(155deg, var(--bg-elevated-2), var(--bg-elevated)); border: 1px solid var(--border); position: relative; box-shadow: var(--shadow-card); }
    .pip { width: 13px; height: 13px; border-radius: 50%; background: var(--amber); position: absolute; }
    .slot { flex-shrink: 0; font-size: 12.5px; font-weight: 700; padding: 10px 16px; border-radius: 999px; background: var(--bg-elevated); border: 1px solid var(--border); color: var(--text-muted); }
    .slot.active { background: var(--amber); color: #2b1a02; border-color: var(--amber); }
  </style>
</helmet>

<div style="width:393px;background:var(--bg);color:var(--text);padding:24px 20px 40px;display:flex;flex-direction:column;gap:20px;">

  <div style="display:flex;align-items:center;justify-content:space-between;">
    <div class="icon-btn" style="background:var(--bg-elevated);border:1px solid var(--border);">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--text)" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
    </div>
    <span class="display" style="font-size:18px;font-weight:700;">Book a Table</span>
    <div class="icon-btn" style="background:var(--bg-elevated);border:1px solid var(--border);">
      <svg width="17" height="17" viewBox="0 -960 960 960" fill="var(--text-faint)"><path d="M448-284h66v-236h-66v236Zm31.82-308.92q14.64 0 24.72-9.9 10.08-9.91 10.08-24.54 0-14.64-9.91-24.72-9.9-10.07-24.53-10.07-14.64 0-24.72 9.9-10.08 9.9-10.08 24.54 0 14.63 9.91 24.71 9.9 10.08 24.53 10.08ZM480.13-88q-81.31 0-152.89-30.86-71.57-30.86-124.52-83.76-52.95-52.9-83.83-124.42Q88-398.55 88-479.87q0-81.56 30.92-153.37 30.92-71.8 83.92-124.91 53-53.12 124.42-83.48Q398.67-872 479.87-872q81.55 0 153.35 30.34 71.79 30.34 124.92 83.42 53.13 53.08 83.49 124.84Q872-561.64 872-480.05q0 81.59-30.34 152.83-30.34 71.23-83.41 124.28-53.07 53.05-124.81 84Q561.7-88 480.13-88Z"/></svg>
    </div>
  </div>

  <!-- Dice guest picker -->
  <div style="display:flex;flex-direction:column;align-items:center;gap:16px;">
    <label class="field-label required" style="margin-bottom:0;">Number of guests</label>

    <div style="display:flex;align-items:center;gap:22px;">
      <div class="icon-btn" style="width:44px;height:44px;background:var(--bg-elevated);border:1px solid var(--border);">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--text)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/></svg>
      </div>

      <div class="die">
        <div class="pip" style="top:20px;left:20px;"></div>
        <div class="pip" style="top:20px;right:20px;"></div>
        <div class="pip" style="bottom:20px;left:20px;"></div>
        <div class="pip" style="bottom:20px;right:20px;"></div>
      </div>

      <div class="icon-btn" style="width:44px;height:44px;background:var(--amber);">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#2b1a02" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
      </div>
    </div>

    <input class="field-input" style="width:90px;" type="number" value="4" />
  </div>

  <div>
    <label class="field-label required">Reservation date</label>
    <input class="field-input" style="text-align:left;font-weight:600;" type="text" value="Aug 24, 2026" />
  </div>

  <div>
    <label class="field-label required">Available time slots</label>
    <div style="display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;">
      <div class="slot">17:00</div>
      <div class="slot">17:30</div>
      <div class="slot active">18:00</div>
      <div class="slot">18:30</div>
      <div class="slot">19:00</div>
      <div class="slot">19:30</div>
      <div class="slot">20:00</div>
    </div>
  </div>

  <a href="#" style="text-align:center;font-size:14px;font-weight:700;padding:15px 0;border-radius:999px;background:var(--teal);color:#062420;box-shadow:0 10px 24px -8px var(--teal-soft);margin-top:6px;">Book table</a>

</div>
</x-dc>
<script data-dc-script data-props='{}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
