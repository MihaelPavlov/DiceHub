<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Sora:wght@400;500;600;700&display=swap');
    :root {
      --bg: oklch(0.15 0.018 290);
      --bg-elevated: oklch(0.195 0.02 290);
      --bg-elevated-2: oklch(0.245 0.022 290);
      --border: oklch(0.34 0.02 290 / 0.55);
      --text: oklch(0.96 0.01 90);
      --text-muted: oklch(0.7 0.02 290);
      --text-faint: oklch(0.52 0.02 290);
      --amber: oklch(0.78 0.16 75);
      --amber-soft: oklch(0.78 0.16 75 / 0.16);
      --coral: oklch(0.68 0.19 25);
      --coral-soft: oklch(0.68 0.19 25 / 0.16);
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: #0b0b0d; font-family: 'Sora', ui-sans-serif, system-ui, sans-serif; }
    .display { font-family: 'Bricolage Grotesque', ui-sans-serif, system-ui, sans-serif; }
    .icon-btn { width: 42px; height: 42px; border-radius: 999px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .chip { font-size: 10.5px; font-weight: 700; padding: 5px 10px; border-radius: 999px; flex-shrink: 0; }
    .chip.amber { background: var(--amber-soft); color: var(--amber); }
    .chip.coral { background: var(--coral-soft); color: var(--coral); }
    .row { background: var(--bg-elevated); border: 1px solid var(--border); border-radius: 20px; padding: 14px; display: flex; flex-direction: column; gap: 12px; }
  </style>
</helmet>

<div style="width:393px;background:var(--bg);color:var(--text);padding:24px 20px 40px;display:flex;flex-direction:column;gap:20px;">

  <div style="display:flex;align-items:center;justify-content:space-between;">
    <div class="icon-btn" style="background:var(--bg-elevated);border:1px solid var(--border);">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--text)" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
    </div>
    <span class="display" style="font-size:17px;font-weight:700;">Join a Table</span>
    <div style="width:42px;"></div>
  </div>

  <div style="display:flex;align-items:center;gap:10px;background:var(--bg-elevated);border:1px solid var(--border);border-radius:999px;padding:13px 18px;">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--text-faint)" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M20 20l-4.8-4.8"/></svg>
    <span style="font-size:14px;color:var(--text-faint);font-weight:500;">Search tables…</span>
  </div>

  <div style="display:flex;flex-direction:column;gap:12px;">

    <div class="row">
      <div style="display:flex;gap:12px;align-items:center;">
        <div style="flex:1;display:flex;flex-direction:column;gap:6px;">
          <span style="font-size:14px;font-weight:700;">Table — "Dice Wizards"</span>
          <span style="font-size:12px;color:var(--text-muted);">Playing <b style="color:var(--text);">Catan</b></span>
          <div style="display:flex;gap:6px;">
            <span class="chip amber">3 joined</span>
            <span class="chip coral">4 max</span>
          </div>
        </div>
        <div style="width:58px;height:58px;border-radius:14px;flex-shrink:0;background:linear-gradient(150deg,#5a4fcf,#8ea2ff);"></div>
      </div>
      <a href="#" style="text-align:center;font-size:12.5px;font-weight:700;padding:11px 0;border-radius:999px;background:var(--amber);color:#2b1a02;">Join the table</a>
    </div>

    <div class="row">
      <div style="display:flex;gap:12px;align-items:center;">
        <div style="flex:1;display:flex;flex-direction:column;gap:6px;">
          <span style="font-size:14px;font-weight:700;">Table — "Bird Watchers"</span>
          <span style="font-size:12px;color:var(--text-muted);">Playing <b style="color:var(--text);">Wingspan</b></span>
          <div style="display:flex;gap:6px;">
            <span class="chip amber">2 joined</span>
            <span class="chip coral">5 max</span>
          </div>
        </div>
        <div style="width:58px;height:58px;border-radius:14px;flex-shrink:0;background:linear-gradient(135deg,#46945b,#a3d78a);"></div>
      </div>
      <a href="#" style="text-align:center;font-size:12.5px;font-weight:700;padding:11px 0;border-radius:999px;background:var(--amber);color:#2b1a02;">Join the table</a>
    </div>

    <div class="row">
      <div style="display:flex;gap:12px;align-items:center;">
        <div style="flex:1;display:flex;flex-direction:column;gap:6px;">
          <span style="font-size:14px;font-weight:700;">Table — "Tile Layers"</span>
          <span style="font-size:12px;color:var(--text-muted);">Playing <b style="color:var(--text);">Azul</b></span>
          <div style="display:flex;gap:6px;">
            <span class="chip amber">4 joined</span>
            <span class="chip coral">4 max</span>
          </div>
        </div>
        <div style="width:58px;height:58px;border-radius:14px;flex-shrink:0;background:linear-gradient(135deg,#977f33,#fccd3d);"></div>
      </div>
      <div style="display:flex;align-items:center;gap:10px;">
        <a href="#" style="flex:1;text-align:center;font-size:12.5px;font-weight:700;padding:11px 0;border-radius:999px;background:var(--bg-elevated-2);border:1px solid var(--border);color:var(--text-faint);">Join the table</a>
        <div class="icon-btn" style="width:38px;height:38px;background:var(--bg-elevated-2);border:1px solid var(--border);">
          <img src="locked.png" style="width:19px;height:19px;object-fit:contain;">
        </div>
      </div>
    </div>

  </div>

</div>
</x-dc>
<script data-dc-script data-props='{}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
