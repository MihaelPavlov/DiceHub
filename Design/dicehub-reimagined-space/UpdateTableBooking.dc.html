<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Sora:wght@400;500;600;700&display=swap');
    :root {
      --bg: oklch(0.15 0.018 290);
      --bg-elevated: oklch(0.195 0.02 290);
      --bg-elevated-2: oklch(0.245 0.022 290);
      --border: oklch(0.34 0.02 290 / 0.55);
      --text: oklch(0.96 0.01 90);
      --text-muted: oklch(0.7 0.02 290);
      --text-faint: oklch(0.52 0.02 290);
      --teal: oklch(0.72 0.14 165);
      --teal-soft: oklch(0.72 0.14 165 / 0.16);
      --coral: oklch(0.68 0.19 25);
      --shadow-card: 0 10px 30px -12px oklch(0 0 0 / 0.55);
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: #0b0b0d; font-family: 'Sora', ui-sans-serif, system-ui, sans-serif; }
    .display { font-family: 'Bricolage Grotesque', ui-sans-serif, system-ui, sans-serif; }
    .icon-btn { width: 42px; height: 42px; border-radius: 999px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .field-label { font-size: 12px; font-weight: 700; color: var(--text-muted); margin-bottom: 7px; display: block; }
    .field-label.required::after { content: ' *'; color: var(--coral); }
    .field-input { width: 100%; background: var(--bg-elevated-2); border: 1px solid var(--border); border-radius: 14px; padding: 13px 15px; font-size: 14px; color: var(--text); font-family: 'Sora', sans-serif; }
  </style>
</helmet>

<div style="width:393px;background:var(--bg);color:var(--text);padding:24px 20px 40px;display:flex;flex-direction:column;gap:18px;">

  <div style="display:flex;align-items:center;justify-content:space-between;">
    <div class="icon-btn" style="background:var(--bg-elevated);border:1px solid var(--border);">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--text)" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
    </div>
    <span class="display" style="font-size:18px;font-weight:700;">Update Table</span>
    <div class="icon-btn" style="background:var(--teal-soft);">
      <svg width="18" height="18" viewBox="0 -960 960 960" fill="var(--teal)"><path d="M120-520v-320h320v320H120Zm80-80h160v-160H200v160Zm-80 480v-320h320v320H120Zm80-80h160v-160H200v160Zm320-320v-320h320v320H520Zm80-80h160v-160H600v160Zm240 480v-80h80v80h-80ZM520-360v-80h80v80h-80Zm80 80v-80h80v80h-80Zm-80 80v-80h80v80h-80Zm80 80v-80h80v80h-80Zm80-80v-80h80v80h-80Zm0-160v-80h80v80h-80Zm80 80v-80h80v80h-80Z"/></svg>
    </div>
  </div>

  <div>
    <label class="field-label required">Scanned game</label>
    <div style="position:relative;">
      <input class="field-input" type="text" value="Catan" readonly style="color:var(--text-muted);padding-right:52px;" />
      <div style="position:absolute;top:6px;right:6px;width:34px;height:34px;border-radius:10px;background:var(--bg-elevated);display:flex;align-items:center;justify-content:center;">
        <img src="qr-code.png" style="width:18px;height:18px;object-fit:contain;">
      </div>
    </div>
  </div>

  <div style="display:flex;justify-content:center;">
    <div style="width:110px;height:110px;border-radius:22px;background:linear-gradient(150deg,#5a4fcf,#8ea2ff);box-shadow:var(--shadow-card);"></div>
  </div>

  <div>
    <label class="field-label required">Table name</label>
    <input class="field-input" type="text" value="Dice Wizards" />
  </div>

  <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;">
    <div>
      <label class="field-label required">Max people</label>
      <input class="field-input" type="number" value="4" />
    </div>
    <div>
      <label class="field-label">Password</label>
      <div style="position:relative;">
        <input class="field-input" type="password" value="4471" style="padding-right:42px;" />
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="var(--text-faint)" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" style="position:absolute;top:13px;right:13px;"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
      </div>
    </div>
  </div>

  <span style="font-size:11.5px;color:var(--text-faint);line-height:1.5;">Leave the password empty for an open table anyone can join. Set one to keep it private — you'll share the code with your group.</span>

  <a href="#" style="text-align:center;font-size:14px;font-weight:700;padding:15px 0;border-radius:999px;background:var(--teal);color:#062420;box-shadow:0 10px 24px -8px var(--teal-soft);margin-top:6px;">Update table</a>

</div>
</x-dc>
<script data-dc-script data-props='{}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
