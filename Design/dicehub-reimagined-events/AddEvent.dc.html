<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Sora:wght@400;500;600;700&display=swap');
    :root {
      --bg: oklch(0.15 0.018 290);
      --bg-elevated: oklch(0.195 0.02 290);
      --bg-elevated-2: oklch(0.245 0.022 290);
      --border: oklch(0.34 0.02 290 / 0.55);
      --text: oklch(0.96 0.01 90);
      --text-muted: oklch(0.7 0.02 290);
      --text-faint: oklch(0.52 0.02 290);
      --amber: oklch(0.78 0.16 75);
      --amber-soft: oklch(0.78 0.16 75 / 0.16);
      --coral: oklch(0.68 0.19 25);
      --shadow-card: 0 10px 30px -12px oklch(0 0 0 / 0.55);
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: #0b0b0d; font-family: 'Sora', ui-sans-serif, system-ui, sans-serif; }
    .display { font-family: 'Bricolage Grotesque', ui-sans-serif, system-ui, sans-serif; }
    .icon-btn { width: 42px; height: 42px; border-radius: 999px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .field-label { font-size: 12px; font-weight: 700; color: var(--text-muted); margin-bottom: 7px; display: block; }
    .field-label.required::after { content: ' *'; color: var(--coral); }
    .field-input { width: 100%; background: var(--bg-elevated-2); border: 1px solid var(--border); border-radius: 14px; padding: 13px 15px; font-size: 14px; color: var(--text); font-family: 'Sora', sans-serif; }
    .field-input::placeholder { color: var(--text-faint); }
  </style>
</helmet>

<div style="width:393px;background:var(--bg);color:var(--text);padding:24px 20px 40px;display:flex;flex-direction:column;gap:20px;">

  <div style="display:flex;align-items:center;justify-content:space-between;">
    <div class="icon-btn" style="background:var(--bg-elevated);border:1px solid var(--border);">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--text)" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
    </div>
  </div>

  <div style="display:flex;flex-direction:column;gap:6px;">
    <span class="display" style="font-size:21px;font-weight:800;">Add Event</span>
    <span style="font-size:12.5px;color:var(--text-muted);line-height:1.5;">Schedule a session and let members reserve their seat.</span>
  </div>

  <div style="display:flex;flex-direction:column;align-items:center;gap:10px;">
    <div style="width:140px;height:140px;border-radius:22px;border:1.5px dashed var(--border);background:var(--bg-elevated);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="var(--text-faint)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4M12 4l-4 4M12 4l4 4"/><path d="M4 16v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg>
      <span style="font-size:11.5px;font-weight:600;color:var(--text-faint);">Upload image</span>
    </div>
  </div>

  <div style="display:flex;align-items:center;justify-content:space-between;background:var(--bg-elevated);border:1px solid var(--border);border-radius:14px;padding:13px 15px;">
    <span style="font-size:13.5px;font-weight:600;">Use a custom image</span>
    <div style="width:42px;height:24px;border-radius:999px;background:var(--bg-elevated-2);border:1px solid var(--border);position:relative;flex-shrink:0;">
      <div style="width:18px;height:18px;border-radius:999px;background:var(--text-faint);position:absolute;top:2px;left:2px;"></div>
    </div>
  </div>

  <div>
    <label class="field-label required">Game</label>
    <select class="field-input">
      <option>Select a game…</option>
      <option selected>Catan</option>
      <option>Wingspan</option>
      <option>Azul</option>
      <option>Splendor</option>
    </select>
  </div>

  <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;">
    <div>
      <label class="field-label required">Start date</label>
      <input class="field-input" type="text" placeholder="dd/mm/yyyy" />
    </div>
    <div>
      <label class="field-label required">Start time</label>
      <input class="field-input" type="text" placeholder="--:--" />
    </div>
  </div>

  <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;">
    <div>
      <label class="field-label required">Name</label>
      <input class="field-input" type="text" placeholder="Event name" />
    </div>
    <div>
      <label class="field-label required">Max people</label>
      <input class="field-input" type="number" placeholder="e.g. 8" />
    </div>
  </div>

  <div>
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:7px;">
      <label class="field-label required" style="margin-bottom:0;">Description</label>
      <div style="display:flex;gap:6px;">
        <span style="font-size:11px;font-weight:700;padding:5px 11px;border-radius:999px;background:var(--amber);color:#2b1a02;">EN</span>
        <span style="font-size:11px;font-weight:700;padding:5px 11px;border-radius:999px;background:var(--bg-elevated-2);border:1px solid var(--border);color:var(--text-faint);">BG</span>
      </div>
    </div>
    <textarea class="field-input" rows="4" placeholder="Tell members what to expect…" style="resize:none;"></textarea>
  </div>

  <a href="#" style="text-align:center;font-size:14px;font-weight:700;padding:15px 0;border-radius:999px;background:linear-gradient(135deg,var(--amber),var(--coral));color:#2b1502;box-shadow:0 10px 24px -8px var(--amber-soft);margin-top:4px;">Create event</a>

</div>
</x-dc>
<script data-dc-script data-props='{}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
