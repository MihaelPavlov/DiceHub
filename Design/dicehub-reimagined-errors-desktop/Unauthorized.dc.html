<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Sora:wght@400;500;600;700&display=swap');
    :root {
      --bg: oklch(0.15 0.018 290);
      --bg-elevated: oklch(0.195 0.02 290);
      --bg-elevated-2: oklch(0.245 0.022 290);
      --border: oklch(0.34 0.02 290 / 0.55);
      --text: oklch(0.96 0.01 90);
      --text-muted: oklch(0.7 0.02 290);
      --text-faint: oklch(0.52 0.02 290);
      --amber: oklch(0.78 0.16 75);
      --amber-soft: oklch(0.78 0.16 75 / 0.16);
      --coral: oklch(0.68 0.19 25);
      --coral-soft: oklch(0.68 0.19 25 / 0.16);
      --shadow-card: 0 20px 50px -16px oklch(0 0 0 / 0.7);
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: #0b0b0d; font-family: 'Sora', ui-sans-serif, system-ui, sans-serif; }
    .display { font-family: 'Bricolage Grotesque', ui-sans-serif, system-ui, sans-serif; }
    .eyebrow { font-size: 11.5px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; padding: 6px 14px; border-radius: 999px; }
  </style>
</helmet>

<div style="width:1440px;height:900px;position:relative;overflow:hidden;background:var(--bg);color:var(--text);display:flex;align-items:center;justify-content:center;">

  <div style="position:absolute;top:-160px;right:-160px;width:520px;height:520px;border-radius:50%;background:radial-gradient(circle,var(--amber-soft),transparent 70%);"></div>
  <div style="position:absolute;bottom:-200px;left:-160px;width:480px;height:480px;border-radius:50%;background:radial-gradient(circle,var(--coral-soft),transparent 70%);"></div>

  <span class="display" style="position:absolute;font-size:440px;font-weight:800;color:var(--text);opacity:0.04;letter-spacing:-0.02em;line-height:1;">401</span>

  <div style="position:absolute;top:40px;left:48px;display:flex;align-items:center;gap:10px;">
    <div style="width:32px;height:32px;border-radius:10px;background:linear-gradient(135deg,var(--amber),var(--coral));display:flex;align-items:center;justify-content:center;">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#2b1502" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M8 4h8v4a4 4 0 0 1-8 0z"/><path d="M8 5H5a3 3 0 0 0 3 5"/><path d="M16 5h3a3 3 0 0 1-3 5"/><path d="M10 13v3M14 13v3"/><path d="M8 20h8"/><path d="M9 17h6l1 3H8z"/></svg>
    </div>
    <span class="display" style="font-size:17px;font-weight:800;">DiceHub</span>
  </div>

  <div style="position:relative;display:flex;flex-direction:column;align-items:center;gap:22px;max-width:520px;text-align:center;">

    <div style="width:92px;height:92px;border-radius:26px;background:var(--amber-soft);border:1px solid var(--border);box-shadow:var(--shadow-card);display:flex;align-items:center;justify-content:center;">
      <svg width="42" height="42" viewBox="0 0 24 24" fill="none" stroke="var(--amber)" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="9.5" rx="2.5"/><path d="M8 11V7.5a4 4 0 0 1 8 0V11"/><circle cx="12" cy="15.3" r="1.3" fill="var(--amber)" stroke="none"/></svg>
    </div>

    <span class="eyebrow" style="background:var(--amber-soft);color:var(--amber);">Error 401</span>

    <span class="display" style="font-size:38px;font-weight:800;line-height:1.15;">Sign in to keep going</span>
    <span style="font-size:15px;color:var(--text-muted);line-height:1.65;">Your session has expired or you're not signed in. Log back in to view this page.</span>

    <a href="#" style="margin-top:6px;padding:15px 36px;text-align:center;font-size:14px;font-weight:700;border-radius:999px;background:linear-gradient(135deg,var(--amber),var(--coral));color:#2b1502;box-shadow:0 10px 24px -8px var(--amber-soft);">Back to home</a>

  </div>

</div>
</x-dc>
<script data-dc-script data-props='{}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
