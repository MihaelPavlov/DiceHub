<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Sora:wght@400;500;600;700&display=swap');
    :root {
      --bg: oklch(0.12 0.02 290);
      --text: oklch(0.97 0.01 90);
      --text-muted: oklch(0.82 0.02 90 / 0.8);
      --amber: oklch(0.78 0.16 75);
      --coral: oklch(0.68 0.19 25);
      --teal: oklch(0.72 0.14 165);
      --violet: oklch(0.66 0.17 300);
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: #0b0b0d; font-family: 'Sora', ui-sans-serif, system-ui, sans-serif; }
    .display { font-family: 'Bricolage Grotesque', ui-sans-serif, system-ui, sans-serif; }
    .confetti { position: absolute; border-radius: 3px; }
  </style>
</helmet>

<div style="width:393px;height:800px;background:radial-gradient(120% 90% at 50% 32%,oklch(0.3 0.09 60),var(--bg) 68%);color:var(--text);position:relative;overflow:hidden;">

  <div class="confetti" style="left:38px;top:96px;width:12px;height:12px;background:var(--teal);transform:rotate(18deg);"></div>
  <div class="confetti" style="left:322px;top:120px;width:10px;height:10px;background:var(--violet);transform:rotate(-12deg);"></div>
  <div class="confetti" style="left:66px;top:206px;width:8px;height:8px;background:var(--coral);border-radius:999px;"></div>
  <div class="confetti" style="left:300px;top:238px;width:14px;height:14px;background:var(--amber);transform:rotate(35deg);"></div>
  <div class="confetti" style="left:52px;top:340px;width:9px;height:9px;background:var(--violet);border-radius:999px;"></div>
  <div class="confetti" style="left:330px;top:360px;width:11px;height:11px;background:var(--teal);transform:rotate(-24deg);"></div>
  <div class="confetti" style="left:24px;top:452px;width:10px;height:10px;background:var(--amber);border-radius:999px;"></div>
  <div class="confetti" style="left:344px;top:470px;width:9px;height:9px;background:var(--coral);transform:rotate(10deg);"></div>

  <div style="position:absolute;left:20px;top:24px;">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="oklch(0.8 0.01 90 / 0.7)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12M18 6l-12 12"/></svg>
  </div>

  <div style="position:absolute;left:0;right:0;top:0;bottom:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;padding:0 32px;text-align:center;">

    <div style="width:112px;height:112px;border-radius:999px;background:linear-gradient(150deg,var(--amber),var(--coral));display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 10px oklch(0.78 0.16 75 / 0.14),0 20px 46px -14px oklch(0.6 0.18 50 / 0.7);">
      <svg width="52" height="52" viewBox="0 0 24 24" fill="none" stroke="#2b1502" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8 4h8v4a4 4 0 0 1-8 0z"/><path d="M8 5H5a3 3 0 0 0 3 5"/><path d="M16 5h3a3 3 0 0 1-3 5"/><path d="M10 13v3M14 13v3"/><path d="M8 20h8"/><path d="M9 17h6l1 3H8z"/></svg>
    </div>

    <div style="display:flex;flex-direction:column;gap:8px;">
      <span class="display" style="font-size:28px;font-weight:800;text-wrap:balance;">Challenge complete!</span>
      <span style="font-size:14.5px;color:var(--text-muted);">"Play 3 games this weekend" is done.</span>
    </div>

    <div style="display:flex;align-items:center;gap:10px;background:oklch(1 0 0 / 0.06);border:1px solid oklch(1 0 0 / 0.14);border-radius:999px;padding:10px 20px;">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--amber)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v4M12 18v4M4.9 4.9l2.8 2.8M16.3 16.3l2.8 2.8M2 12h4M18 12h4M4.9 19.1l2.8-2.8M16.3 7.7l2.8-2.8"/></svg>
      <span style="font-size:13.5px;font-weight:700;">+150 points earned</span>
    </div>

    <a href="#" style="margin-top:6px;text-align:center;font-size:14px;font-weight:700;padding:15px 44px;border-radius:999px;background:linear-gradient(135deg,var(--amber),var(--coral));color:#2b1502;box-shadow:0 12px 28px -10px oklch(0.78 0.16 75 / 0.55);">Awesome!</a>
  </div>

</div>
</x-dc>
<script data-dc-script data-props='{}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
