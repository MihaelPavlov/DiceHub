<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Sora:wght@400;500;600;700&display=swap');
    :root {
      --bg: oklch(0.15 0.018 290);
      --bg-elevated: oklch(0.195 0.02 290);
      --bg-elevated-2: oklch(0.245 0.022 290);
      --border: oklch(0.34 0.02 290 / 0.55);
      --text: oklch(0.96 0.01 90);
      --text-muted: oklch(0.7 0.02 290);
      --text-faint: oklch(0.52 0.02 290);
      --amber: oklch(0.78 0.16 75);
      --amber-soft: oklch(0.78 0.16 75 / 0.16);
      --teal: oklch(0.72 0.14 165);
      --teal-soft: oklch(0.72 0.14 165 / 0.16);
      --violet: oklch(0.66 0.17 300);
      --violet-soft: oklch(0.66 0.17 300 / 0.16);
      --shadow-panel: 0 20px 50px -16px oklch(0 0 0 / 0.65);
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: #0b0b0d; font-family: 'Sora', ui-sans-serif, system-ui, sans-serif; }
    .display { font-family: 'Bricolage Grotesque', ui-sans-serif, system-ui, sans-serif; }
    .icon-btn { width: 42px; height: 42px; border-radius: 999px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  </style>
</helmet>

<div style="width:393px;height:800px;background:var(--bg);color:var(--text);position:relative;overflow:hidden;">

  <div style="padding:24px 20px;display:flex;flex-direction:column;gap:14px;filter:brightness(0.55);">
    <div style="display:flex;align-items:center;justify-content:space-between;">
      <span class="display" style="font-size:20px;font-weight:700;">Good evening, Ivan</span>
    </div>
    <div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;">
      <div style="height:96px;border-radius:18px;background:var(--bg-elevated);border:1px solid var(--border);"></div>
      <div style="height:96px;border-radius:18px;background:var(--bg-elevated);border:1px solid var(--border);"></div>
    </div>
    <div style="height:140px;border-radius:20px;background:var(--bg-elevated);border:1px solid var(--border);"></div>
  </div>

  <!-- floating assistive-touch trigger, at full brightness -->
  <div style="position:absolute;right:20px;bottom:26px;width:54px;height:54px;border-radius:999px;background:linear-gradient(135deg,var(--violet),#5a4fcf);display:flex;align-items:center;justify-content:center;box-shadow:0 10px 26px -8px oklch(0.5 0.15 300 / 0.6);">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
    <span style="position:absolute;top:-2px;right:-2px;width:14px;height:14px;border-radius:999px;background:var(--coral,oklch(0.68 0.19 25));border:2px solid var(--bg);"></span>
  </div>

  <!-- Notifications panel -->
  <div style="position:absolute;right:20px;bottom:92px;width:300px;background:var(--bg-elevated);border:1px solid var(--border);border-radius:22px;padding:18px;box-shadow:var(--shadow-panel);display:flex;flex-direction:column;gap:14px;">

    <div style="display:flex;align-items:center;justify-content:space-between;">
      <span class="display" style="font-size:16px;font-weight:700;">Notifications</span>
      <div style="display:flex;align-items:center;gap:12px;">
        <span style="font-size:11.5px;font-weight:700;color:var(--teal);">Clear all</span>
        <div class="icon-btn" style="width:26px;height:26px;background:var(--bg-elevated-2);">
          <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="var(--text-faint)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12M18 6l-12 12"/></svg>
        </div>
      </div>
    </div>

    <div style="display:flex;flex-direction:column;gap:2px;">
      <div style="display:flex;align-items:flex-start;gap:11px;padding:11px 0;border-bottom:1px solid var(--border);position:relative;">
        <span style="position:absolute;left:-8px;top:16px;width:6px;height:6px;border-radius:999px;background:var(--teal);"></span>
        <div style="width:36px;height:36px;border-radius:11px;background:var(--teal-soft);display:flex;align-items:center;justify-content:center;flex-shrink:0;">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--teal)" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7"/></svg>
        </div>
        <div style="display:flex;flex-direction:column;gap:2px;">
          <span style="font-size:12.5px;font-weight:700;line-height:1.35;">Your reservation was approved</span>
          <span style="font-size:11px;color:var(--text-faint);">2 min ago</span>
        </div>
      </div>

      <div style="display:flex;align-items:flex-start;gap:11px;padding:11px 0;border-bottom:1px solid var(--border);position:relative;">
        <span style="position:absolute;left:-8px;top:16px;width:6px;height:6px;border-radius:999px;background:var(--amber);"></span>
        <div style="width:36px;height:36px;border-radius:11px;background:var(--amber-soft);display:flex;align-items:center;justify-content:center;flex-shrink:0;">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--amber)" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="5"/><path d="M9 12.5 7 21l5-3 5 3-2-8.5"/></svg>
        </div>
        <div style="display:flex;flex-direction:column;gap:2px;">
          <span style="font-size:12.5px;font-weight:700;line-height:1.35;">New challenge: Play 3 games</span>
          <span style="font-size:11px;color:var(--text-faint);">1 hour ago</span>
        </div>
      </div>

      <div style="display:flex;align-items:flex-start;gap:11px;padding:11px 0 0;">
        <div style="width:36px;height:36px;border-radius:11px;background:var(--bg-elevated-2);display:flex;align-items:center;justify-content:center;flex-shrink:0;">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--text-faint)" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="5" width="16" height="15" rx="3"/><path d="M4 10h16"/><path d="M8 3v4M16 3v4"/></svg>
        </div>
        <div style="display:flex;flex-direction:column;gap:2px;">
          <span style="font-size:12.5px;font-weight:600;line-height:1.35;color:var(--text-muted);">Board Game Night is tomorrow</span>
          <span style="font-size:11px;color:var(--text-faint);">Yesterday</span>
        </div>
      </div>
    </div>
  </div>

</div>
</x-dc>
<script data-dc-script data-props='{}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
