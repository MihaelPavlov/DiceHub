<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Bitter:wght@500;600;700&family=Karla:wght@400;500;600;700&display=swap');
    :root {
      --bg: oklch(0.19 0.02 50);
      --bg-elevated: oklch(0.245 0.025 50);
      --bg-elevated-2: oklch(0.30 0.03 50);
      --border: oklch(0.36 0.03 50 / 0.6);
      --text: oklch(0.94 0.015 80);
      --text-muted: oklch(0.68 0.02 60);
      --text-faint: oklch(0.5 0.02 60);
      --forest: oklch(0.68 0.12 155);
      --forest-soft: oklch(0.68 0.12 155 / 0.16);
      --forest-ink: oklch(0.2 0.03 150);
      --gold-soft: oklch(0.78 0.12 85 / 0.2);
      --blue: oklch(0.68 0.13 250);
      --blue-soft: oklch(0.68 0.13 250 / 0.16);
      --blue-fill: oklch(0.52 0.16 250);
      --green: oklch(0.68 0.11 150);
      --green-soft: oklch(0.68 0.11 150 / 0.16);
      --green-fill: oklch(0.5 0.13 150);
      --wine: oklch(0.68 0.15 22);
      --wine-soft: oklch(0.68 0.15 22 / 0.16);
      --wine-fill: oklch(0.5 0.17 22);
      --shadow-card: 0 12px 28px -14px oklch(0.05 0.02 50 / 0.65);
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: #17120f; font-family: 'Karla', ui-sans-serif, system-ui, sans-serif; }
    .display { font-family: 'Bitter', Georgia, serif; }
    .btn { border: none; border-radius: 999px; font-size: 12.5px; font-weight: 700; padding: 9px 18px; color: #fdfaf3; }
  </style>
</helmet>

<div style="width:393px;background:var(--bg);color:var(--text);padding:22px 20px 130px;display:flex;flex-direction:column;gap:20px;position:relative;">

  <div style="display:flex;align-items:center;justify-content:space-between;">
    <span class="display" style="font-size:23px;font-weight:700;">Weekly Challenges</span>
    <div style="width:44px;height:44px;border-radius:50%;background:var(--bg-elevated);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;padding:8px;">
      <img src="qr-code.png" alt="QR code" style="width:100%;height:100%;object-fit:contain;">
    </div>
  </div>

  <div style="display:flex;gap:8px;background:var(--bg-elevated-2);padding:4px;border-radius:14px;">
    <span style="flex:1;text-align:center;font-size:13px;font-weight:600;padding:9px 0;border-radius:11px;color:var(--text-faint);">Weekly</span>
    <span style="flex:1;text-align:center;font-size:13px;font-weight:700;padding:9px 0;border-radius:11px;background:var(--forest);color:var(--forest-ink);">Rewards</span>
  </div>

  <div style="display:flex;flex-direction:column;gap:14px;">

    <div style="background:var(--bg-elevated);border:1px solid var(--border);border-radius:18px;padding:16px;display:flex;gap:14px;box-shadow:var(--shadow-card);">
      <div style="width:56px;height:56px;border-radius:12px;background:var(--gold-soft);display:flex;align-items:center;justify-content:center;flex-shrink:0;padding:8px;">
        <img src="bronze_medal.png" alt="" style="width:100%;height:100%;object-fit:contain;">
      </div>
      <div style="display:flex;flex-direction:column;gap:6px;min-width:0;flex:1;">
        <span style="font-size:14px;font-weight:700;">Free coffee</span>
        <span style="font-size:12px;color:var(--text-muted);line-height:1.4;">One free coffee or tea at the club bar.</span>
        <span style="font-size:11.5px;font-weight:700;color:var(--blue);background:var(--blue-soft);padding:4px 10px;border-radius:999px;align-self:flex-start;">Available 6 more days</span>
      </div>
      <button class="btn" style="background:var(--blue-fill);align-self:center;flex-shrink:0;">Use</button>
    </div>

    <div style="background:var(--bg-elevated);border:1px solid var(--border);border-radius:18px;padding:16px;display:flex;gap:14px;box-shadow:var(--shadow-card);opacity:0.65;">
      <div style="width:56px;height:56px;border-radius:12px;background:var(--gold-soft);display:flex;align-items:center;justify-content:center;flex-shrink:0;padding:8px;">
        <img src="silver_medal.png" alt="" style="width:100%;height:100%;object-fit:contain;">
      </div>
      <div style="display:flex;flex-direction:column;gap:6px;min-width:0;flex:1;">
        <span style="font-size:14px;font-weight:700;">10% off table snacks</span>
        <span style="font-size:12px;color:var(--text-muted);line-height:1.4;">10% off any snack order during your visit.</span>
        <span style="font-size:11.5px;font-weight:700;color:var(--green);background:var(--green-soft);padding:4px 10px;border-radius:999px;align-self:flex-start;">Redeemed</span>
      </div>
      <button class="btn" style="background:var(--green-fill);align-self:center;flex-shrink:0;">Used</button>
    </div>

    <div style="background:var(--bg-elevated);border:1px solid var(--border);border-radius:18px;padding:16px;display:flex;gap:14px;box-shadow:var(--shadow-card);opacity:0.65;">
      <div style="width:56px;height:56px;border-radius:12px;background:var(--gold-soft);display:flex;align-items:center;justify-content:center;flex-shrink:0;padding:8px;">
        <img src="gold_medal.png" alt="" style="width:100%;height:100%;object-fit:contain;">
      </div>
      <div style="display:flex;flex-direction:column;gap:6px;min-width:0;flex:1;">
        <span style="font-size:14px;font-weight:700;">Free table reservation</span>
        <span style="font-size:12px;color:var(--text-muted);line-height:1.4;">One free 2-hour table booking, any night.</span>
        <span style="font-size:11.5px;font-weight:700;color:var(--wine);background:var(--wine-soft);padding:4px 10px;border-radius:999px;align-self:flex-start;">Expired</span>
      </div>
      <button class="btn" style="background:var(--wine-fill);align-self:center;flex-shrink:0;">Expired</button>
    </div>

  </div>

  <!-- Bottom nav — real IA: games / meeple / reservations · center FAB · events / profile -->
  <div style="position:absolute;left:20px;right:20px;bottom:22px;background:var(--bg-elevated);border:1px solid var(--border);border-radius:22px;padding:10px 6px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 14px 30px -14px oklch(0.3 0.05 60 / 0.35);">
    <div style="display:flex;flex-direction:column;align-items:center;gap:3px;width:17%;">

      <span style="font-size:9.5px;font-weight:600;color:var(--text-faint);">Games</span>
    </div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:3px;width:17%;">
      <svg width="20" height="20" viewBox="0 -960 960 960" fill="var(--text-faint)"><path d="M44.85-154.38v-96.85q0-34.85 16.61-59.24t44.57-38.67q56.05-27.78 113.62-44.01 57.58-16.23 136.2-16.23 78.27 0 135.52 16.23 57.25 16.23 113.29 44.01 27.97 14.28 44.58 38.67t16.61 59.24v96.85h-621Zm706 0v-102.7q0-32.77-12.58-73.14-12.57-40.37-42.42-68.47 41.46 6 79.27 18.65 37.8 12.66 72.5 30.96 31.83 16.85 49.68 41.86 17.85 25.01 17.85 50.14v102.7h-164.3ZM354.97-511.62q-61.05 0-104.53-43.47-43.47-43.48-43.47-104.53 0-61.05 43.47-104.52 43.48-43.48 104.53-43.48 61.05 0 104.52 43.48 43.48 43.47 43.48 104.52t-43.48 104.53q-43.47 43.47-104.52 43.47Z"/></svg>
      <span style="font-size:9.5px;font-weight:600;color:var(--text-faint);">Meeple</span>
    </div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:3px;width:17%;">
      <svg width="20" height="20" viewBox="0 -960 960 960" fill="var(--text-faint)"><path d="M555.38-568.31v-33.23q32.24-19.11 69.04-27.86 36.81-8.75 75.58-8.75 22.15 0 42.54 2.84 20.38 2.85 42.08 8.08v36.31q-20.93-6.7-40.81-9.27-19.89-2.58-43.81-2.58-38.77 0-75.69 8.73-36.93 8.73-68.93 25.73ZM256-308.46q52.38 0 101.88 12.54 49.5 12.54 98.12 38.69v-400.46q-43.31-29.93-95.46-44.89-52.16-14.96-104.54-14.96-36 0-65.04 4.31-29.04 4.31-62.04 16.27-9.23 3.08-13.07 8.85-3.85 5.77-3.85 12.69v368.34q0 10.77 7.69 15.77t16.93 1.16q24.92-9.39 53.98-13.85 29.06-4.46 65.4-4.46Zm250 51.23q48.62-26.15 97.12-38.69 48.5-12.54 100.88-12.54 36 0 65.23 4.46 29.23 4.46 54.15 13.85 9.24 3.84 16.93-1.16 7.69-5 7.69-15.77v-366.61q0-6.93-3.85-12.31-3.84-5.38-13.07-9.23-33-12.69-62.04-17.5-29.04-4.81-65.04-4.81-52.38 0-103.54 14.96-51.15 14.96-94.46 44.89v400.46Zm-26 72q-48.77-35.39-105.77-54.31-57-18.92-118.23-18.92-35.23 0-68.35 6.73Q154.54-245 124-230.46q-22.47 8.69-42.23-5.23Q62-249.61 62-274.15v-414.62q0-14.85 7.81-27.54T91.69-734q39.23-17.54 80.31-25.54 41.08-8 84-8 60.77 0 117.65 17.42 56.89 17.43 106.35 48.74 49.46-31.31 106.35-48.74 56.88-17.42 117.65-17.42 42.92 0 84 8T868.31-734q14.07 5 21.88 17.69 7.81 12.69 7.81 27.54v414.62q0 24.54-21.3 37.69-21.31 13.15-45.32 4.46-29.76-13.77-61.73-20.12-31.96-6.34-65.65-6.34-61.23 0-118.23 18.92-57 18.92-105.77 54.31Z"/></svg>
      <span style="font-size:9.5px;font-weight:600;color:var(--text-faint);">Reserve</span>
    </div>

    <div style="width:50px;height:50px;border-radius:50%;background:var(--forest);display:flex;align-items:center;justify-content:center;margin-top:-20px;box-shadow:0 8px 18px -6px oklch(0.68 0.12 155 / 0.4),0 0 0 5px var(--bg-elevated);flex-shrink:0;">
      <svg width="21" height="21" viewBox="0 -960 960 960" fill="var(--forest-ink)"><path d="M750.54-116.15 638.15-229.31l-88 88-11.07-11.07q-26.39-26.39-26.39-63.47 0-37.07 26.39-63.46l145.61-145.61q26.39-26.39 63.46-26.39 37.08 0 63.47 26.39l11.07 11.07-88 88 113.16 113.39q13.69 13.69 13.69 31.61 0 17.93-13.69 31.62l-33.08 33.08q-13.69 13.69-32.12 13.69-18.42 0-32.11-13.69ZM853-735.92 408.31-290.46l24.61 25.38q16.39 26.39 13.39 57.46-3 31.08-26.39 54.47l-11.07 11.07-88-88-113.39 114.16q-13.69 13.69-31.61 13.69-17.93 0-31.62-13.69L110.15-150q-13.69-13.69-13.69-31.62 0-17.92 13.69-31.61l114.16-113.39-88-88 11.07-11.07q23.39-23.39 54.97-26.39 31.57-3 57.96 14.39l26.15 25.38L731.92-857H853v121.08Z"/></svg>
    </div>

    <div style="display:flex;flex-direction:column;align-items:center;gap:3px;width:17%;">
      <svg width="20" height="20" viewBox="0 -960 960 960" fill="var(--text-faint)"><path d="M493.46-128q-137.84 0-239.42-88.08Q152.46-304.15 140.23-440h68.46Q222-333.77 302.43-263.88 382.85-194 491.46-194q118 0 201-83.5t83-202q0-118.5-82.08-202.5t-199.92-84q-69.01 0-129.66 30.23-60.65 30.23-101.42 84.23h109.24v66H155.46v-216.15h66v97.54q48.39-62.93 120.36-95.39Q413.8-832 493.46-832q72.37 0 135.66 27.64 63.29 27.64 110.56 75.56 47.27 47.93 74.53 112.09 27.25 64.17 27.25 136.71t-27.25 136.71q-27.26 64.16-74.53 112.09-47.27 47.92-110.56 75.56T493.46-128Zm104.16-177.85L435.77-465.69V-696h66v201.69l142.15 142.16-46.3 46.3Z"/></svg>
      <span style="font-size:9.5px;font-weight:600;color:var(--text-faint);">Events</span>
    </div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:3px;width:17%;">
      <svg width="20" height="20" viewBox="0 -960 960 960" fill="var(--text-faint)"><path d="M234.85-267.62q56-39.69 116.23-61.03Q411.31-350 480-350t128.92 21.35q60.23 21.34 116.23 61.03 39.62-46 60.23-98.34Q806-418.31 806-480q0-134-96-230t-230-96q-134 0-230 96t-96 230q0 61.69 20.62 114.04 20.61 52.34 60.23 98.34ZM480.1-436q-60.64 0-102.37-41.63Q336-519.25 336-579.9q0-60.64 41.63-102.37Q419.25-724 479.9-724q60.64 0 102.37 41.63Q624-640.75 624-580.1q0 60.64-41.63 102.37Q540.75-436 480.1-436ZM480-88q-80.31 0-152.04-30.8-71.72-30.8-124.8-84.16-53.08-53.35-84.12-125.04Q88-399.69 88-480.5t31.04-152q31.04-71.19 84.12-124.54 53.08-53.36 124.8-84.16Q399.69-872 480.5-872q80.81 0 152 31.04t124.31 84.15q53.11 53.12 84.15 124.23Q872-561.47 872-480q0 80.31-30.8 152.04-30.8 71.72-84.16 124.8-53.35 53.08-124.46 84.12Q561.47-88 480-88Z"/></svg>

</div>
