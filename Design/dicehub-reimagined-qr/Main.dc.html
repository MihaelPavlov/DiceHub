<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Sora:wght@400;500;600;700&display=swap');
    :root {
      --bg: oklch(0.15 0.018 290);
      --bg-elevated: oklch(0.195 0.02 290);
      --bg-elevated-2: oklch(0.245 0.022 290);
      --border: oklch(0.34 0.02 290 / 0.55);
      --text: oklch(0.96 0.01 90);
      --text-muted: oklch(0.7 0.02 290);
      --text-faint: oklch(0.52 0.02 290);
      --amber: oklch(0.78 0.16 75);
      --amber-soft: oklch(0.78 0.16 75 / 0.16);
      --coral: oklch(0.68 0.19 25);
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: #0b0b0d; font-family: 'Sora', ui-sans-serif, system-ui, sans-serif; }
    .display { font-family: 'Bricolage Grotesque', ui-sans-serif, system-ui, sans-serif; }
    .icon-btn { width: 42px; height: 42px; border-radius: 999px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .corner { position: absolute; width: 34px; height: 34px; border-color: var(--amber); }
  </style>
</helmet>

<div style="width:393px;height:800px;background:var(--bg);color:var(--text);padding:24px 20px 40px;display:flex;flex-direction:column;gap:22px;">

  <div style="display:flex;align-items:center;justify-content:space-between;">
    <div class="icon-btn" style="background:var(--bg-elevated);border:1px solid var(--border);">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--text)" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
    </div>
    <span class="display" style="font-size:18px;font-weight:700;">QR Scanner</span>
    <div style="width:42px;"></div>
  </div>

  <!-- Camera viewfinder -->
  <div style="flex:1;position:relative;border-radius:28px;overflow:hidden;background:radial-gradient(circle at 50% 35%,#20242b,#0b0d10 75%);border:1px solid var(--border);">

    <!-- ambient camera-feed texture -->
    <div style="position:absolute;inset:0;opacity:0.5;background-image:radial-gradient(circle at 20% 30%,rgba(255,255,255,0.05),transparent 40%),radial-gradient(circle at 80% 70%,rgba(255,255,255,0.04),transparent 40%);"></div>

    <!-- scan frame -->
    <div style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:230px;height:230px;">
      <div class="corner" style="top:0;left:0;border-top:4px solid var(--amber);border-left:4px solid var(--amber);border-radius:16px 0 0 0;"></div>
      <div class="corner" style="top:0;right:0;border-top:4px solid var(--amber);border-right:4px solid var(--amber);border-radius:0 16px 0 0;"></div>
      <div class="corner" style="bottom:0;left:0;border-bottom:4px solid var(--amber);border-left:4px solid var(--amber);border-radius:0 0 0 16px;"></div>
      <div class="corner" style="bottom:0;right:0;border-bottom:4px solid var(--amber);border-right:4px solid var(--amber);border-radius:0 0 16px 0;"></div>
      <div style="position:absolute;left:6px;right:6px;top:50%;height:2px;background:linear-gradient(90deg,transparent,var(--amber),transparent);box-shadow:0 0 12px 1px var(--amber-soft);"></div>
    </div>

    <div style="position:absolute;left:0;right:0;bottom:24px;text-align:center;">
      <span style="font-size:12.5px;font-weight:600;color:rgba(255,255,255,0.85);background:rgba(0,0,0,0.4);padding:8px 16px;border-radius:999px;">Point your camera at a QR code</span>
    </div>
  </div>

  <span style="font-size:11.5px;color:var(--text-faint);text-align:center;line-height:1.5;">Scan a game, event, reward, or reservation code posted around the club.</span>

</div>
</x-dc>
<script data-dc-script data-props='{}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
