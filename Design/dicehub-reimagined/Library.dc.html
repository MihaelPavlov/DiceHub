<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Sora:wght@400;500;600;700&display=swap');
    :root {
      --bg: oklch(0.15 0.018 290);
      --bg-elevated: oklch(0.195 0.02 290);
      --bg-elevated-2: oklch(0.245 0.022 290);
      --border: oklch(0.34 0.02 290 / 0.55);
      --text: oklch(0.96 0.01 90);
      --text-muted: oklch(0.7 0.02 290);
      --text-faint: oklch(0.52 0.02 290);
      --amber: oklch(0.78 0.16 75);
      --amber-soft: oklch(0.78 0.16 75 / 0.16);
      --coral: oklch(0.68 0.19 25);
      --coral-soft: oklch(0.68 0.19 25 / 0.16);
      --teal: oklch(0.72 0.14 165);
      --teal-soft: oklch(0.72 0.14 165 / 0.16);
      --violet: oklch(0.66 0.17 300);
      --violet-soft: oklch(0.66 0.17 300 / 0.16);
      --shadow-card: 0 10px 30px -12px oklch(0 0 0 / 0.55);
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: #0b0b0d; font-family: 'Sora', ui-sans-serif, system-ui, sans-serif; }
    .display { font-family: 'Bricolage Grotesque', ui-sans-serif, system-ui, sans-serif; }
    .icon { flex-shrink: 0; }
    .diff-dot { width: 6px; height: 6px; border-radius: 50%; }
  </style>
</helmet>

<div style="width:393px;background:var(--bg);color:var(--text);padding:24px 20px 140px;display:flex;flex-direction:column;gap:22px;position:relative;">

  <div style="display:flex;flex-direction:column;gap:2px;">
    <span class="display" style="font-size:26px;font-weight:800;">Discover</span>
    <span style="font-size:13px;color:var(--text-muted);font-weight:500;">128 games in the library</span>
  </div>

  <div style="display:flex;align-items:center;gap:10px;background:var(--bg-elevated);border:1px solid var(--border);border-radius:999px;padding:13px 18px;">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--text-faint)" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M20 20l-4.8-4.8"/></svg>
    <span style="font-size:14px;color:var(--text-faint);font-weight:500;">Search games, tags…</span>
  </div>

  <div style="display:flex;gap:8px;flex-wrap:wrap;">
    <span style="font-size:12.5px;font-weight:700;padding:9px 16px;border-radius:999px;background:var(--amber);color:#2b1a02;">All</span>
    <span style="font-size:12.5px;font-weight:600;padding:9px 16px;border-radius:999px;background:var(--bg-elevated);border:1px solid var(--border);color:var(--text-muted);">Strategy</span>
    <span style="font-size:12.5px;font-weight:600;padding:9px 16px;border-radius:999px;background:var(--bg-elevated);border:1px solid var(--border);color:var(--text-muted);">Party</span>
    <span style="font-size:12.5px;font-weight:600;padding:9px 16px;border-radius:999px;background:var(--bg-elevated);border:1px solid var(--border);color:var(--text-muted);">Co-op</span>
    <span style="font-size:12.5px;font-weight:600;padding:9px 16px;border-radius:999px;background:var(--bg-elevated);border:1px solid var(--border);color:var(--text-muted);">New</span>
  </div>

  <!-- Featured -->
  <div style="border-radius:26px;overflow:hidden;position:relative;height:210px;background:linear-gradient(155deg,var(--violet),var(--coral) 70%);box-shadow:var(--shadow-card);">
    <div style="position:absolute;inset:0;background:linear-gradient(0deg,rgba(0,0,0,0.55),rgba(0,0,0,0) 55%);"></div>
    <span style="position:absolute;top:16px;left:16px;font-size:11px;font-weight:700;letter-spacing:0.06em;padding:6px 12px;border-radius:999px;background:rgba(11,11,13,0.4);backdrop-filter:blur(4px);color:#fff;">FEATURED TONIGHT</span>
    <div style="position:absolute;top:16px;right:16px;display:flex;align-items:center;gap:4px;padding:6px 11px;border-radius:999px;background:rgba(11,11,13,0.4);backdrop-filter:blur(4px);">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="#fbbf24" stroke="#fbbf24" stroke-width="1"><path d="M12 3.5l2.4 5 5.5.7-4 3.8 1 5.5-4.9-2.7-4.9 2.7 1-5.5-4-3.8 5.5-.7z"/></svg>
      <span style="font-size:12px;font-weight:700;color:#fff;">4.8</span>
    </div>
    <div style="position:absolute;left:18px;right:18px;bottom:18px;display:flex;align-items:flex-end;justify-content:space-between;gap:12px;">
      <div style="display:flex;flex-direction:column;gap:3px;">
        <span class="display" style="font-size:22px;font-weight:800;color:#fff;">Wingspan</span>
        <span style="font-size:12.5px;color:rgba(255,255,255,0.8);font-weight:500;">1–5 players · 40–70 min</span>
      </div>
      <span style="flex-shrink:0;font-size:12.5px;font-weight:700;padding:10px 16px;border-radius:999px;background:#fff;color:#241505;">Reserve</span>
    </div>
  </div>

  <!-- Popular grid -->
  <div style="display:flex;flex-direction:column;gap:14px;">
    <span class="display" style="font-size:19px;font-weight:700;">Popular this week</span>

    <div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;">

      <div style="display:flex;flex-direction:column;gap:9px;">
        <div style="border-radius:18px;aspect-ratio:1;background:linear-gradient(135deg,#5a4fcf,#8ea2ff);display:flex;align-items:center;justify-content:center;">
          <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.85)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="4"/><circle cx="8.5" cy="8.5" r="1.15" fill="rgba(255,255,255,0.85)" stroke="none"/><circle cx="15.5" cy="8.5" r="1.15" fill="rgba(255,255,255,0.85)" stroke="none"/><circle cx="12" cy="12" r="1.15" fill="rgba(255,255,255,0.85)" stroke="none"/><circle cx="8.5" cy="15.5" r="1.15" fill="rgba(255,255,255,0.85)" stroke="none"/><circle cx="15.5" cy="15.5" r="1.15" fill="rgba(255,255,255,0.85)" stroke="none"/></svg>
        </div>
        <div style="display:flex;flex-direction:column;gap:5px;padding:0 2px;">
          <span style="font-size:14px;font-weight:700;">Catan</span>
          <div style="display:flex;gap:4px;">
            <div class="diff-dot" style="background:var(--coral);"></div><div class="diff-dot" style="background:var(--coral);"></div><div class="diff-dot" style="background:var(--border);"></div>
          </div>
          <div style="display:flex;align-items:center;justify-content:space-between;">
            <span style="font-size:11.5px;color:var(--text-faint);font-weight:500;">3–4 players</span>
            <div style="display:flex;align-items:center;gap:3px;">
              <svg width="11" height="11" viewBox="0 0 24 24" fill="#fbbf24" stroke="#fbbf24" stroke-width="1"><path d="M12 3.5l2.4 5 5.5.7-4 3.8 1 5.5-4.9-2.7-4.9 2.7 1-5.5-4-3.8 5.5-.7z"/></svg>
              <span style="font-size:11.5px;font-weight:700;color:var(--text-muted);">4.6</span>
            </div>
          </div>
        </div>
      </div>

      <div style="display:flex;flex-direction:column;gap:9px;">
        <div style="border-radius:18px;aspect-ratio:1;background:linear-gradient(135deg,#bf3c65,#e88ea8);display:flex;align-items:center;justify-content:center;">
          <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.85)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="4"/><circle cx="8.5" cy="8.5" r="1.15" fill="rgba(255,255,255,0.85)" stroke="none"/><circle cx="15.5" cy="8.5" r="1.15" fill="rgba(255,255,255,0.85)" stroke="none"/><circle cx="12" cy="12" r="1.15" fill="rgba(255,255,255,0.85)" stroke="none"/><circle cx="8.5" cy="15.5" r="1.15" fill="rgba(255,255,255,0.85)" stroke="none"/><circle cx="15.5" cy="15.5" r="1.15" fill="rgba(255,255,255,0.85)" stroke="none"/></svg>
        </div>
        <div style="display:flex;flex-direction:column;gap:5px;padding:0 2px;">
          <span style="font-size:14px;font-weight:700;">Azul</span>
          <div style="display:flex;gap:4px;">
            <div class="diff-dot" style="background:var(--teal);"></div><div class="diff-dot" style="background:var(--border);"></div><div class="diff-dot" style="background:var(--border);"></div>
          </div>
          <div style="display:flex;align-items:center;justify-content:space-between;">
            <span style="font-size:11.5px;color:var(--text-faint);font-weight:500;">2–4 players</span>
            <div style="display:flex;align-items:center;gap:3px;">
              <svg width="11" height="11" viewBox="0 0 24 24" fill="#fbbf24" stroke="#fbbf24" stroke-width="1"><path d="M12 3.5l2.4 5 5.5.7-4 3.8 1 5.5-4.9-2.7-4.9 2.7 1-5.5-4-3.8 5.5-.7z"/></svg>
              <span style="font-size:11.5px;font-weight:700;color:var(--text-muted);">4.4</span>
            </div>
          </div>
        </div>
      </div>

      <div style="display:flex;flex-direction:column;gap:9px;">
        <div style="border-radius:18px;aspect-ratio:1;background:linear-gradient(135deg,#977f33,#fccd3d);display:flex;align-items:center;justify-content:center;">
          <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="rgba(0,0,0,0.55)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="4"/><circle cx="8.5" cy="8.5" r="1.15" fill="rgba(0,0,0,0.55)" stroke="none"/><circle cx="15.5" cy="8.5" r="1.15" fill="rgba(0,0,0,0.55)" stroke="none"/><circle cx="12" cy="12" r="1.15" fill="rgba(0,0,0,0.55)" stroke="none"/><circle cx="8.5" cy="15.5" r="1.15" fill="rgba(0,0,0,0.55)" stroke="none"/><circle cx="15.5" cy="15.5" r="1.15" fill="rgba(0,0,0,0.55)" stroke="none"/></svg>
        </div>
        <div style="display:flex;flex-direction:column;gap:5px;padding:0 2px;">
          <span style="font-size:14px;font-weight:700;">Splendor</span>
          <div style="display:flex;gap:4px;">
            <div class="diff-dot" style="background:var(--teal);"></div><div class="diff-dot" style="background:var(--border);"></div><div class="diff-dot" style="background:var(--border);"></div>
          </div>
          <div style="display:flex;align-items:center;justify-content:space-between;">
            <span style="font-size:11.5px;color:var(--text-faint);font-weight:500;">2–4 players</span>
            <div style="display:flex;align-items:center;gap:3px;">
              <svg width="11" height="11" viewBox="0 0 24 24" fill="#fbbf24" stroke="#fbbf24" stroke-width="1"><path d="M12 3.5l2.4 5 5.5.7-4 3.8 1 5.5-4.9-2.7-4.9 2.7 1-5.5-4-3.8 5.5-.7z"/></svg>
              <span style="font-size:11.5px;font-weight:700;color:var(--text-muted);">4.3</span>
            </div>
          </div>
        </div>
      </div>

      <div style="display:flex;flex-direction:column;gap:9px;">
        <div style="border-radius:18px;aspect-ratio:1;background:linear-gradient(135deg,#46945b,#a3d78a);display:flex;align-items:center;justify-content:center;">
          <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.85)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="4"/><circle cx="8.5" cy="8.5" r="1.15" fill="rgba(255,255,255,0.85)" stroke="none"/><circle cx="15.5" cy="8.5" r="1.15" fill="rgba(255,255,255,0.85)" stroke="none"/><circle cx="12" cy="12" r="1.15" fill="rgba(255,255,255,0.85)" stroke="none"/><circle cx="8.5" cy="15.5" r="1.15" fill="rgba(255,255,255,0.85)" stroke="none"/><circle cx="15.5" cy="15.5" r="1.15" fill="rgba(255,255,255,0.85)" stroke="none"/></svg>
        </div>
        <div style="display:flex;flex-direction:column;gap:5px;padding:0 2px;">
          <span style="font-size:14px;font-weight:700;">Wingspan</span>
          <div style="display:flex;gap:4px;">
            <div class="diff-dot" style="background:var(--coral);"></div><div class="diff-dot" style="background:var(--coral);"></div><div class="diff-dot" style="background:var(--coral);"></div>
          </div>
          <div style="display:flex;align-items:center;justify-content:space-between;">
            <span style="font-size:11.5px;color:var(--text-faint);font-weight:500;">1–5 players</span>
            <div style="display:flex;align-items:center;gap:3px;">
              <svg width="11" height="11" viewBox="0 0 24 24" fill="#fbbf24" stroke="#fbbf24" stroke-width="1"><path d="M12 3.5l2.4 5 5.5.7-4 3.8 1 5.5-4.9-2.7-4.9 2.7 1-5.5-4-3.8 5.5-.7z"/></svg>
              <span style="font-size:11.5px;font-weight:700;color:var(--text-muted);">4.8</span>
            </div>
          </div>
        </div>
      </div>

    </div>
  </div>

  <!-- Floating bottom nav — real IA: games / meeple / reservations · FAB(challenges) · events / profile -->
  <div style="position:absolute;left:20px;right:20px;bottom:24px;background:var(--bg-elevated);border:1px solid var(--border);border-radius:999px;padding:10px 16px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 14px 34px -10px oklch(0 0 0 / 0.6);">
    <div style="width:38px;height:38px;border-radius:999px;background:var(--amber-soft);display:flex;align-items:center;justify-content:center;">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="var(--amber)" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11.5 12 4l8 7.5"/><path d="M6 10v9a1 1 0 0 0 1 1h4v-6h2v6h4a1 1 0 0 0 1-1v-9"/></svg>
    </div>
    <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="var(--text-faint)" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3"/><path d="M3 19c.8-3.3 3-5 6-5s5.2 1.7 6 5"/><circle cx="17" cy="9" r="2.4"/><path d="M15.5 12.2c2.6.2 4 1.7 4.6 4.3"/></svg>
    <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="var(--text-faint)" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="5" width="16" height="15" rx="3"/><path d="M4 10h16"/><path d="M8 3v4M16 3v4"/><path d="M9.5 14l1.8 1.8L15 12"/></svg>
    <div style="width:50px;height:50px;border-radius:999px;background:linear-gradient(135deg,var(--amber),var(--coral));display:flex;align-items:center;justify-content:center;margin-top:-22px;box-shadow:0 8px 20px -6px var(--amber-soft),0 0 0 6px var(--bg);">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#2b1502" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M8 4h8v4a4 4 0 0 1-8 0z"/><path d="M8 5H5a3 3 0 0 0 3 5"/><path d="M16 5h3a3 3 0 0 1-3 5"/><path d="M10 13v3M14 13v3"/><path d="M8 20h8"/><path d="M9 17h6l1 3H8z"/></svg>
    </div>
    <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="var(--text-faint)" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2 1.6 1.6 0 0 0 0 6 2 2 0 0 1-2 2H6a2 2 0 0 1-2-2 1.6 1.6 0 0 0 0-6z"/><path d="M9 7.5v2M9 12.5v2M9 17v-2"/></svg>
    <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="var(--text-faint)" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="3.5"/><path d="M5 20c1.2-4 4-5.5 7-5.5s5.8 1.5 7 5.5"/></svg>
  </div>

</div>
</x-dc>
<script data-dc-script data-props='{}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
