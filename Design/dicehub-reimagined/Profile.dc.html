<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Sora:wght@400;500;600;700&display=swap');
    :root {
      --bg: oklch(0.15 0.018 290);
      --bg-elevated: oklch(0.195 0.02 290);
      --bg-elevated-2: oklch(0.245 0.022 290);
      --border: oklch(0.34 0.02 290 / 0.55);
      --text: oklch(0.96 0.01 90);
      --text-muted: oklch(0.7 0.02 290);
      --text-faint: oklch(0.52 0.02 290);
      --amber: oklch(0.78 0.16 75);
      --amber-soft: oklch(0.78 0.16 75 / 0.16);
      --coral: oklch(0.68 0.19 25);
      --coral-soft: oklch(0.68 0.19 25 / 0.16);
      --teal: oklch(0.72 0.14 165);
      --teal-soft: oklch(0.72 0.14 165 / 0.16);
      --violet: oklch(0.66 0.17 300);
      --violet-soft: oklch(0.66 0.17 300 / 0.16);
      --shadow-card: 0 10px 30px -12px oklch(0 0 0 / 0.55);
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: #0b0b0d; font-family: 'Sora', ui-sans-serif, system-ui, sans-serif; }
    .display { font-family: 'Bricolage Grotesque', ui-sans-serif, system-ui, sans-serif; }
    .icon { flex-shrink: 0; }
  </style>
</helmet>

<div style="width:393px;background:var(--bg);color:var(--text);padding:24px 20px 140px;display:flex;flex-direction:column;gap:26px;position:relative;">

  <div style="display:flex;align-items:center;justify-content:space-between;">
    <span class="display" style="font-size:26px;font-weight:800;">Profile</span>
    <div style="width:42px;height:42px;border-radius:14px;background:var(--bg-elevated);display:flex;align-items:center;justify-content:center;border:1px solid var(--border);">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="var(--text-muted)" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 3v2.2M12 18.8V21M21 12h-2.2M5.2 12H3M18.4 5.6l-1.5 1.5M7.1 16.9l-1.5 1.5M18.4 18.4l-1.5-1.5M7.1 7.1 5.6 5.6"/></svg>
    </div>
  </div>

  <!-- Avatar + level ring -->
  <div style="display:flex;flex-direction:column;align-items:center;gap:12px;">
    <div style="position:relative;width:104px;height:104px;">
      <svg width="104" height="104" viewBox="0 0 104 104">
        <circle cx="52" cy="52" r="46" fill="none" stroke="var(--bg-elevated-2)" stroke-width="6"/>
        <circle cx="52" cy="52" r="46" fill="none" stroke="url(#ringGrad)" stroke-width="6" stroke-linecap="round" stroke-dasharray="289" stroke-dashoffset="75" transform="rotate(-90 52 52)"/>
        <defs><linearGradient id="ringGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="var(--amber)"/><stop offset="100%" stop-color="var(--coral)"/></linearGradient></defs>
      </svg>
      <div style="position:absolute;inset:10px;border-radius:50%;background:linear-gradient(135deg,var(--violet),var(--coral));display:flex;align-items:center;justify-content:center;font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:30px;color:#fff;">M</div>
      <div style="position:absolute;bottom:-2px;right:-2px;width:32px;height:32px;border-radius:50%;background:var(--amber);border:3px solid var(--bg);display:flex;align-items:center;justify-content:center;font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:12.5px;color:#2b1502;">14</div>
    </div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:2px;">
      <span class="display" style="font-size:21px;font-weight:800;">Maya Reyes</span>
      <span style="font-size:12.5px;font-weight:600;color:var(--amber);">Table Regular · Level 14</span>
    </div>
  </div>

  <!-- Stats grid -->
  <div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;">
    <div style="background:var(--bg-elevated);border:1px solid var(--border);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:4px;">
      <span class="display" style="font-size:24px;font-weight:800;">142</span>
      <span style="font-size:12px;color:var(--text-faint);font-weight:600;">Games played</span>
    </div>
    <div style="background:var(--bg-elevated);border:1px solid var(--border);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:4px;">
      <span class="display" style="font-size:24px;font-weight:800;color:var(--teal);">58%</span>
      <span style="font-size:12px;color:var(--text-faint);font-weight:600;">Win rate</span>
    </div>
    <div style="background:var(--bg-elevated);border:1px solid var(--border);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:4px;">
      <span class="display" style="font-size:24px;font-weight:800;">96h</span>
      <span style="font-size:12px;color:var(--text-faint);font-weight:600;">Hours played</span>
    </div>
    <div style="background:var(--bg-elevated);border:1px solid var(--border);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:4px;">
      <span class="display" style="font-size:24px;font-weight:800;color:var(--coral);">12</span>
      <span style="font-size:12px;color:var(--text-faint);font-weight:600;">Reservations</span>
    </div>
  </div>

  <!-- Badges strip -->
  <div style="display:flex;flex-direction:column;gap:14px;">
    <div style="display:flex;align-items:center;justify-content:space-between;">
      <span class="display" style="font-size:19px;font-weight:700;">Badges</span>
      <span style="font-size:12.5px;font-weight:600;color:var(--text-faint);">9 earned</span>
    </div>
    <div style="display:flex;gap:12px;">
      <div style="width:52px;height:52px;border-radius:50%;background:linear-gradient(155deg,var(--amber),var(--coral));display:flex;align-items:center;justify-content:center;flex-shrink:0;">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#2b1502" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8 4h8v4a4 4 0 0 1-8 0z"/><path d="M8 5H5a3 3 0 0 0 3 5"/><path d="M16 5h3a3 3 0 0 1-3 5"/><path d="M10 13v3M14 13v3"/><path d="M8 20h8"/><path d="M9 17h6l1 3H8z"/></svg>
      </div>
      <div style="width:52px;height:52px;border-radius:50%;background:linear-gradient(155deg,var(--coral),var(--violet));display:flex;align-items:center;justify-content:center;flex-shrink:0;">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3c1 3-3 4-3 7a3 3 0 0 0 6 0c1.5 1 2 3 2 4.5A5.5 5.5 0 0 1 6 14.5C6 10 9 8 12 3z"/></svg>
      </div>
      <div style="width:52px;height:52px;border-radius:50%;background:linear-gradient(155deg,var(--teal),var(--amber));display:flex;align-items:center;justify-content:center;flex-shrink:0;">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#062017" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3"/><path d="M3 19c.8-3.3 3-5 6-5s5.2 1.7 6 5"/><circle cx="17" cy="9" r="2.4"/><path d="M15.5 12.2c2.6.2 4 1.7 4.6 4.3"/></svg>
      </div>
      <div style="width:52px;height:52px;border-radius:50%;background:linear-gradient(155deg,var(--violet),var(--teal));display:flex;align-items:center;justify-content:center;flex-shrink:0;">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.5l2.4 5 5.5.7-4 3.8 1 5.5-4.9-2.7-4.9 2.7 1-5.5-4-3.8 5.5-.7z"/></svg>
      </div>
      <div style="width:52px;height:52px;border-radius:50%;background:var(--bg-elevated-2);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;flex-shrink:0;">
        <span style="font-size:13px;font-weight:700;color:var(--text-faint);">+5</span>
      </div>
    </div>
  </div>

  <!-- Favorite games -->
  <div style="display:flex;flex-direction:column;gap:14px;">
    <span class="display" style="font-size:19px;font-weight:700;">Favorite games</span>
    <div style="display:flex;flex-direction:column;gap:2px;">

      <div style="display:flex;align-items:center;gap:14px;padding:10px 4px;">
        <div style="width:44px;height:44px;border-radius:13px;background:linear-gradient(135deg,#5a4fcf,#8ea2ff);flex-shrink:0;"></div>
        <div style="display:flex;flex-direction:column;gap:1px;flex:1;">
          <span style="font-size:13.5px;font-weight:600;">Catan</span>
          <span style="font-size:12px;color:var(--text-faint);">Played 28 times</span>
        </div>
        <svg width="13" height="13" viewBox="0 0 24 24" fill="#fbbf24" stroke="#fbbf24" stroke-width="1"><path d="M12 3.5l2.4 5 5.5.7-4 3.8 1 5.5-4.9-2.7-4.9 2.7 1-5.5-4-3.8 5.5-.7z"/></svg>
      </div>

      <div style="display:flex;align-items:center;gap:14px;padding:10px 4px;">
        <div style="width:44px;height:44px;border-radius:13px;background:linear-gradient(135deg,#46945b,#a3d78a);flex-shrink:0;"></div>
        <div style="display:flex;flex-direction:column;gap:1px;flex:1;">
          <span style="font-size:13.5px;font-weight:600;">Wingspan</span>
          <span style="font-size:12px;color:var(--text-faint);">Played 19 times</span>
        </div>
        <svg width="13" height="13" viewBox="0 0 24 24" fill="#fbbf24" stroke="#fbbf24" stroke-width="1"><path d="M12 3.5l2.4 5 5.5.7-4 3.8 1 5.5-4.9-2.7-4.9 2.7 1-5.5-4-3.8 5.5-.7z"/></svg>
      </div>

      <div style="display:flex;align-items:center;gap:14px;padding:10px 4px;">
        <div style="width:44px;height:44px;border-radius:13px;background:linear-gradient(135deg,#977f33,#fccd3d);flex-shrink:0;"></div>
        <div style="display:flex;flex-direction:column;gap:1px;flex:1;">
          <span style="font-size:13.5px;font-weight:600;">Splendor</span>
          <span style="font-size:12px;color:var(--text-faint);">Played 14 times</span>
        </div>
        <svg width="13" height="13" viewBox="0 0 24 24" fill="#fbbf24" stroke="#fbbf24" stroke-width="1"><path d="M12 3.5l2.4 5 5.5.7-4 3.8 1 5.5-4.9-2.7-4.9 2.7 1-5.5-4-3.8 5.5-.7z"/></svg>
      </div>

    </div>
  </div>

  <!-- Floating bottom nav — real IA: games / meeple / reservations · FAB(challenges) · events / profile -->
  <div style="position:absolute;left:20px;right:20px;bottom:24px;background:var(--bg-elevated);border:1px solid var(--border);border-radius:999px;padding:10px 16px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 14px 34px -10px oklch(0 0 0 / 0.6);">
    <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="var(--text-faint)" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11.5 12 4l8 7.5"/><path d="M6 10v9a1 1 0 0 0 1 1h4v-6h2v6h4a1 1 0 0 0 1-1v-9"/></svg>
    <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="var(--text-faint)" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3"/><path d="M3 19c.8-3.3 3-5 6-5s5.2 1.7 6 5"/><circle cx="17" cy="9" r="2.4"/><path d="M15.5 12.2c2.6.2 4 1.7 4.6 4.3"/></svg>
    <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="var(--text-faint)" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="5" width="16" height="15" rx="3"/><path d="M4 10h16"/><path d="M8 3v4M16 3v4"/><path d="M9.5 14l1.8 1.8L15 12"/></svg>
    <div style="width:50px;height:50px;border-radius:999px;background:linear-gradient(135deg,var(--amber),var(--coral));display:flex;align-items:center;justify-content:center;margin-top:-22px;box-shadow:0 8px 20px -6px var(--amber-soft),0 0 0 6px var(--bg);">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#2b1502" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M8 4h8v4a4 4 0 0 1-8 0z"/><path d="M8 5H5a3 3 0 0 0 3 5"/><path d="M16 5h3a3 3 0 0 1-3 5"/><path d="M10 13v3M14 13v3"/><path d="M8 20h8"/><path d="M9 17h6l1 3H8z"/></svg>
    </div>
    <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="var(--text-faint)" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2 1.6 1.6 0 0 0 0 6 2 2 0 0 1-2 2H6a2 2 0 0 1-2-2 1.6 1.6 0 0 0 0-6z"/><path d="M9 7.5v2M9 12.5v2M9 17v-2"/></svg>
    <div style="width:38px;height:38px;border-radius:999px;background:var(--amber-soft);display:flex;align-items:center;justify-content:center;">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="var(--amber)" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="3.5"/><path d="M5 20c1.2-4 4-5.5 7-5.5s5.8 1.5 7 5.5"/></svg>
    </div>
  </div>

</div>
</x-dc>
<script data-dc-script data-props='{}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
