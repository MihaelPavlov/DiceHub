<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Sora:wght@400;500;600;700&display=swap');
    :root {
      --bg: oklch(0.15 0.018 290);
      --bg-elevated: oklch(0.195 0.02 290);
      --bg-elevated-2: oklch(0.245 0.022 290);
      --border: oklch(0.34 0.02 290 / 0.55);
      --text: oklch(0.96 0.01 90);
      --text-muted: oklch(0.7 0.02 290);
      --text-faint: oklch(0.52 0.02 290);
      --amber: oklch(0.78 0.16 75);
      --amber-soft: oklch(0.78 0.16 75 / 0.16);
      --coral: oklch(0.68 0.19 25);
      --coral-soft: oklch(0.68 0.19 25 / 0.16);
      --teal: oklch(0.72 0.14 165);
      --teal-soft: oklch(0.72 0.14 165 / 0.16);
      --violet: oklch(0.66 0.17 300);
      --violet-soft: oklch(0.66 0.17 300 / 0.16);
      --shadow-card: 0 10px 30px -12px oklch(0 0 0 / 0.55);
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: #0b0b0d; font-family: 'Sora', ui-sans-serif, system-ui, sans-serif; }
    .display { font-family: 'Bricolage Grotesque', ui-sans-serif, system-ui, sans-serif; }
    .card { background: var(--bg-elevated); border: 1px solid var(--border); border-radius: 24px; padding: 20px; box-shadow: var(--shadow-card); display: flex; flex-direction: column; gap: 16px; }
  </style>
</helmet>

<div style="width:393px;background:var(--bg);color:var(--text);padding:24px 20px 140px;display:flex;flex-direction:column;gap:20px;position:relative;">

  <span class="display" style="font-size:26px;font-weight:800;">Insights</span>

  <!-- Reservations bar chart -->
  <div class="card">
    <div style="display:flex;align-items:center;justify-content:space-between;">
      <span style="font-size:14px;font-weight:700;">Reservations this month</span>
      <span style="font-size:12px;font-weight:700;color:var(--teal);">+18%</span>
    </div>
    <div style="display:flex;align-items:flex-end;justify-content:space-between;gap:8px;height:110px;">
      <div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end;">
        <div style="width:100%;height:38%;border-radius:8px 8px 3px 3px;background:var(--bg-elevated-2);"></div>
        <span style="font-size:10px;color:var(--text-faint);">W1</span>
      </div>
      <div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end;">
        <div style="width:100%;height:58%;border-radius:8px 8px 3px 3px;background:var(--bg-elevated-2);"></div>
        <span style="font-size:10px;color:var(--text-faint);">W2</span>
      </div>
      <div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end;">
        <div style="width:100%;height:44%;border-radius:8px 8px 3px 3px;background:var(--bg-elevated-2);"></div>
        <span style="font-size:10px;color:var(--text-faint);">W3</span>
      </div>
      <div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end;">
        <div style="width:100%;height:85%;border-radius:8px 8px 3px 3px;background:linear-gradient(180deg,var(--amber),var(--coral));"></div>
        <span style="font-size:10px;font-weight:700;color:var(--amber);">W4</span>
      </div>
    </div>
  </div>

  <!-- Visitor activity line chart -->
  <div class="card">
    <div style="display:flex;align-items:center;justify-content:space-between;">
      <span style="font-size:14px;font-weight:700;">Visitor activity</span>
      <span style="font-size:12px;font-weight:700;color:var(--teal);">This week</span>
    </div>
    <svg width="100%" height="100" viewBox="0 0 320 100" preserveAspectRatio="none">
      <defs>
        <linearGradient id="areaGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="var(--teal)" stop-opacity="0.35"/>
          <stop offset="100%" stop-color="var(--teal)" stop-opacity="0"/>
        </linearGradient>
      </defs>
      <polyline points="0,70 45,55 90,60 135,35 180,42 225,20 270,28 320,12" fill="none" stroke="var(--teal)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <polygon points="0,70 45,55 90,60 135,35 180,42 225,20 270,28 320,12 320,100 0,100" fill="url(#areaGrad)"/>
    </svg>
    <div style="display:flex;justify-content:space-between;">
      <span style="font-size:10px;color:var(--text-faint);">Mon</span>
      <span style="font-size:10px;color:var(--text-faint);">Tue</span>
      <span style="font-size:10px;color:var(--text-faint);">Wed</span>
      <span style="font-size:10px;color:var(--text-faint);">Thu</span>
      <span style="font-size:10px;color:var(--text-faint);">Fri</span>
      <span style="font-size:10px;color:var(--text-faint);">Sat</span>
      <span style="font-size:10px;color:var(--text-faint);">Sun</span>
    </div>
  </div>

  <!-- Rewards distribution donut -->
  <div class="card">
    <span style="font-size:14px;font-weight:700;">Rewards redeemed by tier</span>
    <div style="display:flex;align-items:center;gap:20px;">
      <svg width="96" height="96" viewBox="0 0 96 96" style="flex-shrink:0;">
        <circle cx="48" cy="48" r="38" fill="none" stroke="var(--bg-elevated-2)" stroke-width="14"/>
        <circle cx="48" cy="48" r="38" fill="none" stroke="var(--amber)" stroke-width="14" stroke-dasharray="238.76" stroke-dashoffset="0" transform="rotate(-90 48 48)"/>
        <circle cx="48" cy="48" r="38" fill="none" stroke="var(--teal)" stroke-width="14" stroke-dasharray="238.76" stroke-dashoffset="-95.5" transform="rotate(-90 48 48)"/>
        <circle cx="48" cy="48" r="38" fill="none" stroke="var(--violet)" stroke-width="14" stroke-dasharray="238.76" stroke-dashoffset="-167.1" transform="rotate(-90 48 48)"/>
      </svg>
      <div style="display:flex;flex-direction:column;gap:10px;flex:1;">
        <div style="display:flex;align-items:center;gap:8px;">
          <div style="width:9px;height:9px;border-radius:50%;background:var(--amber);"></div>
          <span style="font-size:12.5px;color:var(--text-muted);flex:1;">Bronze</span>
          <span style="font-size:12.5px;font-weight:700;">40%</span>
        </div>
        <div style="display:flex;align-items:center;gap:8px;">
          <div style="width:9px;height:9px;border-radius:50%;background:var(--teal);"></div>
          <span style="font-size:12.5px;color:var(--text-muted);flex:1;">Silver</span>
          <span style="font-size:12.5px;font-weight:700;">30%</span>
        </div>
        <div style="display:flex;align-items:center;gap:8px;">
          <div style="width:9px;height:9px;border-radius:50%;background:var(--violet);"></div>
          <span style="font-size:12.5px;color:var(--text-muted);flex:1;">Gold</span>
          <span style="font-size:12.5px;font-weight:700;">30%</span>
        </div>
      </div>
    </div>
  </div>

  <!-- Floating bottom nav — real IA: games / meeple / reservations · FAB(challenges) · events / profile -->
  <div style="position:absolute;left:20px;right:20px;bottom:24px;background:var(--bg-elevated);border:1px solid var(--border);border-radius:999px;padding:10px 16px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 14px 34px -10px oklch(0 0 0 / 0.6);">
    <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="var(--text-faint)" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11.5 12 4l8 7.5"/><path d="M6 10v9a1 1 0 0 0 1 1h4v-6h2v6h4a1 1 0 0 0 1-1v-9"/></svg>
    <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="var(--text-faint)" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3"/><path d="M3 19c.8-3.3 3-5 6-5s5.2 1.7 6 5"/><circle cx="17" cy="9" r="2.4"/><path d="M15.5 12.2c2.6.2 4 1.7 4.6 4.3"/></svg>
    <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="var(--text-faint)" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="5" width="16" height="15" rx="3"/><path d="M4 10h16"/><path d="M8 3v4M16 3v4"/><path d="M9.5 14l1.8 1.8L15 12"/></svg>
    <div style="width:50px;height:50px;border-radius:999px;background:linear-gradient(135deg,var(--amber),var(--coral));display:flex;align-items:center;justify-content:center;margin-top:-22px;box-shadow:0 8px 20px -6px var(--amber-soft),0 0 0 6px var(--bg);">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#2b1502" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M8 4h8v4a4 4 0 0 1-8 0z"/><path d="M8 5H5a3 3 0 0 0 3 5"/><path d="M16 5h3a3 3 0 0 1-3 5"/><path d="M10 13v3M14 13v3"/><path d="M8 20h8"/><path d="M9 17h6l1 3H8z"/></svg>
    </div>
    <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="var(--text-faint)" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2 1.6 1.6 0 0 0 0 6 2 2 0 0 1-2 2H6a2 2 0 0 1-2-2 1.6 1.6 0 0 0 0-6z"/><path d="M9 7.5v2M9 12.5v2M9 17v-2"/></svg>
    <div style="width:38px;height:38px;border-radius:999px;background:var(--amber-soft);display:flex;align-items:center;justify-content:center;">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="var(--amber)" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="3.5"/><path d="M5 20c1.2-4 4-5.5 7-5.5s5.8 1.5 7 5.5"/></svg>
    </div>
  </div>

</div>
</x-dc>
<script data-dc-script data-props='{}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
