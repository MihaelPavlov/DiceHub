<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Sora:wght@400;500;600;700&display=swap');
    :root {
      --bg: oklch(0.15 0.018 290);
      --bg-elevated: oklch(0.195 0.02 290);
      --bg-elevated-2: oklch(0.245 0.022 290);
      --border: oklch(0.34 0.02 290 / 0.55);
      --text: oklch(0.96 0.01 90);
      --text-muted: oklch(0.7 0.02 290);
      --text-faint: oklch(0.52 0.02 290);
      --teal: oklch(0.72 0.14 165);
      --teal-soft: oklch(0.72 0.14 165 / 0.16);
      --shadow-card: 0 -10px 40px -10px oklch(0 0 0 / 0.7);
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: #0b0b0d; font-family: 'Sora', ui-sans-serif, system-ui, sans-serif; }
    .display { font-family: 'Bricolage Grotesque', ui-sans-serif, system-ui, sans-serif; }
    .icon-btn { width: 42px; height: 42px; border-radius: 999px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .avatar { border-radius: 999px; flex-shrink: 0; border: 2px solid var(--bg-elevated); }
  </style>
</helmet>

<div style="width:393px;height:820px;background:var(--bg);color:var(--text);position:relative;overflow:hidden;">

  <div style="padding:24px 20px;display:flex;flex-direction:column;gap:14px;filter:brightness(0.55);">
    <div style="display:flex;align-items:center;justify-content:space-between;">
      <div class="icon-btn" style="background:var(--bg-elevated);border:1px solid var(--border);">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--text)" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
      </div>
      <span class="display" style="font-size:18px;font-weight:700;">Open Tables</span>
      <div style="width:42px;"></div>
    </div>
    <div style="display:flex;align-items:center;gap:12px;background:var(--bg-elevated);border:1px solid var(--border);border-radius:16px;padding:14px;">
      <div style="width:44px;height:44px;border-radius:12px;background:var(--teal-soft);flex-shrink:0;"></div>
      <div style="display:flex;flex-direction:column;gap:2px;">
        <span style="font-size:13.5px;font-weight:700;">Table 4 — Wingspan</span>
        <span style="font-size:11.5px;color:var(--text-muted);">2 of 4 seats filled</span>
      </div>
    </div>
  </div>

  <div style="position:absolute;left:0;right:0;bottom:0;background:var(--bg-elevated);border:1px solid var(--border);border-bottom:none;border-radius:28px 28px 0 0;padding:22px 22px 32px;box-shadow:var(--shadow-card);display:flex;flex-direction:column;gap:18px;">

    <div style="width:40px;height:4px;border-radius:999px;background:var(--border);margin:0 auto;"></div>

    <div style="display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center;padding:0 6px;">
      <div style="width:56px;height:56px;border-radius:16px;background:var(--teal-soft);display:flex;align-items:center;justify-content:center;">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="var(--teal)" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><circle cx="8.5" cy="8" r="3"/><path d="M2.5 19.5c.8-3.3 3-5 6-5s5.2 1.7 6 5"/><circle cx="17" cy="9" r="2.4"/><path d="M15.5 12.2c2.6.2 4 1.7 4.6 4.3"/></svg>
      </div>
      <div style="display:flex;align-items:center;">
        <div class="avatar" style="width:32px;height:32px;background:linear-gradient(150deg,#5a4fcf,#8ea2ff);margin-right:-10px;z-index:2;"></div>
        <div class="avatar" style="width:32px;height:32px;background:linear-gradient(150deg,#2f8a6b,#5ec7a2);"></div>
      </div>
      <div style="display:flex;flex-direction:column;gap:6px;">
        <span class="display" style="font-size:18px;font-weight:700;">Join Table 4 — Wingspan?</span>
        <span style="font-size:13.5px;color:var(--text-muted);max-width:280px;">You'll take a seat alongside 2 other players. Tonight, 8:30 PM · 2 seats left.</span>
      </div>
    </div>

    <div style="display:flex;gap:10px;">
      <a href="#" style="flex:1;text-align:center;font-size:13.5px;font-weight:700;padding:13px 0;border-radius:999px;background:var(--bg-elevated-2);border:1px solid var(--border);color:var(--text-muted);">Cancel</a>
      <a href="#" style="flex:1;text-align:center;font-size:13.5px;font-weight:700;padding:13px 0;border-radius:999px;background:var(--teal);color:#062420;">Join table</a>
    </div>
  </div>

</div>
</x-dc>
<script data-dc-script data-props='{}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
