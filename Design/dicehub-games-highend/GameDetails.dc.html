<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Sora:wght@400;500;600;700&display=swap');
    :root {
      --bg: #07070a;
      --glass: rgba(255,255,255,0.045);
      --glass-core: rgba(255,255,255,0.065);
      --glass-core-2: rgba(255,255,255,0.09);
      --hairline: rgba(255,255,255,0.09);
      --hairline-strong: rgba(255,255,255,0.17);
      --text: #f4f2ee;
      --text-muted: rgba(244,242,238,0.6);
      --text-faint: rgba(244,242,238,0.36);
      --accent: oklch(0.7 0.13 250);
      --accent-light: oklch(0.82 0.08 250);
      --accent-ink: #071022;
      --accent-glow: oklch(0.7 0.13 250 / 0.22);
      --accent-glow-strong: oklch(0.7 0.13 250 / 0.42);
      --gold: oklch(0.78 0.13 82);
      --coral: oklch(0.66 0.16 25);
      --coral-soft: oklch(0.66 0.16 25 / 0.16);
      --shadow: 0 24px 60px -24px oklch(0.1 0.05 260 / 0.8);
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); font-family: 'Sora', ui-sans-serif, system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
    .display { font-family: 'Bricolage Grotesque', ui-sans-serif, system-ui, sans-serif; }
    .grain { position: absolute; inset: 0; background-image: url('grain.png'); background-size: 64px 64px; opacity: 0.5; pointer-events: none; mix-blend-mode: overlay; border-radius: inherit; }
    .glow { position: absolute; border-radius: 50%; filter: blur(60px); pointer-events: none; animation: glowBreathe 7s ease-in-out infinite; }
    @keyframes glowBreathe { 0%,100% { opacity: 0.45; transform: scale(1); } 50% { opacity: 0.8; transform: scale(1.15); } }
    .bezel { padding: 0.3rem; border-radius: 1.9rem; background: var(--glass); border: 1px solid var(--hairline); position: relative; }
    .bezel__core { border-radius: 1.6rem; overflow: hidden; position: relative; }
    .eyebrow { display: inline-flex; align-items: center; gap: 6px; font-size: 10px; font-weight: 700; letter-spacing: 0.15em; text-transform: uppercase; padding: 6px 11px; border-radius: 999px; }
    .icon-btn { width: 42px; height: 42px; border-radius: 999px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; background: var(--glass-core); border: 1px solid var(--hairline); }
    .btn-primary { display: flex; align-items: center; justify-content: center; gap: 10px; font-size: 14px; font-weight: 700; padding: 15px 6px 15px 0; border-radius: 999px; background: linear-gradient(135deg, var(--accent-light), var(--accent)); color: var(--accent-ink); box-shadow: 0 16px 32px -14px var(--accent-glow-strong); }
    .btn-primary__icon { width: 30px; height: 30px; border-radius: 999px; background: rgba(7,16,34,0.14); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .stat { background: var(--glass-core); border: 1px solid var(--hairline); border-radius: 1.1rem; padding: 13px 8px; display: flex; flex-direction: column; align-items: center; gap: 4px; }
    .tabs { display: flex; gap: 4px; background: var(--glass); border: 1px solid var(--hairline); padding: 4px; border-radius: 1.1rem; }
    .tabs span { flex: 1; text-align: center; font-size: 12.5px; font-weight: 700; padding: 10px 0; border-radius: 0.85rem; color: var(--text-faint); }
    .tabs span.active { background: var(--glass-core-2); color: var(--text); box-shadow: inset 0 1px 0 rgba(255,255,255,0.08); }
    .navbar { position: absolute; left: 18px; right: 18px; bottom: 22px; display: flex; align-items: center; justify-content: space-between; padding: 10px 18px; border-radius: 999px; background: rgba(13,13,18,0.72); backdrop-filter: blur(20px); border: 1px solid var(--hairline-strong); box-shadow: 0 20px 44px -14px rgba(0,0,0,0.75); }
    .navbar .fab { width: 50px; height: 50px; border-radius: 999px; background: linear-gradient(135deg, var(--gold), #caa53a); display: flex; align-items: center; justify-content: center; margin-top: -24px; box-shadow: 0 10px 24px -8px oklch(0.78 0.13 82 / 0.55), 0 0 0 6px var(--bg); }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(16px); filter: blur(5px); } to { opacity: 1; transform: translateY(0); filter: blur(0); } }
    .stagger > * { opacity: 0; animation: fadeUp 650ms cubic-bezier(.32,.72,0,1) forwards; }
    .stagger > *:nth-child(1) { animation-delay: .03s; } .stagger > *:nth-child(2) { animation-delay: .09s; }
    .stagger > *:nth-child(3) { animation-delay: .15s; } .stagger > *:nth-child(4) { animation-delay: .21s; }
    .stagger > *:nth-child(5) { animation-delay: .27s; } .stagger > *:nth-child(6) { animation-delay: .33s; }
  </style>
</helmet>

<div style="width:393px;background:var(--bg);color:var(--text);padding:26px 20px 150px;display:flex;flex-direction:column;gap:22px;position:relative;overflow:hidden;">

  <div class="glow" style="width:240px;height:240px;top:-70px;left:-80px;background:var(--accent-glow);"></div>

  <div class="stagger" style="display:flex;flex-direction:column;gap:22px;position:relative;">

    <div style="display:flex;align-items:center;justify-content:space-between;">
      <div class="icon-btn"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="var(--text)" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></div>
      <span class="display" style="font-size:18px;font-weight:700;">Catan</span>
      <div class="icon-btn" style="background:var(--coral-soft);border-color:transparent;">
        <svg width="18" height="18" viewBox="0 -960 960 960" fill="var(--coral)"><path d="m480-137.85-46.31-43.38q-106.92-99.46-174.5-167.65-67.57-68.2-105.65-118.35-38.08-50.15-51.81-91.04Q88-599.15 88-642q0-87.31 60.85-147.65Q209.69-850 298-850q48.77 0 96 24.5t86 71.04q38.77-46.54 86-71.04 47.23-24.5 96-24.5 88.31 0 149.15 60.35Q872-729.31 872-642q0 42.85-13.73 83.73-13.73 40.89-51.81 91.04-38.08 50.15-105.27 118.35Q634-280.69 526.31-181.23L480-137.85Z"/></svg>
      </div>
    </div>

    <div class="bezel" style="box-shadow:var(--shadow);">
      <div class="bezel__core" style="aspect-ratio:1.15;background:linear-gradient(150deg,#5a4fcf,#8ea2ff);display:flex;align-items:flex-end;padding:18px;">
        <div class="grain"></div>
        <div style="display:flex;align-items:center;gap:6px;background:rgba(6,5,10,0.45);backdrop-filter:blur(6px);padding:8px 14px;border-radius:999px;">
          <svg width="13" height="13" viewBox="0 -960 960 960" fill="var(--coral)"><path d="m480-137.85-46.31-43.38q-106.92-99.46-174.5-167.65-67.57-68.2-105.65-118.35-38.08-50.15-51.81-91.04Q88-599.15 88-642q0-87.31 60.85-147.65Q209.69-850 298-850q48.77 0 96 24.5t86 71.04q38.77-46.54 86-71.04 47.23-24.5 96-24.5 88.31 0 149.15 60.35Q872-729.31 872-642q0 42.85-13.73 83.73-13.73 40.89-51.81 91.04-38.08 50.15-105.27 118.35Q634-280.69 526.31-181.23L480-137.85Z"/></svg>
          <span style="font-size:12px;font-weight:700;color:#fff;">128 likes</span>
        </div>
      </div>
    </div>

    <div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;">
      <div class="stat"><span style="font-size:9.5px;font-weight:700;letter-spacing:0.08em;color:var(--text-faint);">AGE</span><span class="display" style="font-size:16px;font-weight:800;">8+</span></div>
      <div class="stat"><span style="font-size:9.5px;font-weight:700;letter-spacing:0.08em;color:var(--text-faint);">PLAYERS</span><span class="display" style="font-size:16px;font-weight:800;">3–4</span></div>
      <div class="stat"><span style="font-size:9.5px;font-weight:700;letter-spacing:0.08em;color:var(--text-faint);">PLAYTIME</span><span class="display" style="font-size:16px;font-weight:800;">60–90m</span></div>
    </div>

    <div class="tabs"><span class="active">Details</span><span>Availability</span><span>Reviews</span></div>

    <div style="display:flex;flex-direction:column;gap:8px;">
      <span class="display" style="font-size:15.5px;font-weight:700;">About the game</span>
      <span style="font-size:13.5px;color:var(--text-muted);line-height:1.65;">Trade, build and settle the island of Catan before your rivals do. Gather resources, negotiate deals at the table and expand your network of roads and settlements across the island.</span>
    </div>

    <div class="btn-primary"><span style="padding-left:12px;">Reserve a table</span><span class="btn-primary__icon"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="var(--accent-ink)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17L17 7M9 7h8v8"/></svg></span></div>

  </div>

  <div class="navbar">
    <div class="icon-btn" style="background:var(--accent-glow);border-color:transparent;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--accent-light)" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11.5 12 4l8 7.5"/><path d="M6 10v9a1 1 0 0 0 1 1h4v-6h2v6h4a1 1 0 0 0 1-1v-9"/></svg>
    </div>
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--text-faint)" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3"/><path d="M3 19c.8-3.3 3-5 6-5s5.2 1.7 6 5"/><circle cx="17" cy="9" r="2.4"/><path d="M15.5 12.2c2.6.2 4 1.7 4.6 4.3"/></svg>
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--text-faint)" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="5" width="16" height="15" rx="3"/><path d="M4 10h16"/><path d="M8 3v4M16 3v4"/><path d="M9.5 14l1.8 1.8L15 12"/></svg>
    <div class="fab"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="var(--accent-ink)" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M8 4h8v4a4 4 0 0 1-8 0z"/><path d="M8 5H5a3 3 0 0 0 3 5"/><path d="M16 5h3a3 3 0 0 1-3 5"/><path d="M10 13v3M14 13v3"/><path d="M8 20h8"/><path d="M9 17h6l1 3H8z"/></svg></div>
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--text-faint)" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2 1.6 1.6 0 0 0 0 6 2 2 0 0 1-2 2H6a2 2 0 0 1-2-2 1.6 1.6 0 0 0 0-6z"/><path d="M9 7.5v2M9 12.5v2M9 17v-2"/></svg>
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--text-faint)" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="3.5"/><path d="M5 20c1.2-4 4-5.5 7-5.5s5.8 1.5 7 5.5"/></svg>
  </div>

</div>
</x-dc>
<script data-dc-script data-props='{}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
