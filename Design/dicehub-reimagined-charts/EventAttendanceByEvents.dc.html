<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Sora:wght@400;500;600;700&display=swap');
    :root {
      --bg: oklch(0.15 0.018 290);
      --bg-elevated: oklch(0.195 0.02 290);
      --bg-elevated-2: oklch(0.245 0.022 290);
      --border: oklch(0.34 0.02 290 / 0.55);
      --text: oklch(0.96 0.01 90);
      --text-muted: oklch(0.7 0.02 290);
      --text-faint: oklch(0.52 0.02 290);
      --violet: oklch(0.66 0.17 300);
      --violet-soft: oklch(0.66 0.17 300 / 0.16);
      --c-blue: #379ce2;
      --c-green: #52cba4;
      --c-purple: #d270d4;
      --c-peach: #ff985b;
      --shadow-card: 0 10px 30px -12px oklch(0 0 0 / 0.55);
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: #0b0b0d; font-family: 'Sora', ui-sans-serif, system-ui, sans-serif; }
    .display { font-family: 'Bricolage Grotesque', ui-sans-serif, system-ui, sans-serif; }
    .icon-btn { width: 42px; height: 42px; border-radius: 999px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .legend { display: flex; align-items: center; gap: 6px; }
    .dot { width: 9px; height: 9px; border-radius: 3px; flex-shrink: 0; }
    .chart-card { background: var(--bg-elevated); border: 1px solid var(--border); border-radius: 22px; padding: 22px; display: flex; flex-direction: column; align-items: center; gap: 18px; box-shadow: var(--shadow-card); }
  </style>
</helmet>

<div style="width:393px;background:var(--bg);color:var(--text);padding:24px 20px 40px;display:flex;flex-direction:column;gap:20px;">

  <div style="display:flex;align-items:center;justify-content:space-between;">
    <div class="icon-btn" style="background:var(--bg-elevated);border:1px solid var(--border);">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--text)" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
    </div>
    <span class="display" style="font-size:16.5px;font-weight:700;">Attendance — Events</span>
    <div class="icon-btn" style="background:var(--bg-elevated);border:1px solid var(--border);">
      <svg width="17" height="17" viewBox="0 -960 960 960" fill="var(--text-faint)"><path d="M448-284h66v-236h-66v236Zm31.82-308.92q14.64 0 24.72-9.9 10.08-9.91 10.08-24.54 0-14.64-9.91-24.72-9.9-10.07-24.53-10.07-14.64 0-24.72 9.9-10.08 9.9-10.08 24.54 0 14.63 9.91 24.71 9.9 10.08 24.53 10.08ZM480.13-88q-81.31 0-152.89-30.86-71.57-30.86-124.52-83.76-52.95-52.9-83.83-124.42Q88-398.55 88-479.87q0-81.56 30.92-153.37 30.92-71.8 83.92-124.91 53-53.12 124.42-83.48Q398.67-872 479.87-872q81.55 0 153.35 30.34 71.79 30.34 124.92 83.42 53.13 53.08 83.49 124.84Q872-561.64 872-480.05q0 81.59-30.34 152.83-30.34 71.23-83.41 124.28-53.07 53.05-124.81 84Q561.7-88 480.13-88Z"/></svg>
    </div>
  </div>

  <div>
    <label style="font-size:10.5px;font-weight:700;color:var(--text-muted);margin-bottom:6px;display:block;">Select events</label>
    <div style="display:flex;align-items:center;justify-content:space-between;background:var(--bg-elevated);border:1px solid var(--violet);border-radius:12px;padding:12px 14px;">
      <div style="display:flex;align-items:center;gap:8px;">
        <span style="font-size:11.5px;font-weight:700;padding:5px 11px;border-radius:999px;background:var(--violet-soft);color:var(--violet);">4 selected</span>
      </div>
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="var(--text-faint)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
    </div>
  </div>

  <div class="chart-card">
    <svg width="200" height="200" viewBox="0 0 200 200">
      <circle cx="100" cy="100" r="70" fill="none" stroke="var(--bg-elevated-2)" stroke-width="34"/>
      <circle cx="100" cy="100" r="70" fill="none" stroke="var(--c-green)" stroke-width="34" stroke-dasharray="155.8 439.82" stroke-dashoffset="0" transform="rotate(-90 100 100)"/>
      <circle cx="100" cy="100" r="70" fill="none" stroke="var(--c-blue)" stroke-width="34" stroke-dasharray="123.7 439.82" stroke-dashoffset="-155.8" transform="rotate(-90 100 100)"/>
      <circle cx="100" cy="100" r="70" fill="none" stroke="var(--c-purple)" stroke-width="34" stroke-dasharray="96.2 439.82" stroke-dashoffset="-279.5" transform="rotate(-90 100 100)"/>
      <circle cx="100" cy="100" r="70" fill="none" stroke="var(--c-peach)" stroke-width="34" stroke-dasharray="64.1 439.82" stroke-dashoffset="-375.7" transform="rotate(-90 100 100)"/>
      <text x="100" y="106" text-anchor="middle" font-family="Bricolage Grotesque" font-weight="800" font-size="24" fill="var(--text)">4 Events</text>
    </svg>
    <div style="display:flex;flex-direction:column;gap:10px;width:100%;">
      <div style="display:flex;align-items:center;justify-content:space-between;">
        <div class="legend"><div class="dot" style="background:var(--c-green);"></div><span style="font-size:12px;color:var(--text-muted);">Catan Game Night</span></div>
        <span style="font-size:12px;font-weight:700;">34 attendees</span>
      </div>
      <div style="display:flex;align-items:center;justify-content:space-between;">
        <div class="legend"><div class="dot" style="background:var(--c-blue);"></div><span style="font-size:12px;color:var(--text-muted);">Wingspan Draft Night</span></div>
        <span style="font-size:12px;font-weight:700;">27 attendees</span>
      </div>
      <div style="display:flex;align-items:center;justify-content:space-between;">
        <div class="legend"><div class="dot" style="background:var(--c-purple);"></div><span style="font-size:12px;color:var(--text-muted);">Splendor Newcomers Night</span></div>
        <span style="font-size:12px;font-weight:700;">21 attendees</span>
      </div>
      <div style="display:flex;align-items:center;justify-content:space-between;">
        <div class="legend"><div class="dot" style="background:var(--c-peach);"></div><span style="font-size:12px;color:var(--text-muted);">Azul Speed Draft</span></div>
        <span style="font-size:12px;font-weight:700;">14 attendees</span>
      </div>
    </div>
  </div>

  <span style="font-size:11.5px;color:var(--text-faint);text-align:center;">Processing, please wait<span style="letter-spacing:2px;">...</span></span>

</div>
</x-dc>
<script data-dc-script data-props='{}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
