<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Sora:wght@400;500;600;700&display=swap');
    :root {
      --bg: oklch(0.15 0.018 290);
      --bg-elevated: oklch(0.195 0.02 290);
      --bg-elevated-2: oklch(0.245 0.022 290);
      --border: oklch(0.34 0.02 290 / 0.55);
      --text: oklch(0.96 0.01 90);
      --text-muted: oklch(0.7 0.02 290);
      --text-faint: oklch(0.52 0.02 290);
      --amber: oklch(0.78 0.16 75);
      --coral: oklch(0.68 0.19 25);
      --teal: oklch(0.72 0.14 165);
      --violet: oklch(0.66 0.17 300);
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: #0b0b0d; font-family: 'Sora', ui-sans-serif, system-ui, sans-serif; }
    .display { font-family: 'Bricolage Grotesque', ui-sans-serif, system-ui, sans-serif; }
    .icon-btn { width: 42px; height: 42px; border-radius: 999px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .rank { width: 26px; height: 26px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 11.5px; font-weight: 800; flex-shrink: 0; color: #fff; }
    .row { display: flex; align-items: center; gap: 12px; background: var(--bg-elevated); border: 1px solid var(--border); border-radius: 18px; padding: 12px; }
    .thumb { width: 46px; height: 46px; border-radius: 12px; flex-shrink: 0; }
  </style>
</helmet>

<div style="width:393px;background:var(--bg);color:var(--text);padding:24px 20px 40px;display:flex;flex-direction:column;gap:20px;">

  <div style="display:flex;align-items:center;justify-content:space-between;">
    <div class="icon-btn" style="background:var(--bg-elevated);border:1px solid var(--border);">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--text)" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
    </div>
    <span class="display" style="font-size:18px;font-weight:700;">Most Played Games</span>
    <div class="icon-btn" style="background:var(--bg-elevated);border:1px solid var(--border);">
      <svg width="17" height="17" viewBox="0 -960 960 960" fill="var(--text-faint)"><path d="M448-284h66v-236h-66v236Zm31.82-308.92q14.64 0 24.72-9.9 10.08-9.91 10.08-24.54 0-14.64-9.91-24.72-9.9-10.07-24.53-10.07-14.64 0-24.72 9.9-10.08 9.9-10.08 24.54 0 14.63 9.91 24.71 9.9 10.08 24.53 10.08ZM480.13-88q-81.31 0-152.89-30.86-71.57-30.86-124.52-83.76-52.95-52.9-83.83-124.42Q88-398.55 88-479.87q0-81.56 30.92-153.37 30.92-71.8 83.92-124.91 53-53.12 124.42-83.48Q398.67-872 479.87-872q81.55 0 153.35 30.34 71.79 30.34 124.92 83.42 53.13 53.08 83.49 124.84Q872-561.64 872-480.05q0 81.59-30.34 152.83-30.34 71.23-83.41 124.28-53.07 53.05-124.81 84Q561.7-88 480.13-88Z"/></svg>
    </div>
  </div>

  <div style="display:flex;gap:8px;">
    <span style="font-size:12px;font-weight:700;padding:8px 16px;border-radius:999px;background:var(--amber);color:#2b1a02;">Weekly</span>
    <span style="font-size:12px;font-weight:600;padding:8px 16px;border-radius:999px;background:var(--bg-elevated);border:1px solid var(--border);color:var(--text-faint);">Monthly</span>
    <span style="font-size:12px;font-weight:600;padding:8px 16px;border-radius:999px;background:var(--bg-elevated);border:1px solid var(--border);color:var(--text-faint);">Yearly</span>
    <span style="font-size:12px;font-weight:600;padding:8px 16px;border-radius:999px;background:var(--bg-elevated);border:1px solid var(--border);color:var(--text-faint);">All time</span>
  </div>

  <div style="display:flex;align-items:center;justify-content:space-between;background:var(--bg-elevated);border:1px solid var(--border);border-radius:999px;padding:10px 14px;">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--text-faint)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
    <span style="font-size:12.5px;font-weight:700;">Aug 17 – Aug 23, 2026</span>
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--text)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>
  </div>

  <div style="display:flex;flex-direction:column;gap:10px;">

    <!-- expanded row: rank 1 -->
    <div style="display:flex;flex-direction:column;gap:10px;">
      <div class="row">
        <div class="rank" style="background:var(--amber);color:#2b1a02;">1</div>
        <div class="thumb" style="background:linear-gradient(150deg,#5a4fcf,#8ea2ff);"></div>
        <span style="flex:1;font-size:14px;font-weight:700;">Catan</span>
        <div style="display:flex;flex-direction:column;align-items:flex-end;">
          <span class="display" style="font-size:16px;font-weight:800;">34</span>
          <span style="font-size:10px;color:var(--text-faint);">plays</span>
        </div>
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="var(--text-faint)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;"><path d="M9 5l7 7-7 7" transform="rotate(90 12 12)"/></svg>
      </div>
      <!-- expanded per-user breakdown -->
      <div style="margin:0 4px;padding:12px 14px;background:var(--bg-elevated-2);border:1px solid var(--border);border-radius:14px;display:flex;flex-direction:column;gap:10px;">
        <div style="display:flex;align-items:center;justify-content:space-between;">
          <span style="font-size:12.5px;font-weight:700;">Maya R.</span>
          <span style="font-size:11px;color:var(--text-faint);">Last played Aug 22</span>
          <span style="font-size:12px;font-weight:700;color:var(--amber);">9 plays</span>
        </div>
        <div style="display:flex;align-items:center;justify-content:space-between;">
          <span style="font-size:12.5px;font-weight:700;">Jon C.</span>
          <span style="font-size:11px;color:var(--text-faint);">Last played Aug 21</span>
          <span style="font-size:12px;font-weight:700;color:var(--amber);">7 plays</span>
        </div>
        <div style="display:flex;align-items:center;justify-content:space-between;">
          <span style="font-size:12.5px;font-weight:700;">Sara L.</span>
          <span style="font-size:11px;color:var(--text-faint);">Last played Aug 19</span>
          <span style="font-size:12px;font-weight:700;color:var(--amber);">5 plays</span>
        </div>
      </div>
    </div>

    <div class="row">
      <div class="rank" style="background:var(--coral);">2</div>
      <div class="thumb" style="background:linear-gradient(135deg,#46945b,#a3d78a);"></div>
      <span style="flex:1;font-size:14px;font-weight:700;">Wingspan</span>
      <div style="display:flex;flex-direction:column;align-items:flex-end;">
        <span class="display" style="font-size:16px;font-weight:800;">28</span>
        <span style="font-size:10px;color:var(--text-faint);">plays</span>
      </div>
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="var(--text-faint)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;"><path d="M9 5l7 7-7 7"/></svg>
    </div>

    <div class="row">
      <div class="rank" style="background:var(--teal);color:#062017;">3</div>
      <div class="thumb" style="background:linear-gradient(135deg,#977f33,#fccd3d);"></div>
      <span style="flex:1;font-size:14px;font-weight:700;">Azul</span>
      <div style="display:flex;flex-direction:column;align-items:flex-end;">
        <span class="display" style="font-size:16px;font-weight:800;">19</span>
        <span style="font-size:10px;color:var(--text-faint);">plays</span>
      </div>
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="var(--text-faint)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;"><path d="M9 5l7 7-7 7"/></svg>
    </div>

    <div class="row">
      <div class="rank" style="background:var(--violet);">4</div>
      <div class="thumb" style="background:linear-gradient(150deg,#5a4fcf,#a2add6);"></div>
      <span style="flex:1;font-size:14px;font-weight:700;">Splendor</span>
      <div style="display:flex;flex-direction:column;align-items:flex-end;">
        <span class="display" style="font-size:16px;font-weight:800;">12</span>
        <span style="font-size:10px;color:var(--text-faint);">plays</span>
      </div>
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="var(--text-faint)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;"><path d="M9 5l7 7-7 7"/></svg>
    </div>

  </div>

</div>
</x-dc>
<script data-dc-script data-props='{}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
