<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Sora:wght@400;500;600;700&display=swap');
    :root {
      --bg: oklch(0.15 0.018 290);
      --bg-elevated: oklch(0.195 0.02 290);
      --bg-elevated-2: oklch(0.245 0.022 290);
      --border: oklch(0.34 0.02 290 / 0.55);
      --text: oklch(0.96 0.01 90);
      --text-muted: oklch(0.7 0.02 290);
      --text-faint: oklch(0.52 0.02 290);
      --teal: oklch(0.72 0.14 165);
      --teal-soft: oklch(0.72 0.14 165 / 0.16);
      --violet: oklch(0.66 0.17 300);
      --violet-soft: oklch(0.66 0.17 300 / 0.16);
      --shadow-card: 0 10px 30px -12px oklch(0 0 0 / 0.55);
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: #0b0b0d; font-family: 'Sora', ui-sans-serif, system-ui, sans-serif; }
    .display { font-family: 'Bricolage Grotesque', ui-sans-serif, system-ui, sans-serif; }
    .icon-btn { width: 42px; height: 42px; border-radius: 999px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .menu-card { background: var(--bg-elevated); border: 1px solid var(--border); border-radius: 22px; padding: 20px; display: flex; align-items: center; gap: 16px; box-shadow: var(--shadow-card); }
    .menu-icon { width: 52px; height: 52px; border-radius: 16px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  </style>
</helmet>

<div style="width:393px;background:var(--bg);color:var(--text);padding:24px 20px 40px;display:flex;flex-direction:column;gap:20px;">

  <div style="display:flex;align-items:center;justify-content:space-between;">
    <div class="icon-btn" style="background:var(--bg-elevated);border:1px solid var(--border);">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--text)" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
    </div>
    <span class="display" style="font-size:18px;font-weight:700;">Event Charts</span>
    <div style="width:42px;"></div>
  </div>
  <span style="font-size:12.5px;color:var(--text-muted);margin-top:-10px;">Break attendance down by date or by event.</span>

  <a href="#" class="menu-card">
    <div class="menu-icon" style="background:var(--teal-soft);">
      <svg width="24" height="24" viewBox="0 -960 960 960" fill="var(--teal)"><path d="M204.62-100q-27.62 0-46.12-18.5T140-164.62v-566.76q0-27.62 18.5-46.12T204.62-796h49.23v-63.85h68.3V-796h324v-63.85h66.16V-796h49.07q27.62 0 46.28 18.5Q826-759 826-731.38v566.76q0 27.62-18.5 46.12T761.38-100H204.62Z"/></svg>
    </div>
    <div style="flex:1;display:flex;flex-direction:column;gap:4px;">
      <span class="display" style="font-size:15px;font-weight:700;">Between Dates</span>
      <span style="font-size:12px;color:var(--text-muted);">Attendance across all events in a range</span>
    </div>
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--text-faint)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;"><path d="M9 5l7 7-7 7"/></svg>
  </a>

  <a href="#" class="menu-card">
    <div class="menu-icon" style="background:var(--violet-soft);">
      <svg width="24" height="24" viewBox="0 -960 960 960" fill="var(--violet)"><path d="M180-120v-66.15h66.15v-353.7q0-65 41.66-114.19T392.31-718v-19.85q0-25.61 18.16-42.88Q428.62-798 453.85-798h172.3q25.23 0 43.39 17.27 18.16 17.27 18.16 42.88V-718q99.42 12.65 141.08 61.85 41.66 49.19 41.66 114.19v353.7H936V-120H180Z"/></svg>
    </div>
    <div style="flex:1;display:flex;flex-direction:column;gap:4px;">
      <span class="display" style="font-size:15px;font-weight:700;">Select Event</span>
      <span style="font-size:12px;color:var(--text-muted);">Compare attendance for chosen events</span>
    </div>
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--text-faint)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;"><path d="M9 5l7 7-7 7"/></svg>
  </a>

</div>
</x-dc>
<script data-dc-script data-props='{}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
