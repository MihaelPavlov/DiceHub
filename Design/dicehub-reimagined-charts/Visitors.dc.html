<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Sora:wght@400;500;600;700&display=swap');
    :root {
      --bg: oklch(0.15 0.018 290);
      --bg-elevated: oklch(0.195 0.02 290);
      --bg-elevated-2: oklch(0.245 0.022 290);
      --border: oklch(0.34 0.02 290 / 0.55);
      --text: oklch(0.96 0.01 90);
      --text-muted: oklch(0.7 0.02 290);
      --text-faint: oklch(0.52 0.02 290);
      --amber: oklch(0.78 0.16 75);
      --c-blue: #379ce2;
      --shadow-card: 0 10px 30px -12px oklch(0 0 0 / 0.55);
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: #0b0b0d; font-family: 'Sora', ui-sans-serif, system-ui, sans-serif; }
    .display { font-family: 'Bricolage Grotesque', ui-sans-serif, system-ui, sans-serif; }
    .icon-btn { width: 42px; height: 42px; border-radius: 999px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .chart-card { background: var(--bg-elevated); border: 1px solid var(--border); border-radius: 22px; padding: 20px; display: flex; flex-direction: column; gap: 18px; box-shadow: var(--shadow-card); }
  </style>
</helmet>

<div style="width:393px;background:var(--bg);color:var(--text);padding:24px 20px 40px;display:flex;flex-direction:column;gap:20px;">

  <div style="display:flex;align-items:center;justify-content:space-between;">
    <div class="icon-btn" style="background:var(--bg-elevated);border:1px solid var(--border);">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--text)" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
    </div>
    <span class="display" style="font-size:18px;font-weight:700;">Visitors</span>
    <div class="icon-btn" style="background:var(--bg-elevated);border:1px solid var(--border);">
      <svg width="17" height="17" viewBox="0 -960 960 960" fill="var(--text-faint)"><path d="M448-284h66v-236h-66v236Zm31.82-308.92q14.64 0 24.72-9.9 10.08-9.91 10.08-24.54 0-14.64-9.91-24.72-9.9-10.07-24.53-10.07-14.64 0-24.72 9.9-10.08 9.9-10.08 24.54 0 14.63 9.91 24.71 9.9 10.08 24.53 10.08ZM480.13-88q-81.31 0-152.89-30.86-71.57-30.86-124.52-83.76-52.95-52.9-83.83-124.42Q88-398.55 88-479.87q0-81.56 30.92-153.37 30.92-71.8 83.92-124.91 53-53.12 124.42-83.48Q398.67-872 479.87-872q81.55 0 153.35 30.34 71.79 30.34 124.92 83.42 53.13 53.08 83.49 124.84Q872-561.64 872-480.05q0 81.59-30.34 152.83-30.34 71.23-83.41 124.28-53.07 53.05-124.81 84Q561.7-88 480.13-88Z"/></svg>
    </div>
  </div>

  <div style="display:flex;gap:8px;">
    <span style="font-size:12px;font-weight:700;padding:8px 16px;border-radius:999px;background:var(--amber);color:#2b1a02;">Weekly</span>
    <span style="font-size:12px;font-weight:600;padding:8px 16px;border-radius:999px;background:var(--bg-elevated);border:1px solid var(--border);color:var(--text-faint);">Monthly</span>
    <span style="font-size:12px;font-weight:600;padding:8px 16px;border-radius:999px;background:var(--bg-elevated);border:1px solid var(--border);color:var(--text-faint);">Yearly</span>
  </div>

  <div style="display:flex;align-items:center;justify-content:space-between;background:var(--bg-elevated);border:1px solid var(--border);border-radius:999px;padding:10px 14px;">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--text-faint)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
    <span style="font-size:12.5px;font-weight:700;">Aug 17 – Aug 23, 2026</span>
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--text)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>
  </div>

  <div class="chart-card">
    <div style="display:flex;align-items:baseline;justify-content:space-between;">
      <span class="display" style="font-size:26px;font-weight:800;">127</span>
      <span style="font-size:12px;font-weight:600;color:var(--text-muted);">unique visitors this week</span>
    </div>

    <svg width="100%" height="180" viewBox="0 0 340 180" preserveAspectRatio="none">
      <defs>
        <linearGradient id="gWeekly" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="var(--c-blue)" stop-opacity="0.5"/>
          <stop offset="100%" stop-color="var(--c-blue)" stop-opacity="0"/>
        </linearGradient>
      </defs>
      <line x1="0" y1="20" x2="340" y2="20" stroke="var(--border)" stroke-width="1"/>
      <line x1="0" y1="85" x2="340" y2="85" stroke="var(--border)" stroke-width="1"/>
      <line x1="0" y1="150" x2="340" y2="150" stroke="var(--border)" stroke-width="1"/>
      <polygon points="20,116.6 70,98 120,124 170,83.1 220,68.3 270,34.9 320,53.4 320,150 20,150" fill="url(#gWeekly)"/>
      <polyline points="20,116.6 70,98 120,124 170,83.1 220,68.3 270,34.9 320,53.4" fill="none" stroke="var(--c-blue)" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/>
      <circle cx="20" cy="116.6" r="4" fill="var(--c-blue)"/>
      <circle cx="70" cy="98" r="4" fill="var(--c-blue)"/>
      <circle cx="120" cy="124" r="4" fill="var(--c-blue)"/>
      <circle cx="170" cy="83.1" r="4" fill="var(--c-blue)"/>
      <circle cx="220" cy="68.3" r="4" fill="var(--c-blue)"/>
      <circle cx="270" cy="34.9" r="4.5" fill="var(--c-blue)" stroke="var(--bg)" stroke-width="2"/>
      <circle cx="320" cy="53.4" r="4" fill="var(--c-blue)"/>
    </svg>
    <div style="display:flex;justify-content:space-between;">
      <span style="font-size:10.5px;font-weight:600;color:var(--text-faint);">Mon</span>
      <span style="font-size:10.5px;font-weight:600;color:var(--text-faint);">Tue</span>
      <span style="font-size:10.5px;font-weight:600;color:var(--text-faint);">Wed</span>
      <span style="font-size:10.5px;font-weight:600;color:var(--text-faint);">Thu</span>
      <span style="font-size:10.5px;font-weight:600;color:var(--text-faint);">Fri</span>
      <span style="font-size:10.5px;font-weight:700;color:var(--c-blue);">Sat</span>
      <span style="font-size:10.5px;font-weight:600;color:var(--text-faint);">Sun</span>
    </div>
  </div>

</div>
</x-dc>
<script data-dc-script data-props='{}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
