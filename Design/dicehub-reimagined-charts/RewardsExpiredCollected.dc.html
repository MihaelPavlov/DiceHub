<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Sora:wght@400;500;600;700&display=swap');
    :root {
      --bg: oklch(0.15 0.018 290);
      --bg-elevated: oklch(0.195 0.02 290);
      --bg-elevated-2: oklch(0.245 0.022 290);
      --border: oklch(0.34 0.02 290 / 0.55);
      --text: oklch(0.96 0.01 90);
      --text-muted: oklch(0.7 0.02 290);
      --text-faint: oklch(0.52 0.02 290);
      --amber: oklch(0.78 0.16 75);
      --c-peach: #ff985b;
      --c-purple2: #a460e2;
      --shadow-card: 0 10px 30px -12px oklch(0 0 0 / 0.55);
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: #0b0b0d; font-family: 'Sora', ui-sans-serif, system-ui, sans-serif; }
    .display { font-family: 'Bricolage Grotesque', ui-sans-serif, system-ui, sans-serif; }
    .icon-btn { width: 42px; height: 42px; border-radius: 999px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .legend { display: flex; align-items: center; gap: 6px; }
    .dot { width: 9px; height: 9px; border-radius: 3px; flex-shrink: 0; }
    .hrow { display: flex; align-items: center; gap: 10px; }
    .hlabel { width: 34px; flex-shrink: 0; font-size: 11.5px; font-weight: 700; color: var(--text-muted); }
    .htrack { flex: 1; height: 17px; border-radius: 6px; background: var(--bg-elevated-2); overflow: hidden; }
    .hfill { height: 100%; border-radius: 6px; display: flex; align-items: center; justify-content: flex-end; padding-right: 8px; }
    .hval { font-size: 9.5px; font-weight: 700; color: #fff; white-space: nowrap; }
    .chart-card { background: var(--bg-elevated); border: 1px solid var(--border); border-radius: 22px; padding: 20px; display: flex; flex-direction: column; gap: 16px; box-shadow: var(--shadow-card); }
  </style>
</helmet>

<div style="width:393px;background:var(--bg);color:var(--text);padding:24px 20px 40px;display:flex;flex-direction:column;gap:20px;">

  <div style="display:flex;align-items:center;justify-content:space-between;">
    <div class="icon-btn" style="background:var(--bg-elevated);border:1px solid var(--border);">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--text)" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
    </div>
    <span class="display" style="font-size:16.5px;font-weight:700;">Expired &amp; Collected</span>
    <div class="icon-btn" style="background:var(--bg-elevated);border:1px solid var(--border);">
      <svg width="17" height="17" viewBox="0 -960 960 960" fill="var(--text-faint)"><path d="M448-284h66v-236h-66v236Zm31.82-308.92q14.64 0 24.72-9.9 10.08-9.91 10.08-24.54 0-14.64-9.91-24.72-9.9-10.07-24.53-10.07-14.64 0-24.72 9.9-10.08 9.9-10.08 24.54 0 14.63 9.91 24.71 9.9 10.08 24.53 10.08ZM480.13-88q-81.31 0-152.89-30.86-71.57-30.86-124.52-83.76-52.95-52.9-83.83-124.42Q88-398.55 88-479.87q0-81.56 30.92-153.37 30.92-71.8 83.92-124.91 53-53.12 124.42-83.48Q398.67-872 479.87-872q81.55 0 153.35 30.34 71.79 30.34 124.92 83.42 53.13 53.08 83.49 124.84Q872-561.64 872-480.05q0 81.59-30.34 152.83-30.34 71.23-83.41 124.28-53.07 53.05-124.81 84Q561.7-88 480.13-88Z"/></svg>
    </div>
  </div>

  <div style="display:flex;align-items:center;justify-content:space-between;background:var(--bg-elevated);border:1px solid var(--border);border-radius:999px;padding:10px 14px;">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--text-faint)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
    <span style="font-size:12.5px;font-weight:700;">2026</span>
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--text)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>
  </div>

  <div style="display:flex;align-items:center;gap:8px;background:var(--bg-elevated);border:1px solid var(--border);border-radius:999px;padding:11px 16px;">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--text-faint)" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2 1.6 1.6 0 0 0 0 6 2 2 0 0 1-2 2H6a2 2 0 0 1-2-2 1.6 1.6 0 0 0 0-6z"/></svg>
    <span style="font-size:13px;color:var(--text-faint);font-weight:500;">Filter by month…</span>
  </div>

  <div class="chart-card">
    <div style="display:flex;gap:14px;">
      <div class="legend"><div class="dot" style="background:var(--c-peach);"></div><span style="font-size:11px;color:var(--text-muted);">Collected</span></div>
      <div class="legend"><div class="dot" style="background:var(--c-purple2);"></div><span style="font-size:11px;color:var(--text-muted);">Expired</span></div>
    </div>

    <div style="display:flex;flex-direction:column;gap:9px;">
      <div class="hrow"><span class="hlabel">Jan</span><div class="htrack"><div class="hfill" style="width:14%;background:var(--c-peach);"><span class="hval">10 / 35 BGN</span></div></div></div>
      <div class="hrow"><span class="hlabel"></span><div class="htrack"><div class="hfill" style="width:7%;background:var(--c-purple2);"></div></div></div>

      <div class="hrow"><span class="hlabel">Apr</span><div class="htrack"><div class="hfill" style="width:43%;background:var(--c-peach);"><span class="hval">30 / 105 BGN</span></div></div></div>
      <div class="hrow"><span class="hlabel"></span><div class="htrack"><div class="hfill" style="width:29%;background:var(--c-purple2);"></div></div></div>

      <div class="hrow"><span class="hlabel">Jun</span><div class="htrack"><div class="hfill" style="width:57%;background:var(--c-peach);"><span class="hval">40 / 140 BGN</span></div></div></div>
      <div class="hrow"><span class="hlabel"></span><div class="htrack"><div class="hfill" style="width:36%;background:var(--c-purple2);"></div></div></div>

      <div class="hrow"><span class="hlabel">Aug</span><div class="htrack"><div class="hfill" style="width:71%;background:var(--c-peach);"><span class="hval">50 / 175 BGN</span></div></div></div>
      <div class="hrow"><span class="hlabel"></span><div class="htrack"><div class="hfill" style="width:57%;background:var(--c-purple2);"></div></div></div>

      <div class="hrow"><span class="hlabel">Oct</span><div class="htrack"><div class="hfill" style="width:86%;background:var(--c-peach);"><span class="hval">60 / 210 BGN</span></div></div></div>
      <div class="hrow"><span class="hlabel"></span><div class="htrack"><div class="hfill" style="width:43%;background:var(--c-purple2);"></div></div></div>

      <div class="hrow"><span class="hlabel">Dec</span><div class="htrack"><div class="hfill" style="width:100%;background:var(--c-peach);"><span class="hval">70 / 245 BGN</span></div></div></div>
      <div class="hrow"><span class="hlabel"></span><div class="htrack"><div class="hfill" style="width:50%;background:var(--c-purple2);"></div></div></div>
    </div>
  </div>

</div>
</x-dc>
<script data-dc-script data-props='{}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
