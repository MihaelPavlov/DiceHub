<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Sora:wght@400;500;600;700&display=swap');
    :root {
      --bg: oklch(0.15 0.018 290);
      --bg-elevated: oklch(0.195 0.02 290);
      --bg-elevated-2: oklch(0.245 0.022 290);
      --border: oklch(0.34 0.02 290 / 0.55);
      --text: oklch(0.96 0.01 90);
      --text-muted: oklch(0.7 0.02 290);
      --text-faint: oklch(0.52 0.02 290);
      --amber: oklch(0.78 0.16 75);
      --c-purple: #d270d4;
      --c-green2: #4ac95f;
      --shadow-card: 0 10px 30px -12px oklch(0 0 0 / 0.55);
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: #0b0b0d; font-family: 'Sora', ui-sans-serif, system-ui, sans-serif; }
    .display { font-family: 'Bricolage Grotesque', ui-sans-serif, system-ui, sans-serif; }
    .icon-btn { width: 42px; height: 42px; border-radius: 999px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .field-input { width: 100%; background: var(--bg-elevated-2); border: 1px solid var(--border); border-radius: 12px; padding: 11px 13px; font-size: 13px; color: var(--text); font-family: 'Sora', sans-serif; }
    .field-label { font-size: 10.5px; font-weight: 700; color: var(--text-muted); margin-bottom: 6px; display: block; }
    .legend { display: flex; align-items: center; gap: 6px; }
    .dot { width: 9px; height: 9px; border-radius: 3px; flex-shrink: 0; }
    .chart-card { background: var(--bg-elevated); border: 1px solid var(--border); border-radius: 22px; padding: 20px; display: flex; flex-direction: column; gap: 18px; box-shadow: var(--shadow-card); }
  </style>
</helmet>

<div style="width:393px;background:var(--bg);color:var(--text);padding:24px 20px 40px;display:flex;flex-direction:column;gap:20px;">

  <div style="display:flex;align-items:center;justify-content:space-between;">
    <div class="icon-btn" style="background:var(--bg-elevated);border:1px solid var(--border);">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--text)" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
    </div>
    <span class="display" style="font-size:18px;font-weight:700;">Reservations</span>
    <div class="icon-btn" style="background:var(--bg-elevated);border:1px solid var(--border);">
      <svg width="17" height="17" viewBox="0 -960 960 960" fill="var(--text-faint)"><path d="M448-284h66v-236h-66v236Zm31.82-308.92q14.64 0 24.72-9.9 10.08-9.91 10.08-24.54 0-14.64-9.91-24.72-9.9-10.07-24.53-10.07-14.64 0-24.72 9.9-10.08 9.9-10.08 24.54 0 14.63 9.91 24.71 9.9 10.08 24.53 10.08ZM480.13-88q-81.31 0-152.89-30.86-71.57-30.86-124.52-83.76-52.95-52.9-83.83-124.42Q88-398.55 88-479.87q0-81.56 30.92-153.37 30.92-71.8 83.92-124.91 53-53.12 124.42-83.48Q398.67-872 479.87-872q81.55 0 153.35 30.34 71.79 30.34 124.92 83.42 53.13 53.08 83.49 124.84Q872-561.64 872-480.05q0 81.59-30.34 152.83-30.34 71.23-83.41 124.28-53.07 53.05-124.81 84Q561.7-88 480.13-88Z"/></svg>
    </div>
  </div>

  <div style="display:flex;gap:8px;">
    <span style="font-size:12px;font-weight:700;padding:8px 14px;border-radius:999px;background:var(--amber);color:#2b1a02;">Last month</span>
    <span style="font-size:12px;font-weight:600;padding:8px 14px;border-radius:999px;background:var(--bg-elevated);border:1px solid var(--border);color:var(--text-faint);">3 months</span>
    <span style="font-size:12px;font-weight:600;padding:8px 14px;border-radius:999px;background:var(--bg-elevated);border:1px solid var(--border);color:var(--text-faint);">6 months</span>
  </div>

  <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;">
    <div>
      <label class="field-label">From</label>
      <input class="field-input" type="text" value="Jul 23, 2026" />
    </div>
    <div>
      <label class="field-label">To</label>
      <input class="field-input" type="text" value="Aug 23, 2026" />
    </div>
  </div>

  <div class="chart-card">
    <div style="display:flex;align-items:center;justify-content:space-between;">
      <span style="font-size:12px;font-weight:700;color:var(--text-muted);">By reservation type</span>
      <div style="display:flex;gap:12px;">
        <div class="legend"><div class="dot" style="background:var(--c-purple);"></div><span style="font-size:10.5px;color:var(--text-muted);">Completed</span></div>
        <div class="legend"><div class="dot" style="background:var(--c-green2);"></div><span style="font-size:10.5px;color:var(--text-muted);">Cancelled</span></div>
      </div>
    </div>

    <div style="display:flex;align-items:flex-end;justify-content:center;gap:56px;padding-top:24px;">
      <div style="display:flex;flex-direction:column;align-items:center;gap:10px;">
        <div style="display:flex;align-items:flex-end;gap:8px;">
          <div style="width:34px;height:90px;border-radius:6px 6px 0 0;background:var(--c-purple);position:relative;"><span style="position:absolute;top:-18px;left:0;right:0;text-align:center;font-size:11px;font-weight:700;">30</span></div>
          <div style="width:34px;height:30px;border-radius:6px 6px 0 0;background:var(--c-green2);position:relative;"><span style="position:absolute;top:-18px;left:0;right:0;text-align:center;font-size:11px;font-weight:700;">10</span></div>
        </div>
        <span style="font-size:12px;font-weight:600;color:var(--text-faint);">Table Reservations</span>
      </div>
      <div style="display:flex;flex-direction:column;align-items:center;gap:10px;">
        <div style="display:flex;align-items:flex-end;gap:8px;">
          <div style="width:34px;height:150px;border-radius:6px 6px 0 0;background:var(--c-purple);position:relative;"><span style="position:absolute;top:-18px;left:0;right:0;text-align:center;font-size:11px;font-weight:700;">50</span></div>
          <div style="width:34px;height:60px;border-radius:6px 6px 0 0;background:var(--c-green2);position:relative;"><span style="position:absolute;top:-18px;left:0;right:0;text-align:center;font-size:11px;font-weight:700;">20</span></div>
        </div>
        <span style="font-size:12px;font-weight:600;color:var(--text-faint);">Game Reservations</span>
      </div>
    </div>
  </div>

</div>
</x-dc>
<script data-dc-script data-props='{}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
