<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Sora:wght@400;500;600;700&display=swap');
    :root {
      --text: oklch(0.96 0.01 90);
      --text-muted: oklch(0.82 0.01 90 / 0.75);
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: #000; font-family: 'Sora', ui-sans-serif, system-ui, sans-serif; }
    .display { font-family: 'Bricolage Grotesque', ui-sans-serif, system-ui, sans-serif; }
    .icon-btn { width: 40px; height: 40px; border-radius: 999px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; background: oklch(0 0 0 / 0.4); backdrop-filter: blur(6px); }
  </style>
</helmet>

<div style="width:393px;height:760px;background:#0b0b0d;color:var(--text);position:relative;overflow:hidden;">

  <div style="position:absolute;inset:0;background:radial-gradient(120% 90% at 30% 20%,#4a3e8f,#151322 65%);"></div>
  <div style="position:absolute;inset:0;background:linear-gradient(155deg,transparent 40%,oklch(0 0 0 / 0.5) 100%);"></div>

  <div style="position:absolute;left:0;right:0;top:0;padding:20px 18px;display:flex;align-items:center;justify-content:space-between;background:linear-gradient(to bottom,oklch(0 0 0 / 0.55),transparent);">
    <div class="icon-btn">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--text)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12M18 6l-12 12"/></svg>
    </div>
    <span style="font-size:12.5px;font-weight:600;padding:8px 14px;border-radius:999px;background:oklch(0 0 0 / 0.4);backdrop-filter:blur(6px);">2 / 5</span>
  </div>

  <div style="position:absolute;left:0;right:0;bottom:0;padding:26px 22px 30px;display:flex;flex-direction:column;gap:4px;background:linear-gradient(to top,oklch(0 0 0 / 0.6),transparent);">
    <span class="display" style="font-size:16px;font-weight:700;">Catan — box &amp; components</span>
    <span style="font-size:12px;color:var(--text-muted);">Uploaded by staff · Games Library</span>
  </div>

</div>
</x-dc>
<script data-dc-script data-props='{}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
