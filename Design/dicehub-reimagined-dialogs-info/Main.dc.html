<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Sora:wght@400;500;600;700&display=swap');
    :root {
      --bg: oklch(0.15 0.018 290);
      --bg-elevated: oklch(0.195 0.02 290);
      --bg-elevated-2: oklch(0.245 0.022 290);
      --border: oklch(0.34 0.02 290 / 0.55);
      --text: oklch(0.96 0.01 90);
      --text-muted: oklch(0.7 0.02 290);
      --text-faint: oklch(0.52 0.02 290);
      --teal: oklch(0.72 0.14 165);
      --teal-soft: oklch(0.72 0.14 165 / 0.16);
      --shadow-modal: 0 24px 60px -20px oklch(0 0 0 / 0.7);
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: #0b0b0d; font-family: 'Sora', ui-sans-serif, system-ui, sans-serif; }
    .display { font-family: 'Bricolage Grotesque', ui-sans-serif, system-ui, sans-serif; }
    .icon-btn { width: 42px; height: 42px; border-radius: 999px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  </style>
</helmet>

<div style="width:393px;height:760px;background:var(--bg);color:var(--text);position:relative;overflow:hidden;">

  <div style="padding:24px 20px;display:flex;flex-direction:column;gap:18px;filter:brightness(0.55);">
    <div style="display:flex;align-items:center;justify-content:space-between;">
      <div class="icon-btn" style="background:var(--bg-elevated);border:1px solid var(--border);">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--text)" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
      </div>
      <span class="display" style="font-size:18px;font-weight:700;">Catan</span>
      <div style="width:42px;"></div>
    </div>
    <div style="width:100%;aspect-ratio:1.3;border-radius:24px;background:linear-gradient(150deg,#5a4fcf,#8ea2ff);"></div>
  </div>

  <div style="position:absolute;inset:0;background:oklch(0 0 0 / 0.45);"></div>

  <div style="position:absolute;left:50%;top:52%;transform:translate(-50%,-50%);width:310px;background:var(--bg-elevated);border:1px solid var(--border);border-radius:24px;padding:26px 22px 22px;box-shadow:var(--shadow-modal);display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center;">

    <div class="icon-btn" style="position:absolute;top:14px;right:14px;width:32px;height:32px;background:var(--bg-elevated-2);">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--text-faint)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12M18 6l-12 12"/></svg>
    </div>

    <span style="font-size:11px;font-weight:700;letter-spacing:0.06em;padding:5px 12px;border-radius:999px;background:var(--teal-soft);color:var(--teal);">GAME QR</span>

    <div style="display:flex;flex-direction:column;gap:2px;">
      <span class="display" style="font-size:17px;font-weight:700;">Catan</span>
      <span style="font-size:12px;color:var(--text-muted);">Shelf B3 · 3–4 players</span>
    </div>

    <div style="background:#fdfcf9;border-radius:16px;padding:14px;">
      <svg width="152" height="152" viewBox="0 0 176 176">
        <rect width="176" height="176" fill="#fdfcf9"/>
        <defs>
          <pattern id="qrA" width="16" height="16" patternUnits="userSpaceOnUse">
            <rect width="8" height="8" fill="#171519"/>
            <rect x="8" y="8" width="8" height="8" fill="#171519"/>
          </pattern>
        </defs>
        <rect x="8" y="8" width="160" height="160" fill="url(#qrA)"/>
        <rect x="4" y="4" width="56" height="56" fill="#171519"/><rect x="12" y="12" width="40" height="40" fill="#fdfcf9"/><rect x="20" y="20" width="24" height="24" fill="#171519"/>
        <rect x="116" y="4" width="56" height="56" fill="#171519"/><rect x="124" y="12" width="40" height="40" fill="#fdfcf9"/><rect x="132" y="20" width="24" height="24" fill="#171519"/>
        <rect x="4" y="116" width="56" height="56" fill="#171519"/><rect x="12" y="124" width="40" height="40" fill="#fdfcf9"/><rect x="20" y="132" width="24" height="24" fill="#171519"/>
      </svg>
    </div>

    <span style="font-family:ui-monospace,'SFMono-Regular',Menlo,monospace;font-size:12.5px;letter-spacing:0.04em;color:var(--text-muted);">GM-CTN-3B</span>
    <span style="font-size:12.5px;color:var(--text-muted);">Scan at the front desk to check this game out.</span>

    <a href="#" style="width:100%;text-align:center;font-size:13.5px;font-weight:700;padding:13px 0;border-radius:999px;background:var(--teal);color:#062420;margin-top:4px;">Done</a>
  </div>

</div>
</x-dc>
<script data-dc-script data-props='{}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
