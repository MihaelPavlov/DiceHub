<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Sora:wght@400;500;600;700&display=swap');
    :root {
      --bg: oklch(0.15 0.018 290);
      --bg-elevated: oklch(0.195 0.02 290);
      --bg-elevated-2: oklch(0.245 0.022 290);
      --border: oklch(0.34 0.02 290 / 0.55);
      --text: oklch(0.96 0.01 90);
      --text-muted: oklch(0.7 0.02 290);
      --text-faint: oklch(0.52 0.02 290);
      --amber: oklch(0.78 0.16 75);
      --amber-soft: oklch(0.78 0.16 75 / 0.16);
      --coral: oklch(0.68 0.19 25);
      --shadow-card: 0 10px 30px -12px oklch(0 0 0 / 0.55);
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: #0b0b0d; font-family: 'Sora', ui-sans-serif, system-ui, sans-serif; }
    .display { font-family: 'Bricolage Grotesque', ui-sans-serif, system-ui, sans-serif; }
    .icon-btn { width: 42px; height: 42px; border-radius: 999px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .eyebrow { font-size: 11px; font-weight: 700; letter-spacing: 0.08em; color: var(--amber); text-transform: uppercase; }
    .chip { font-size: 11px; font-weight: 600; padding: 6px 12px; border-radius: 999px; background: var(--bg-elevated); border: 1px solid var(--border); color: var(--text-muted); }
    .field-label { font-size: 12px; font-weight: 700; color: var(--text-muted); margin-bottom: 7px; display: block; }
    .field-input { width: 100%; background: var(--bg-elevated-2); border: 1px solid var(--border); border-radius: 14px; padding: 13px 15px; font-size: 14px; color: var(--text); font-family: 'Sora', sans-serif; }
    .auth-card { background: var(--bg-elevated); border: 1px solid var(--border); border-radius: 26px; padding: 22px; display: flex; flex-direction: column; gap: 16px; box-shadow: var(--shadow-card); }
  </style>
</helmet>

<div style="width:393px;background:var(--bg);color:var(--text);padding:24px 20px 40px;display:flex;flex-direction:column;gap:26px;">

  <div class="icon-btn" style="background:var(--bg-elevated);border:1px solid var(--border);">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--text)" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
  </div>

  <div style="display:flex;flex-direction:column;gap:10px;">
    <span class="eyebrow">DiceHub account</span>
    <span class="display" style="font-size:27px;font-weight:800;line-height:1.15;">Recover your access</span>
    <div style="display:flex;gap:8px;flex-wrap:wrap;">
      <span class="chip">Secure recovery</span>
      <span class="chip">Email delivery</span>
      <span class="chip">Quick access</span>
    </div>
  </div>

  <div class="auth-card">
    <span style="font-size:12.5px;color:var(--text-muted);line-height:1.55;">Enter the email on your account and we'll send you a link to reset your password.</span>

    <div>
      <label class="field-label">Email</label>
      <input class="field-input" type="text" placeholder="you@email.com" />
    </div>

    <a href="#" style="text-align:center;font-size:14px;font-weight:700;padding:15px 0;border-radius:999px;background:linear-gradient(135deg,var(--amber),var(--coral));color:#2b1502;box-shadow:0 10px 24px -8px var(--amber-soft);margin-top:4px;">Send</a>
  </div>

  <span style="text-align:center;font-size:12.5px;color:var(--text-muted);">You remembered your key! <a href="#" style="color:var(--amber);font-weight:700;">Sign In</a> to jump back into the action!</span>

</div>
</x-dc>
<script data-dc-script data-props='{}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
