<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Sora:wght@400;500;600;700&display=swap');
    :root {
      --bg: oklch(0.15 0.018 290);
      --bg-elevated: oklch(0.195 0.02 290);
      --bg-elevated-2: oklch(0.245 0.022 290);
      --border: oklch(0.34 0.02 290 / 0.55);
      --text: oklch(0.96 0.01 90);
      --text-muted: oklch(0.7 0.02 290);
      --text-faint: oklch(0.52 0.02 290);
      --amber: oklch(0.78 0.16 75);
      --amber-soft: oklch(0.78 0.16 75 / 0.16);
      --coral: oklch(0.68 0.19 25);
      --violet: oklch(0.66 0.17 300);
      --violet-soft: oklch(0.66 0.17 300 / 0.16);
      --shadow-card: 0 10px 30px -12px oklch(0 0 0 / 0.55);
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: #0b0b0d; font-family: 'Sora', ui-sans-serif, system-ui, sans-serif; }
    .display { font-family: 'Bricolage Grotesque', ui-sans-serif, system-ui, sans-serif; }
    .icon-btn { width: 42px; height: 42px; border-radius: 999px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .eyebrow { font-size: 11px; font-weight: 700; letter-spacing: 0.08em; color: var(--amber); text-transform: uppercase; }
    .chip { font-size: 11px; font-weight: 600; padding: 6px 12px; border-radius: 999px; background: var(--bg-elevated); border: 1px solid var(--border); color: var(--text-muted); }
    .choice { display: flex; align-items: center; gap: 14px; background: var(--bg-elevated); border: 1px solid var(--border); border-radius: 22px; padding: 18px; box-shadow: var(--shadow-card); }
    .choice-icon { width: 52px; height: 52px; border-radius: 16px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  </style>
</helmet>

<div style="width:393px;background:var(--bg);color:var(--text);padding:24px 20px 40px;display:flex;flex-direction:column;gap:26px;">

  <div class="icon-btn" style="background:var(--bg-elevated);border:1px solid var(--border);">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--text)" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
  </div>

  <div style="display:flex;flex-direction:column;gap:10px;">
    <span class="eyebrow">Create account</span>
    <span class="display" style="font-size:27px;font-weight:800;line-height:1.15;">Choose your DiceHub path</span>
    <div style="display:flex;gap:8px;flex-wrap:wrap;">
      <span class="chip">1. Choose path</span>
      <span class="chip">2. Details</span>
      <span class="chip">3. Confirm email</span>
    </div>
  </div>

  <div style="display:flex;flex-direction:column;gap:6px;">
    <span class="display" style="font-size:19px;font-weight:700;">Join DiceHub</span>
    <span style="font-size:12.5px;color:var(--text-muted);">Pick the account that fits what you're here to do.</span>
  </div>

  <a href="#" class="choice">
    <div class="choice-icon" style="background:var(--amber-soft);">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="var(--amber)" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="4"/><circle cx="8.5" cy="8.5" r="1.15" fill="var(--amber)" stroke="none"/><circle cx="15.5" cy="8.5" r="1.15" fill="var(--amber)" stroke="none"/><circle cx="12" cy="12" r="1.15" fill="var(--amber)" stroke="none"/><circle cx="8.5" cy="15.5" r="1.15" fill="var(--amber)" stroke="none"/><circle cx="15.5" cy="15.5" r="1.15" fill="var(--amber)" stroke="none"/></svg>
    </div>
    <div style="flex:1;display:flex;flex-direction:column;gap:3px;">
      <span style="font-size:15px;font-weight:700;">I'm a Player</span>
      <span style="font-size:12px;color:var(--text-muted);">Create a player account and join a club</span>
    </div>
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--text-faint)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;"><path d="M9 5l7 7-7 7"/></svg>
  </a>

  <a href="#" class="choice">
    <div class="choice-icon" style="background:var(--violet-soft);">
      <svg width="24" height="24" viewBox="0 -960 960 960" fill="var(--violet)"><path d="M120-160v-66.15h66.15v-353.7q0-65 41.66-114.19T332.31-758v-19.85q0-25.61 18.16-42.88Q368.62-838 393.85-838h172.3q25.23 0 43.39 17.27 18.16 17.27 18.16 42.88V242q99.42 12.65 141.08 61.85 41.66 49.19 41.66 114.19v353.7H876V-160H120Z"/></svg>
    </div>
    <div style="flex:1;display:flex;flex-direction:column;gap:5px;">
      <div style="display:flex;align-items:center;gap:8px;">
        <span style="font-size:15px;font-weight:700;">I own a Venue / Club</span>
      </div>
      <span style="font-size:12px;color:var(--text-muted);">Apply as a venue owner</span>
      <span style="font-size:10px;font-weight:700;padding:4px 9px;border-radius:999px;background:var(--violet-soft);color:var(--violet);width:fit-content;">REQUIRES VERIFICATION</span>
    </div>
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--text-faint)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;"><path d="M9 5l7 7-7 7"/></svg>
  </a>

  <span style="text-align:center;font-size:12.5px;color:var(--text-muted);">Already have an account? <a href="#" style="color:var(--amber);font-weight:700;">Sign in</a></span>

</div>
</x-dc>
<script data-dc-script data-props='{}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
