<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Sora:wght@400;500;600;700&display=swap');
    :root {
      --bg: oklch(0.15 0.018 290);
      --bg-elevated: oklch(0.195 0.02 290);
      --bg-elevated-2: oklch(0.245 0.022 290);
      --border: oklch(0.34 0.02 290 / 0.55);
      --text: oklch(0.96 0.01 90);
      --text-muted: oklch(0.7 0.02 290);
      --text-faint: oklch(0.52 0.02 290);
      --amber: oklch(0.78 0.16 75);
      --amber-soft: oklch(0.78 0.16 75 / 0.16);
      --coral: oklch(0.68 0.19 25);
      --shadow-card: 0 10px 30px -12px oklch(0 0 0 / 0.55);
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: #0b0b0d; font-family: 'Sora', ui-sans-serif, system-ui, sans-serif; }
    .display { font-family: 'Bricolage Grotesque', ui-sans-serif, system-ui, sans-serif; }
    .icon-btn { width: 42px; height: 42px; border-radius: 999px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .eyebrow { font-size: 11px; font-weight: 700; letter-spacing: 0.08em; color: var(--amber); text-transform: uppercase; }
    .chip { font-size: 11px; font-weight: 600; padding: 6px 12px; border-radius: 999px; background: var(--bg-elevated); border: 1px solid var(--border); color: var(--text-muted); }
    .club-row { display: flex; align-items: center; gap: 14px; background: var(--bg-elevated); border: 1px solid var(--border); border-radius: 18px; padding: 13px 16px; }
    .club-logo { width: 44px; height: 44px; border-radius: 12px; flex-shrink: 0; }
  </style>
</helmet>

<div style="width:393px;background:var(--bg);color:var(--text);padding:24px 20px 40px;display:flex;flex-direction:column;gap:22px;position:relative;">

  <div class="icon-btn" style="background:var(--bg-elevated);border:1px solid var(--border);">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--text)" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
  </div>

  <div style="display:flex;flex-direction:column;gap:10px;">
    <span class="eyebrow">DiceHub access</span>
    <span class="display" style="font-size:27px;font-weight:800;line-height:1.15;">Find your club</span>
    <div style="display:flex;gap:8px;flex-wrap:wrap;">
      <span class="chip">Trusted venues</span>
      <span class="chip">One account</span>
      <span class="chip">Multiple clubs</span>
    </div>
  </div>

  <div style="display:flex;flex-direction:column;gap:6px;">
    <span class="display" style="font-size:18px;font-weight:700;">Which club are you in?</span>
    <span style="font-size:12.5px;color:var(--text-muted);">Pick one to continue to its login.</span>
  </div>

  <div style="display:flex;flex-direction:column;gap:10px;padding-bottom:60px;">

    <div class="club-row">
      <div class="club-logo" style="background:linear-gradient(150deg,#5a4fcf,#8ea2ff);"></div>
      <span style="flex:1;font-size:14px;font-weight:700;">Nexus Board Game Club</span>
    </div>

    <div class="club-row" style="border-color:var(--amber);background:var(--amber-soft);">
      <div class="club-logo" style="background:linear-gradient(135deg,#977f33,#fccd3d);"></div>
      <span style="flex:1;font-size:14px;font-weight:700;">The Rolling Dice Cafe</span>
      <div class="icon-btn" style="width:26px;height:26px;background:var(--amber);flex-shrink:0;">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#2b1a02" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7"/></svg>
      </div>
    </div>

    <div class="club-row">
      <div class="club-logo" style="background:linear-gradient(135deg,#46945b,#a3d78a);"></div>
      <span style="flex:1;font-size:14px;font-weight:700;">Meeple &amp; Mug</span>
    </div>

  </div>

  <!-- FAB -->
  <div style="position:absolute;right:20px;bottom:24px;width:58px;height:58px;border-radius:999px;background:linear-gradient(135deg,var(--amber),var(--coral));display:flex;align-items:center;justify-content:center;box-shadow:0 10px 24px -6px var(--amber-soft);">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#2b1502" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>
  </div>

</div>
</x-dc>
<script data-dc-script data-props='{}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
