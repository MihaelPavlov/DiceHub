<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Sora:wght@400;500;600;700&display=swap');
    :root {
      --bg: oklch(0.15 0.018 290);
      --bg-elevated: oklch(0.195 0.02 290);
      --bg-elevated-2: oklch(0.245 0.022 290);
      --border: oklch(0.34 0.02 290 / 0.55);
      --text: oklch(0.96 0.01 90);
      --text-muted: oklch(0.7 0.02 290);
      --text-faint: oklch(0.52 0.02 290);
      --amber: oklch(0.78 0.16 75);
      --amber-soft: oklch(0.78 0.16 75 / 0.16);
      --coral: oklch(0.68 0.19 25);
      --coral-soft: oklch(0.68 0.19 25 / 0.16);
      --teal: oklch(0.72 0.14 165);
      --teal-soft: oklch(0.72 0.14 165 / 0.16);
      --violet: oklch(0.66 0.17 300);
      --violet-soft: oklch(0.66 0.17 300 / 0.16);
      --shadow-card: 0 10px 30px -12px oklch(0 0 0 / 0.55);
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: #0b0b0d; font-family: 'Sora', ui-sans-serif, system-ui, sans-serif; }
    .display { font-family: 'Bricolage Grotesque', ui-sans-serif, system-ui, sans-serif; }
    .nav-item { display: flex; align-items: center; gap: 12px; padding: 11px 14px; border-radius: 12px; }
    .nav-item span { font-size: 13.5px; font-weight: 600; color: var(--text-muted); }
    .nav-item.active { background: var(--amber-soft); }
    .nav-item.active span { color: var(--amber); font-weight: 700; }
    .seg3 { display: flex; gap: 6px; background: var(--bg-elevated-2); padding: 5px; border-radius: 16px; width: 420px; }
    .seg3 span { flex: 1; text-align: center; font-size: 13px; font-weight: 600; padding: 11px 0; border-radius: 12px; color: var(--text-faint); }
    .seg3 span.active { font-weight: 700; background: var(--amber); color: #2b1a02; }
    .row { display: flex; gap: 16px; background: var(--bg-elevated); border: 1px solid var(--border); border-radius: 18px; padding: 14px 18px; align-items: center; }
    .row-thumb { width: 56px; height: 56px; border-radius: 14px; flex-shrink: 0; }
    .icon-btn { width: 42px; height: 42px; border-radius: 999px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  </style>
</helmet>

<div style="width:1440px;min-height:820px;display:flex;background:var(--bg);color:var(--text);">

  <!-- Sidebar -->
  <div style="width:264px;flex-shrink:0;background:var(--bg-elevated);border-right:1px solid var(--border);padding:28px 18px;display:flex;flex-direction:column;gap:30px;">
    <div style="display:flex;align-items:center;gap:10px;padding:0 6px;">
      <div style="width:36px;height:36px;border-radius:11px;background:linear-gradient(135deg,var(--amber),var(--coral));display:flex;align-items:center;justify-content:center;flex-shrink:0;">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#2b1502" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M8 4h8v4a4 4 0 0 1-8 0z"/><path d="M8 5H5a3 3 0 0 0 3 5"/><path d="M16 5h3a3 3 0 0 1-3 5"/><path d="M10 13v3M14 13v3"/><path d="M8 20h8"/><path d="M9 17h6l1 3H8z"/></svg>
      </div>
      <span class="display" style="font-size:17px;font-weight:800;">DiceHub</span>
    </div>

    <div style="display:flex;flex-direction:column;gap:3px;">
      <div class="nav-item">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="var(--text-faint)" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11.5 12 4l8 7.5"/><path d="M6 10v9a1 1 0 0 0 1 1h4v-6h2v6h4a1 1 0 0 0 1-1v-9"/></svg>
        <span>Games</span>
      </div>
      <div class="nav-item">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="var(--text-faint)" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2 1.6 1.6 0 0 0 0 6 2 2 0 0 1-2 2H6a2 2 0 0 1-2-2 1.6 1.6 0 0 0 0-6z"/><path d="M9 7.5v2M9 12.5v2M9 17v-2"/></svg>
        <span>Events</span>
      </div>
      <div class="nav-item">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="var(--text-faint)" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3"/><path d="M3 19c.8-3.3 3-5 6-5s5.2 1.7 6 5"/><circle cx="17" cy="9" r="2.4"/><path d="M15.5 12.2c2.6.2 4 1.7 4.6 4.3"/></svg>
        <span>Meeples</span>

      <div class="nav-item">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="var(--text-faint)" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="5" width="16" height="15" rx="3"/><path d="M4 10h16"/><path d="M8 3v4M16 3v4"/><path d="M9.5 14l1.8 1.8L15 12"/></svg>
        <span>Reservations</span>
      </div>
      <div class="nav-item">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="var(--text-faint)" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="M4 12h10"/><path d="M14 4v16"/><circle cx="9" cy="8" r="1.3"/></svg>
        <span>Space</span>
      </div>
      <div class="nav-item active">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="var(--amber)" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M8 4h8v4a4 4 0 0 1-8 0z"/><path d="M8 5H5a3 3 0 0 0 3 5"/><path d="M16 5h3a3 3 0 0 1-3 5"/><path d="M10 13v3M14 13v3"/><path d="M8 20h8"/><path d="M9 17h6l1 3H8z"/></svg>
        <span>Challenges</span>
      </div>
      <div class="nav-item">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="var(--text-faint)" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="3.5"/><path d="M5 20c1.2-4 4-5.5 7-5.5s5.8 1.5 7 5.5"/></svg>
        <span>Profile</span>
      </div>
    </div>

    <div style="margin-top:auto;display:flex;align-items:center;gap:10px;padding:10px;border-radius:14px;background:var(--bg-elevated-2);border:1px solid var(--border);">
      <div style="width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,var(--teal),var(--violet));flex-shrink:0;"></div>
      <div style="display:flex;flex-direction:column;min-width:0;">
        <span style="font-size:12.5px;font-weight:700;">Ivan Petrov</span>
        <span style="font-size:11px;color:var(--text-faint);">Dice &amp; Dragons Club</span>
      </div>
    </div>
  </div>

  <!-- Content -->
  <div style="flex:1;min-width:0;padding:40px 48px 56px;display:flex;flex-direction:column;gap:28px;">

    <div style="display:flex;flex-direction:column;gap:4px;">
      <span class="display" style="font-size:34px;font-weight:800;">Challenges Manager</span>
      <span style="font-size:14px;color:var(--text-muted);font-weight:500;">12 challenges</span>
    </div>

    <div class="seg3">
      <span class="active">Challenges</span>
      <span>Rewards</span>
      <span>Custom period</span>
    </div>

    <div style="display:flex;align-items:center;justify-content:space-between;gap:24px;max-width:1080px;">
      <a href="#" style="display:flex;align-items:center;gap:8px;font-size:14px;font-weight:700;padding:13px 22px;border-radius:999px;background:var(--amber);color:#2b1a02;flex-shrink:0;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#2b1a02" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
        Add challenge
      </a>
      <div style="flex:1;max-width:320px;display:flex;align-items:center;gap:10px;background:var(--bg-elevated);border:1px solid var(--border);border-radius:999px;padding:13px 18px;">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="var(--text-faint)" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.5l2.4 5 5.5.7-4 3.8 1 5.5-4.9-2.7-4.9 2.7 1-5.5-4-3.8 5.5-.7z"/></svg>
        <span style="font-size:13.5px;color:var(--text-faint);font-weight:500;">Filter by game…</span>
      </div>
    </div>

    <div style="display:flex;flex-direction:column;gap:12px;max-width:1080px;">

      <div class="row">
        <div class="row-thumb" style="background:linear-gradient(150deg,#5a4fcf,#8ea2ff);"></div>
        <span style="flex:1;min-width:0;font-size:15px;font-weight:700;">Catan</span>
        <span style="font-size:12.5px;color:var(--text-muted);flex-shrink:0;">3 attempts · +10 pts</span>
        <div style="display:flex;gap:8px;flex-shrink:0;">
          <div class="icon-btn" style="background:var(--bg-elevated-2);">
            <svg width="16" height="16" viewBox="0 -960 960 960" fill="var(--text-faint)"><path d="M194-194h43.92l407.93-407.92-43.93-42.93L194-236.92V-194Zm-66 66v-136.77l557.23-558.77q5.15-5.48 11.57-6.97 6.43-1.49 12.49-1.49 6.06 0 11.12.54 5.05.54 11.44 6.15l92.69 91.93q5.61 6.38 6.54 12 .92 5.63.92 12.25 0 6.13-1.74 12.06-1.74 5.92-6.72 11.07L264.77-128H128Z"/></svg>
          </div>
          <div class="icon-btn" style="background:var(--coral-soft);">
            <svg width="16" height="16" viewBox="0 -960 960 960" fill="var(--coral)"><path d="M300.62-128q-38.85 0-64.74-25.88Q210-179.77 210-218.62V-724h-40v-66h188v-38.77h246V-790h188v66h-40v505.38q0 38.35-26.14 64.48Q699.73-128 661.38-128H300.62Z"/></svg>
          </div>
        </div>
      </div>

      <div class="row">
        <div class="row-thumb" style="background:linear-gradient(135deg,#46945b,#a3d78a);"></div>
        <span style="flex:1;min-width:0;font-size:15px;font-weight:700;">Wingspan</span>
        <span style="font-size:12.5px;color:var(--text-muted);flex-shrink:0;">2 attempts · +15 pts</span>
        <div style="display:flex;gap:8px;flex-shrink:0;">
          <div class="icon-btn" style="background:var(--bg-elevated-2);">
            <svg width="16" height="16" viewBox="0 -960 960 960" fill="var(--text-faint)"><path d="M194-194h43.92l407.93-407.92-43.93-42.93L194-236.92V-194Zm-66 66v-136.77l557.23-558.77q5.15-5.48 11.57-6.97 6.43-1.49 12.49-1.49 6.06 0 11.12.54 5.05.54 11.44 6.15l92.69 91.93q5.61 6.38 6.54 12 .92 5.63.92 12.25 0 6.13-1.74 12.06-1.74 5.92-6.72 11.07L264.77-128H128Z"/></svg>
          </div>
          <div class="icon-btn" style="background:var(--coral-soft);">
            <svg width="16" height="16" viewBox="0 -960 960 960" fill="var(--coral)"><path d="M300.62-128q-38.85 0-64.74-25.88Q210-179.77 210-218.62V-724h-40v-66h188v-38.77h246V-790h188v66h-40v505.38q0 38.35-26.14 64.48Q699.73-128 661.38-128H300.62Z"/></svg>
          </div>
        </div>
      </div>

      <div class="row">
        <div class="row-thumb" style="background:linear-gradient(135deg,#977f33,#fccd3d);"></div>
        <span style="flex:1;min-width:0;font-size:15px;font-weight:700;">Splendor</span>
        <span style="font-size:12.5px;color:var(--text-muted);flex-shrink:0;">5 attempts · +20 pts</span>
        <div style="display:flex;gap:8px;flex-shrink:0;">
          <div class="icon-btn" style="background:var(--bg-elevated-2);">
            <svg width="16" height="16" viewBox="0 -960 960 960" fill="var(--text-faint)"><path d="M194-194h43.92l407.93-407.92-43.93-42.93L194-236.92V-194Zm-66 66v-136.77l557.23-558.77q5.15-5.48 11.57-6.97 6.43-1.49 12.49-1.49 6.06 0 11.12.54 5.05.54 11.44 6.15l92.69 91.93q5.61 6.38 6.54 12 .92 5.63.92 12.25 0 6.13-1.74 12.06-1.74 5.92-6.72 11.07L264.77-128H128Z"/></svg>
          </div>
          <div class="icon-btn" style="background:var(--coral-soft);">

    </div>

  </div>
</div>
