<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Sora:wght@400;500;600;700&display=swap');
    :root {
      --bg: oklch(0.15 0.018 290);
      --bg-elevated: oklch(0.195 0.02 290);
      --bg-elevated-2: oklch(0.245 0.022 290);
      --border: oklch(0.34 0.02 290 / 0.55);
      --text: oklch(0.96 0.01 90);
      --text-muted: oklch(0.7 0.02 290);
      --text-faint: oklch(0.52 0.02 290);
      --amber: oklch(0.78 0.16 75);
      --coral: oklch(0.68 0.19 25);
      --teal: oklch(0.72 0.14 165);
      --teal-soft: oklch(0.72 0.14 165 / 0.16);
      --shadow-card: 0 10px 30px -12px oklch(0 0 0 / 0.55);
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: #0b0b0d; font-family: 'Sora', ui-sans-serif, system-ui, sans-serif; }
    .display { font-family: 'Bricolage Grotesque', ui-sans-serif, system-ui, sans-serif; }
    a { color: var(--amber); }
    a:hover { color: var(--coral); }
    .icon-btn { width: 42px; height: 42px; border-radius: 999px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  </style>
</helmet>

<div style="width:1440px;min-height:820px;background:var(--bg);color:var(--text);display:flex;flex-direction:column;">

  <div style="padding:32px 48px;display:flex;align-items:center;gap:14px;">
    <div class="icon-btn" style="background:var(--bg-elevated);border:1px solid var(--border);">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--text)" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
    </div>
    <span class="display" style="font-size:17px;font-weight:700;">Nexus Board Game Club</span>
  </div>

  <div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;text-align:center;">

    <div style="width:108px;height:108px;border-radius:50%;background:var(--teal-soft);display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 14px oklch(0.72 0.14 165 / 0.08);">
      <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="var(--teal)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7"/></svg>
    </div>

    <div style="display:flex;flex-direction:column;gap:10px;">
      <span class="display" style="font-size:28px;font-weight:800;">Email confirmed</span>
      <span style="font-size:15px;color:var(--text-muted);line-height:1.6;max-width:380px;">Your account is verified. Redirecting you to login…</span>
    </div>

    <a href="#" style="font-size:13.5px;font-weight:700;padding:14px 26px;border-radius:999px;background:var(--bg-elevated);border:1px solid var(--border);color:var(--text-muted);">Click here if you are not redirected automatically</a>

  </div>

</div>
</x-dc>
<script data-dc-script data-props='{}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
