<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Sora:wght@400;500;600;700&display=swap');
    :root {
      --bg: oklch(0.15 0.018 290);
      --bg-elevated: oklch(0.195 0.02 290);
      --bg-elevated-2: oklch(0.245 0.022 290);
      --border: oklch(0.34 0.02 290 / 0.55);
      --text: oklch(0.96 0.01 90);
      --text-muted: oklch(0.7 0.02 290);
      --text-faint: oklch(0.52 0.02 290);
      --amber: oklch(0.78 0.16 75);
      --amber-soft: oklch(0.78 0.16 75 / 0.16);
      --coral: oklch(0.68 0.19 25);
      --coral-soft: oklch(0.68 0.19 25 / 0.16);
      --teal: oklch(0.72 0.14 165);
      --teal-soft: oklch(0.72 0.14 165 / 0.16);
      --shadow-card: 0 10px 30px -12px oklch(0 0 0 / 0.55);
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: #0b0b0d; font-family: 'Sora', ui-sans-serif, system-ui, sans-serif; }
    .display { font-family: 'Bricolage Grotesque', ui-sans-serif, system-ui, sans-serif; }
    .icon-btn { width: 42px; height: 42px; border-radius: 999px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .seg3 { display: flex; gap: 6px; background: var(--bg-elevated-2); padding: 4px; border-radius: 14px; }
    .seg3 span { flex: 1; text-align: center; font-size: 11.5px; font-weight: 600; padding: 9px 0; border-radius: 11px; color: var(--text-faint); }
    .seg3 span.active { font-weight: 700; background: var(--amber); color: #2b1a02; }
    .row { display: flex; gap: 12px; background: var(--bg-elevated); border: 1px solid var(--border); border-radius: 18px; padding: 12px; align-items: center; }
    .row-thumb { width: 58px; height: 58px; border-radius: 14px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; padding: 8px; }
  </style>
</helmet>

<div style="width:393px;background:var(--bg);color:var(--text);padding:24px 20px 32px;display:flex;flex-direction:column;gap:18px;">

  <span class="display" style="font-size:24px;font-weight:800;">Challenges Manager</span>

  <div class="seg3">
    <span>Challenges</span>
    <span class="active">Rewards</span>
    <span>Custom period</span>
  </div>

  <div style="display:flex;align-items:center;justify-content:space-between;">
    <a href="#" style="display:flex;align-items:center;gap:7px;font-size:12.5px;font-weight:700;padding:9px 15px;border-radius:999px;background:var(--amber);color:#2b1a02;">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#2b1a02" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
      Add reward
    </a>
    <span style="font-size:12px;font-weight:600;color:var(--text-faint);">9 rewards</span>
  </div>

  <div style="display:flex;align-items:center;gap:8px;background:var(--bg-elevated);border:1px solid var(--border);border-radius:999px;padding:11px 16px;">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--text-faint)" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M20 20l-4.8-4.8"/></svg>
    <span style="font-size:13px;color:var(--text-faint);font-weight:500;">Search rewards…</span>
  </div>

  <div style="display:flex;flex-direction:column;gap:12px;">

    <div class="row">
      <div class="row-thumb" style="background:var(--amber-soft);"><img src="gold_medal.png" style="width:100%;height:100%;object-fit:contain;"></div>
      <div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:5px;">
        <span style="font-size:14px;font-weight:700;">Free drink voucher</span>
        <span style="font-size:11.5px;color:var(--text-muted);">Requires 25 pts · $3.50</span>
      </div>
      <div style="display:flex;gap:10px;flex-shrink:0;">
        <svg width="17" height="17" viewBox="0 -960 960 960" fill="var(--text-faint)"><path d="M194-194h43.92l407.93-407.92-43.93-42.93L194-236.92V-194Zm-66 66v-136.77l557.23-558.77q5.15-5.48 11.57-6.97 6.43-1.49 12.49-1.49 6.06 0 11.12.54 5.05.54 11.44 6.15l92.69 91.93q5.61 6.38 6.54 12 .92 5.63.92 12.25 0 6.13-1.74 12.06-1.74 5.92-6.72 11.07L264.77-128H128Z"/></svg>
        <svg width="17" height="17" viewBox="0 -960 960 960" fill="var(--coral)"><path d="M300.62-128q-38.85 0-64.74-25.88Q210-179.77 210-218.62V-724h-40v-66h188v-38.77h246V-790h188v66h-40v505.38q0 38.35-26.14 64.48Q699.73-128 661.38-128H300.62Z"/></svg>
      </div>
    </div>

    <div class="row">
      <div class="row-thumb" style="background:var(--teal-soft);"><img src="silver_medal.png" style="width:100%;height:100%;object-fit:contain;"></div>
      <div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:5px;">
        <span style="font-size:14px;font-weight:700;">1 hour table time</span>
        <span style="font-size:11.5px;color:var(--text-muted);">Requires 50 pts · $8.00</span>
      </div>
      <div style="display:flex;gap:10px;flex-shrink:0;">
        <svg width="17" height="17" viewBox="0 -960 960 960" fill="var(--text-faint)"><path d="M194-194h43.92l407.93-407.92-43.93-42.93L194-236.92V-194Zm-66 66v-136.77l557.23-558.77q5.15-5.48 11.57-6.97 6.43-1.49 12.49-1.49 6.06 0 11.12.54 5.05.54 11.44 6.15l92.69 91.93q5.61 6.38 6.54 12 .92 5.63.92 12.25 0 6.13-1.74 12.06-1.74 5.92-6.72 11.07L264.77-128H128Z"/></svg>
        <svg width="17" height="17" viewBox="0 -960 960 960" fill="var(--coral)"><path d="M300.62-128q-38.85 0-64.74-25.88Q210-179.77 210-218.62V-724h-40v-66h188v-38.77h246V-790h188v66h-40v505.38q0 38.35-26.14 64.48Q699.73-128 661.38-128H300.62Z"/></svg>
      </div>
    </div>

    <div class="row">
      <div class="row-thumb" style="background:var(--bg-elevated-2);"><img src="bronze_medal.png" style="width:100%;height:100%;object-fit:contain;"></div>
      <div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:5px;">
        <span style="font-size:14px;font-weight:700;">Snack on the house</span>
        <span style="font-size:11.5px;color:var(--text-muted);">Requires 15 pts · $2.00</span>
      </div>
      <div style="display:flex;gap:10px;flex-shrink:0;">
        <svg width="17" height="17" viewBox="0 -960 960 960" fill="var(--text-faint)"><path d="M194-194h43.92l407.93-407.92-43.93-42.93L194-236.92V-194Zm-66 66v-136.77l557.23-558.77q5.15-5.48 11.57-6.97 6.43-1.49 12.49-1.49 6.06 0 11.12.54 5.05.54 11.44 6.15l92.69 91.93q5.61 6.38 6.54 12 .92 5.63.92 12.25 0 6.13-1.74 12.06-1.74 5.92-6.72 11.07L264.77-128H128Z"/></svg>
        <svg width="17" height="17" viewBox="0 -960 960 960" fill="var(--coral)"><path d="M300.62-128q-38.85 0-64.74-25.88Q210-179.77 210-218.62V-724h-40v-66h188v-38.77h246V-790h188v66h-40v505.38q0 38.35-26.14 64.48Q699.73-128 661.38-128H300.62Z"/></svg>
      </div>
    </div>

  </div>

  <!-- Add reward form -->
  <div style="background:var(--bg-elevated);border:1px solid var(--border);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:14px;margin-top:4px;">
    <div style="display:flex;align-items:center;justify-content:space-between;">
      <span class="display" style="font-size:14.5px;font-weight:700;">New reward</span>
      <svg width="16" height="16" viewBox="0 -960 960 960" fill="var(--text-faint)"><path d="M252-203.69 205.69-252l227-228-227-230L252-758.31l229 230 227-230L754.31-710l-227 230 227 228L708-203.69l-227-230-229 230Z"/></svg>
    </div>

    <div style="display:flex;justify-content:center;">
      <div style="width:84px;height:84px;border-radius:18px;border:1.5px dashed var(--border);background:var(--bg-elevated-2);display:flex;align-items:center;justify-content:center;">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="var(--text-faint)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4M12 4l-4 4M12 4l4 4"/><path d="M4 16v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg>
      </div>
    </div>

    <div>
      <label style="font-size:11px;font-weight:700;color:var(--text-muted);margin-bottom:6px;display:block;">Level</label>
      <select style="width:100%;background:var(--bg-elevated-2);border:1px solid var(--border);border-radius:12px;padding:11px 13px;font-size:13px;color:var(--text);font-family:'Sora',sans-serif;">
        <option>Gold</option>
      </select>
    </div>

    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;">
      <div>
        <label style="font-size:11px;font-weight:700;color:var(--text-muted);margin-bottom:6px;display:block;">Required points</label>
        <select style="width:100%;background:var(--bg-elevated-2);border:1px solid var(--border);border-radius:12px;padding:11px 13px;font-size:13px;color:var(--text);font-family:'Sora',sans-serif;">
          <option>25</option>
        </select>
      </div>
      <div>
        <label style="font-size:11px;font-weight:700;color:var(--text-muted);margin-bottom:6px;display:block;">Cash value</label>
        <input style="width:100%;background:var(--bg-elevated-2);border:1px solid var(--border);border-radius:12px;padding:11px 13px;font-size:13px;color:var(--text);font-family:'Sora',sans-serif;" type="number" placeholder="$" />
      </div>
    </div>

    <a href="#" style="text-align:center;font-size:13px;font-weight:700;padding:12px 0;border-radius:999px;background:var(--amber);color:#2b1a02;">Create reward</a>
  </div>

</div>
</x-dc>
<script data-dc-script data-props='{}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
