<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Sora:wght@400;500;600;700&display=swap');
    :root {
      --bg: oklch(0.15 0.018 290);
      --bg-elevated: oklch(0.195 0.02 290);
      --bg-elevated-2: oklch(0.245 0.022 290);
      --border: oklch(0.34 0.02 290 / 0.55);
      --text: oklch(0.96 0.01 90);
      --text-muted: oklch(0.7 0.02 290);
      --text-faint: oklch(0.52 0.02 290);
      --amber: oklch(0.78 0.16 75);
      --amber-soft: oklch(0.78 0.16 75 / 0.16);
      --coral: oklch(0.68 0.19 25);
      --coral-soft: oklch(0.68 0.19 25 / 0.16);
      --teal: oklch(0.72 0.14 165);
      --teal-soft: oklch(0.72 0.14 165 / 0.16);
      --violet: oklch(0.66 0.17 300);
      --violet-soft: oklch(0.66 0.17 300 / 0.16);
      --shadow-card: 0 10px 30px -12px oklch(0 0 0 / 0.55);
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: #0b0b0d; font-family: 'Sora', ui-sans-serif, system-ui, sans-serif; }
    .display { font-family: 'Bricolage Grotesque', ui-sans-serif, system-ui, sans-serif; }
    .icon-btn { width: 42px; height: 42px; border-radius: 999px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .seg { display: flex; gap: 8px; background: var(--bg-elevated-2); padding: 4px; border-radius: 14px; }
    .seg span { flex: 1; text-align: center; font-size: 12.5px; font-weight: 600; padding: 9px 0; border-radius: 11px; color: var(--text-faint); }
    .seg span.active { font-weight: 700; background: var(--amber); color: #2b1a02; }
    .medal { width: 42px; height: 42px; border-radius: 50%; display: flex; align-items: center; justify-content: center; flex-shrink: 0; padding: 8px; }
    .cprog { height: 8px; border-radius: 999px; background: var(--bg-elevated-2); overflow: hidden; }
  </style>
</helmet>

<div style="width:393px;background:var(--bg);color:var(--text);padding:24px 20px 140px;display:flex;flex-direction:column;gap:22px;position:relative;">

  <div style="display:flex;align-items:center;justify-content:space-between;">
    <span class="display" style="font-size:26px;font-weight:800;">Challenges</span>
    <div class="icon-btn" style="background:var(--bg-elevated);border:1px solid var(--border);">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--text)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><path d="M14 14h3v3M20 20v.01M14 20h3M20 14v3"/></svg>
    </div>
  </div>

  <div class="seg">
    <span class="active">Weekly</span>
    <span>Rewards</span>
  </div>

  <!-- Stats card -->
  <div style="background:var(--bg-elevated);border:1px solid var(--border);border-radius:24px;padding:20px;display:flex;flex-direction:column;gap:18px;box-shadow:var(--shadow-card);">
    <div style="display:flex;align-items:center;justify-content:space-between;">
      <span class="display" style="font-size:24px;font-weight:800;">142 pts</span>
      <div style="display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--text-faint);">
        <span>Aug 18</span>
        <svg width="13" height="13" viewBox="0 -960 960 960" fill="var(--text-faint)"><path d="M280-280 80-480l200-200 56 56-103 104h494L624-624l56-56 200 200-200 200-56-56 103-104H233l103 104-56 56Z"/></svg>
        <span>Aug 24</span>
      </div>
    </div>

    <div style="display:flex;gap:12px;">
      <div class="medal" style="background:var(--amber-soft);"><img src="bronze_medal.png" style="width:100%;height:100%;object-fit:contain;"></div>
      <div class="medal" style="background:var(--teal-soft);"><img src="silver_medal.png" style="width:100%;height:100%;object-fit:contain;"></div>
      <div class="medal" style="background:var(--bg-elevated-2);opacity:0.5;"><img src="locked.png" style="width:100%;height:100%;object-fit:contain;"></div>
      <div class="medal" style="background:var(--bg-elevated-2);opacity:0.5;"><img src="locked.png" style="width:100%;height:100%;object-fit:contain;"></div>
    </div>

    <div style="position:relative;padding-top:4px;">
      <div class="cprog"><div style="width:57%;height:100%;background:linear-gradient(90deg,var(--amber),var(--coral));"></div></div>
      <div style="display:flex;justify-content:space-between;margin-top:8px;">
        <span style="font-size:10.5px;font-weight:700;color:var(--amber);">25</span>
        <span style="font-size:10.5px;font-weight:700;color:var(--amber);">50</span>
        <span style="font-size:10.5px;font-weight:600;color:var(--text-faint);">75</span>
        <span style="font-size:10.5px;font-weight:600;color:var(--text-faint);">100</span>
      </div>
    </div>
  </div>

  <!-- Game / Universal toggle -->
  <div style="display:flex;gap:8px;">
    <span style="font-size:12px;font-weight:700;padding:8px 16px;border-radius:999px;background:var(--amber);color:#2b1a02;">Game challenges</span>
    <span style="font-size:12px;font-weight:600;padding:8px 16px;border-radius:999px;background:var(--bg-elevated);border:1px solid var(--border);color:var(--text-faint);">Universal</span>
  </div>

  <div style="display:flex;flex-direction:column;gap:12px;">

    <div style="position:relative;background:var(--bg-elevated);border:1px solid var(--border);border-radius:20px;padding:14px;display:flex;gap:12px;align-items:center;">
      <div style="width:52px;height:52px;border-radius:14px;flex-shrink:0;background:linear-gradient(150deg,#5a4fcf,#8ea2ff);"></div>
      <div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:8px;">
        <span style="font-size:13px;font-weight:700;">Play <b>Catan</b> 3 times</span>
        <div class="cprog"><div style="width:66%;height:100%;background:var(--teal);"></div></div>
        <div style="display:flex;align-items:center;justify-content:space-between;">
          <span style="font-size:11px;font-weight:700;color:var(--text-faint);">2 / 3</span>
          <span style="font-size:11px;font-weight:700;color:var(--amber);">+10 pts</span>
        </div>
      </div>
      <img src="challenge-inprogress.png" alt="In progress" style="width:26px;height:26px;object-fit:contain;flex-shrink:0;">
    </div>

    <div style="position:relative;background:var(--bg-elevated);border:1px solid var(--border);border-radius:20px;padding:14px;display:flex;gap:12px;align-items:center;">
      <div style="width:52px;height:52px;border-radius:14px;flex-shrink:0;background:linear-gradient(135deg,#46945b,#a3d78a);"></div>
      <div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:8px;">
        <span style="font-size:13px;font-weight:700;">Play <b>Wingspan</b> 2 times</span>
        <div class="cprog"><div style="width:100%;height:100%;background:var(--coral);"></div></div>
        <div style="display:flex;align-items:center;justify-content:space-between;">
          <span style="font-size:11px;font-weight:700;color:var(--text-faint);">2 / 2</span>
          <span style="font-size:11px;font-weight:700;color:var(--amber);">+15 pts</span>
        </div>
      </div>
      <img src="challenge-complete.png" alt="Completed" style="width:26px;height:26px;object-fit:contain;flex-shrink:0;">
    </div>

    <div style="position:relative;background:var(--bg-elevated);border:1px solid var(--border);border-radius:20px;padding:14px;display:flex;gap:12px;align-items:center;opacity:0.6;">
      <div style="width:52px;height:52px;border-radius:14px;flex-shrink:0;background:linear-gradient(135deg,#977f33,#fccd3d);"></div>
      <div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:8px;">
        <span style="font-size:13px;font-weight:700;">Play <b>Splendor</b> 5 times</span>
        <div class="cprog"><div style="width:0%;height:100%;background:var(--violet);"></div></div>
        <div style="display:flex;align-items:center;justify-content:space-between;">
          <span style="font-size:11px;font-weight:700;color:var(--text-faint);">0 / 5</span>
          <span style="font-size:11px;font-weight:700;color:var(--amber);">+20 pts</span>
        </div>
      </div>
      <img src="locked.png" alt="Locked" style="width:26px;height:26px;object-fit:contain;flex-shrink:0;">
    </div>

  </div>

  <!-- Floating bottom nav — real IA: games / meeple / reservations · FAB(challenges) · events / profile — challenges (FAB) active -->
  <div style="position:absolute;left:20px;right:20px;bottom:24px;background:var(--bg-elevated);border:1px solid var(--border);border-radius:999px;padding:10px 16px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 14px 34px -10px oklch(0 0 0 / 0.6);">
    <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="var(--text-faint)" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11.5 12 4l8 7.5"/><path d="M6 10v9a1 1 0 0 0 1 1h4v-6h2v6h4a1 1 0 0 0 1-1v-9"/></svg>
    <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="var(--text-faint)" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3"/><path d="M3 19c.8-3.3 3-5 6-5s5.2 1.7 6 5"/><circle cx="17" cy="9" r="2.4"/><path d="M15.5 12.2c2.6.2 4 1.7 4.6 4.3"/></svg>
    <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="var(--text-faint)" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="5" width="16" height="15" rx="3"/><path d="M4 10h16"/><path d="M8 3v4M16 3v4"/><path d="M9.5 14l1.8 1.8L15 12"/></svg>
    <div style="width:50px;height:50px;border-radius:999px;background:linear-gradient(135deg,var(--amber),var(--coral));display:flex;align-items:center;justify-content:center;margin-top:-22px;box-shadow:0 0 0 3px var(--amber),0 8px 20px -6px var(--amber-soft),0 0 0 6px var(--bg);">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#2b1502" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M8 4h8v4a4 4 0 0 1-8 0z"/><path d="M8 5H5a3 3 0 0 0 3 5"/><path d="M16 5h3a3 3 0 0 1-3 5"/><path d="M10 13v3M14 13v3"/><path d="M8 20h8"/><path d="M9 17h6l1 3H8z"/></svg>
    </div>
    <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="var(--text-faint)" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2 1.6 1.6 0 0 0 0 6 2 2 0 0 1-2 2H6a2 2 0 0 1-2-2 1.6 1.6 0 0 0 0-6z"/><path d="M9 7.5v2M9 12.5v2M9 17v-2"/></svg>
    <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="var(--text-faint)" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="3.5"/><path d="M5 20c1.2-4 4-5.5 7-5.5s5.8 1.5 7 5.5"/></svg>
  </div>

</div>
</x-dc>
<script data-dc-script data-props='{}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
