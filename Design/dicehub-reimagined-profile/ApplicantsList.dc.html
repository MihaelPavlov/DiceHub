<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Sora:wght@400;500;600;700&display=swap');
    :root {
      --bg: oklch(0.15 0.018 290);
      --bg-elevated: oklch(0.195 0.02 290);
      --bg-elevated-2: oklch(0.245 0.022 290);
      --border: oklch(0.34 0.02 290 / 0.55);
      --text: oklch(0.96 0.01 90);
      --text-muted: oklch(0.7 0.02 290);
      --text-faint: oklch(0.52 0.02 290);
      --amber: oklch(0.78 0.16 75);
      --amber-soft: oklch(0.78 0.16 75 / 0.16);
      --teal: oklch(0.72 0.14 165);
      --teal-soft: oklch(0.72 0.14 165 / 0.16);
      --coral: oklch(0.68 0.19 25);
      --coral-soft: oklch(0.68 0.19 25 / 0.16);
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: #0b0b0d; font-family: 'Sora', ui-sans-serif, system-ui, sans-serif; }
    .display { font-family: 'Bricolage Grotesque', ui-sans-serif, system-ui, sans-serif; }
    .icon-btn { width: 42px; height: 42px; border-radius: 999px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .app-row { background: var(--bg-elevated); border: 1px solid var(--border); border-radius: 18px; padding: 14px 16px; display: flex; flex-direction: column; gap: 8px; }
    .status { font-size: 10px; font-weight: 700; padding: 4px 10px; border-radius: 999px; flex-shrink: 0; text-transform: uppercase; letter-spacing: 0.02em; }
    .status.pending { background: var(--amber-soft); color: var(--amber); }
    .status.verified { background: var(--teal-soft); color: var(--teal); }
    .status.rejected { background: var(--coral-soft); color: var(--coral); }
  </style>
</helmet>

<div style="width:393px;background:var(--bg);color:var(--text);padding:24px 20px 40px;display:flex;flex-direction:column;gap:20px;">

  <div class="icon-btn" style="background:var(--bg-elevated);border:1px solid var(--border);">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--text)" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
  </div>

  <div style="display:flex;flex-direction:column;gap:6px;">
    <span class="display" style="font-size:22px;font-weight:800;">Applicants</span>
    <span style="font-size:12.5px;color:var(--text-muted);">Venue applications awaiting SuperAdmin review.</span>
  </div>

  <div style="display:flex;flex-direction:column;gap:10px;">

    <a href="#" class="app-row">
      <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:10px;">
        <div style="display:flex;flex-direction:column;">
          <span style="font-size:14px;font-weight:700;">Elena Petrova</span>
          <span style="font-size:11px;color:var(--text-faint);">Venue / Club</span>
        </div>
        <span class="status pending">Pending</span>
      </div>
      <div style="display:flex;flex-direction:column;gap:2px;">
        <span style="font-size:12px;color:var(--text-muted);">elena@rollingdice.cafe</span>
        <span style="font-size:12px;color:var(--text-muted);">+1 (555) 010-2233</span>
      </div>
    </a>

    <a href="#" class="app-row">
      <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:10px;">
        <div style="display:flex;flex-direction:column;">
          <span style="font-size:14px;font-weight:700;">Marcus Webb</span>
          <span style="font-size:11px;color:var(--text-faint);">Venue / Club</span>
        </div>
        <span class="status verified">Verified</span>
      </div>
      <div style="display:flex;flex-direction:column;gap:2px;">
        <span style="font-size:12px;color:var(--text-muted);">marcus@meepleandmug.com</span>
        <span style="font-size:12px;color:var(--text-muted);">+1 (555) 077-4410</span>
      </div>
    </a>

    <a href="#" class="app-row">
      <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:10px;">
        <div style="display:flex;flex-direction:column;">
          <span style="font-size:14px;font-weight:700;">Priya Nair</span>
          <span style="font-size:11px;color:var(--text-faint);">Venue / Club</span>
        </div>
        <span class="status rejected">Rejected</span>
      </div>
      <div style="display:flex;flex-direction:column;gap:2px;">
        <span style="font-size:12px;color:var(--text-muted);">priya@dicedenbar.co</span>
        <span style="font-size:12px;color:var(--text-muted);">+1 (555) 062-9981</span>
      </div>
    </a>

  </div>

</div>
</x-dc>
<script data-dc-script data-props='{}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
