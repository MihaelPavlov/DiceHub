<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Sora:wght@400;500;600;700&display=swap');
    :root {
      --bg: oklch(0.15 0.018 290);
      --bg-elevated: oklch(0.195 0.02 290);
      --bg-elevated-2: oklch(0.245 0.022 290);
      --border: oklch(0.34 0.02 290 / 0.55);
      --text: oklch(0.96 0.01 90);
      --text-muted: oklch(0.7 0.02 290);
      --text-faint: oklch(0.52 0.02 290);
      --amber: oklch(0.78 0.16 75);
      --amber-soft: oklch(0.78 0.16 75 / 0.16);
      --coral: oklch(0.68 0.19 25);
      --coral-soft: oklch(0.68 0.19 25 / 0.16);
      --teal: oklch(0.72 0.14 165);
      --teal-soft: oklch(0.72 0.14 165 / 0.16);
      --violet: oklch(0.66 0.17 300);
      --violet-soft: oklch(0.66 0.17 300 / 0.16);
      --shadow-card: 0 10px 30px -12px oklch(0 0 0 / 0.55);
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: #0b0b0d; font-family: 'Sora', ui-sans-serif, system-ui, sans-serif; }
    .display { font-family: 'Bricolage Grotesque', ui-sans-serif, system-ui, sans-serif; }
    .icon-btn { width: 42px; height: 42px; border-radius: 999px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .menu-item { display: flex; flex-direction: column; gap: 10px; background: var(--bg-elevated); border: 1px solid var(--border); border-radius: 18px; padding: 15px; }
    .menu-icon { width: 38px; height: 38px; border-radius: 12px; display: flex; align-items: center; justify-content: center; }
    .chart-row { display: flex; align-items: center; gap: 12px; background: var(--bg-elevated); border: 1px solid var(--border); border-radius: 16px; padding: 12px 14px; }
  </style>
</helmet>

<div style="width:393px;background:var(--bg);color:var(--text);padding:24px 20px 40px;display:flex;flex-direction:column;gap:24px;">

  <div style="display:flex;align-items:center;justify-content:space-between;">
    <div style="display:flex;align-items:center;gap:12px;">
      <div style="width:48px;height:48px;border-radius:50%;background:linear-gradient(135deg,var(--amber),var(--coral));display:flex;align-items:center;justify-content:center;font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:17px;color:#2b1502;">MR</div>
      <div style="display:flex;flex-direction:column;">
        <span style="font-size:12px;color:var(--text-faint);">Hello,</span>
        <span class="display" style="font-size:18px;font-weight:800;">Maya R.</span>
      </div>
    </div>
    <div class="icon-btn" style="background:var(--bg-elevated);border:1px solid var(--border);">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--coral)" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>
    </div>
  </div>

  <div style="display:flex;background:var(--bg-elevated);border:1px solid var(--border);border-radius:18px;padding:16px 0;">
    <div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;">
      <span class="display" style="font-size:19px;font-weight:800;">128</span>
      <span style="font-size:10.5px;color:var(--text-faint);">Games</span>
    </div>
    <div style="width:1px;background:var(--border);"></div>
    <div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;">
      <span class="display" style="font-size:19px;font-weight:800;">64</span>
      <span style="font-size:10.5px;color:var(--text-faint);">Reservations</span>
    </div>
    <div style="width:1px;background:var(--border);"></div>
    <div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;">
      <span class="display" style="font-size:19px;font-weight:800;">12</span>
      <span style="font-size:10.5px;color:var(--text-faint);">Events</span>
    </div>
  </div>

  <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;">

    <a href="#" class="menu-item">
      <div class="menu-icon" style="background:var(--teal-soft);">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="var(--teal)" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6Z"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1Z"/></svg>
      </div>
      <span style="font-size:13.5px;font-weight:700;">Settings</span>
    </a>

    <a href="#" class="menu-item">
      <div class="menu-icon" style="background:var(--violet-soft);">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="var(--violet)" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3"/><path d="M3 19c.8-3.3 3-5 6-5s5.2 1.7 6 5"/><circle cx="17" cy="9" r="2.4"/><path d="M15.5 12.2c2.6.2 4 1.7 4.6 4.3"/></svg>
      </div>
      <span style="font-size:13.5px;font-weight:700;">Employees</span>
    </a>

    <a href="#" class="menu-item">
      <div class="menu-icon" style="background:var(--amber-soft);">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="var(--amber)" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2 1.6 1.6 0 0 0 0 6 2 2 0 0 1-2 2H6a2 2 0 0 1-2-2 1.6 1.6 0 0 0 0-6z"/></svg>
      </div>
      <span style="font-size:13.5px;font-weight:700;">Club Info</span>
    </a>

    <a href="#" class="menu-item">
      <div class="menu-icon" style="background:var(--coral-soft);">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="var(--coral)" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 6.5C10.5 4.8 8 4 6 4.5 4 5 3 6.5 3 8.5c0 4 4.5 6.5 9 10.5 4.5-4 9-6.5 9-10.5 0-2-1-3.5-3-4-2-.5-4.5.3-6 2Z"/><path d="M12 9v4M12 16h.01"/></svg>
      </div>
      <span style="font-size:13.5px;font-weight:700;">Instructions</span>
    </a>

  </div>

  <div style="display:flex;flex-direction:column;gap:10px;">
    <span class="display" style="font-size:15px;font-weight:700;">Club analytics</span>

    <div class="chart-row">
      <div class="menu-icon" style="width:32px;height:32px;background:var(--amber-soft);"><svg width="16" height="16" viewBox="0 -960 960 960" fill="var(--amber)"><path d="m346.92-70.77-72.77-124.61-141.07-31.39 14.46-145.08L51.85-480l95.69-108.15-14.46-145.08 141.07-31.39 72.77-124.61L480-832.92l133.08-56.31 72.77 124.61 141.07 31.39-14.46 145.08L908.15-480l-95.69 108.15 14.46 145.08-141.07 31.39-72.77 124.61L480-127.08 346.92-70.77Z"/></svg></div>
      <span style="flex:1;font-size:13px;font-weight:600;">Challenge Leaderboard</span>
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="var(--text-faint)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>
    </div>
    <div class="chart-row">
      <div class="menu-icon" style="width:32px;height:32px;background:var(--teal-soft);"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--teal)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="4"/><circle cx="8.5" cy="8.5" r="1.15" fill="var(--teal)" stroke="none"/><circle cx="15.5" cy="8.5" r="1.15" fill="var(--teal)" stroke="none"/><circle cx="12" cy="12" r="1.15" fill="var(--teal)" stroke="none"/><circle cx="8.5" cy="15.5" r="1.15" fill="var(--teal)" stroke="none"/><circle cx="15.5" cy="15.5" r="1.15" fill="var(--teal)" stroke="none"/></svg></div>
      <span style="flex:1;font-size:13px;font-weight:600;">Most Played Games</span>
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="var(--text-faint)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>
    </div>
    <div class="chart-row">
      <div class="menu-icon" style="width:32px;height:32px;background:var(--violet-soft);"><svg width="16" height="16" viewBox="0 -960 960 960" fill="var(--violet)"><path d="M44.85-154.38v-96.85q0-34.85 16.61-59.24t44.57-38.67q56.05-27.78 113.62-44.01 57.58-16.23 136.2-16.23 78.27 0 135.52 16.23 57.25 16.23 113.29 44.01 27.97 14.28 44.58 38.67t16.61 59.24v96.85h-621Z"/></svg></div>
      <span style="flex:1;font-size:13px;font-weight:600;">Visitors</span>
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="var(--text-faint)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>
    </div>
    <div class="chart-row">
      <div class="menu-icon" style="width:32px;height:32px;background:var(--coral-soft);"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--coral)" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="5" width="16" height="15" rx="3"/><path d="M4 10h16"/></svg></div>
      <span style="flex:1;font-size:13px;font-weight:600;">Reservations</span>
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="var(--text-faint)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>
    </div>
    <div class="chart-row">
      <div class="menu-icon" style="width:32px;height:32px;background:var(--amber-soft);"><svg width="16" height="16" viewBox="0 -960 960 960" fill="var(--amber)"><path d="M204.62-100q-27.62 0-46.12-18.5T140-164.62v-566.76q0-27.62 18.5-46.12T204.62-796h49.23v-63.85h68.3V-796h324v-63.85h66.16V-796h49.07q27.62 0 46.28 18.5Q826-759 826-731.38v566.76q0 27.62-18.5 46.12T761.38-100H204.62Z"/></svg></div>
      <span style="flex:1;font-size:13px;font-weight:600;">Events</span>
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="var(--text-faint)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>
    </div>
    <div class="chart-row">
      <div class="menu-icon" style="width:32px;height:32px;background:var(--teal-soft);"><svg width="16" height="16" viewBox="0 -960 960 960" fill="var(--teal)"><path d="M480-80 154-411q-35-35-54.5-79T80-580q0-90 63-153t153-63q55 0 103 26t81 70q33-44 81-70t103-26q90 0 153 63t63 153q0 46-19.5 90T806-411L480-80Z"/></svg></div>
      <span style="flex:1;font-size:13px;font-weight:600;">Rewards</span>
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="var(--text-faint)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>
    </div>
  </div>

</div>
</x-dc>
<script data-dc-script data-props='{}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
