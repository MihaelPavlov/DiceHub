<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Sora:wght@400;500;600;700&display=swap');
    :root {
      --bg: oklch(0.15 0.018 290);
      --bg-elevated: oklch(0.195 0.02 290);
      --bg-elevated-2: oklch(0.245 0.022 290);
      --border: oklch(0.34 0.02 290 / 0.55);
      --text: oklch(0.96 0.01 90);
      --text-muted: oklch(0.7 0.02 290);
      --text-faint: oklch(0.52 0.02 290);
      --amber: oklch(0.78 0.16 75);
      --amber-soft: oklch(0.78 0.16 75 / 0.16);
      --coral: oklch(0.68 0.19 25);
      --violet: oklch(0.66 0.17 300);
      --violet-soft: oklch(0.66 0.17 300 / 0.16);
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: #0b0b0d; font-family: 'Sora', ui-sans-serif, system-ui, sans-serif; }
    .display { font-family: 'Bricolage Grotesque', ui-sans-serif, system-ui, sans-serif; }
    .icon-btn { width: 42px; height: 42px; border-radius: 999px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .field-label { font-size: 12px; font-weight: 700; color: var(--text-muted); margin-bottom: 7px; display: block; }
    .field-input { width: 100%; background: var(--bg-elevated-2); border: 1px solid var(--border); border-radius: 14px; padding: 13px 15px; font-size: 14px; color: var(--text); font-family: 'Sora', sans-serif; }
    .section-card { background: var(--bg-elevated); border: 1px solid var(--border); border-radius: 22px; padding: 18px; display: flex; flex-direction: column; gap: 14px; }
    .section-title { font-size: 11px; font-weight: 700; letter-spacing: 0.06em; color: var(--amber); text-transform: uppercase; }
    .day { flex: 1; text-align: center; font-size: 11px; font-weight: 700; padding: 8px 0; border-radius: 9px; background: var(--bg-elevated-2); border: 1px solid var(--border); color: var(--text-muted); }
    .day.off { background: var(--coral); border-color: var(--coral); color: #fff; }
    .slot { flex-shrink: 0; font-size: 11px; font-weight: 700; padding: 8px 13px; border-radius: 999px; background: var(--bg-elevated-2); border: 1px solid var(--border); color: var(--text-muted); }
    .slot.on { background: var(--amber); border-color: var(--amber); color: #2b1a02; }
  </style>
</helmet>

<div style="width:393px;background:var(--bg);color:var(--text);padding:24px 20px 40px;display:flex;flex-direction:column;gap:18px;">

  <div style="display:flex;align-items:center;justify-content:space-between;">
    <div class="icon-btn" style="background:var(--bg-elevated);border:1px solid var(--border);">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--text)" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
    </div>
    <span class="display" style="font-size:18px;font-weight:700;">Space Settings</span>
    <div style="width:42px;"></div>
  </div>

  <!-- Preferences -->
  <div class="section-card">
    <span class="section-title">Preferences</span>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;">
      <div>
        <label class="field-label">UI Theme</label>
        <select class="field-input"><option selected>Dark</option><option>Light</option></select>
      </div>
      <div>
        <label class="field-label">Language</label>
        <select class="field-input"><option selected>English</option><option>Български</option></select>
      </div>
    </div>
  </div>

  <!-- Club basics -->
  <div class="section-card">
    <span class="section-title">Club Basics</span>
    <div>
      <label class="field-label">Club name</label>
      <input class="field-input" type="text" value="The Rolling Dice Cafe" />
    </div>
    <div>
      <label class="field-label">Club phone number</label>
      <input class="field-input" type="tel" value="+1 (555) 010-2233" />
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;">
      <div>
        <label class="field-label">Opens</label>
        <input class="field-input" type="text" value="10:00" />
      </div>
      <div>
        <label class="field-label">Closes</label>
        <input class="field-input" type="text" value="23:00" />
      </div>
    </div>
    <div>
      <label class="field-label">Days off</label>
      <div style="display:flex;gap:6px;">
        <div class="day off">Mon</div>
        <div class="day">Tue</div>
        <div class="day">Wed</div>
        <div class="day">Thu</div>
        <div class="day">Fri</div>
        <div class="day">Sat</div>
        <div class="day">Sun</div>
      </div>
    </div>
    <div>
      <label class="field-label">Average max capacity</label>
      <input class="field-input" type="number" value="40" />
    </div>
  </div>

  <!-- Reservations -->
  <div class="section-card">
    <span class="section-title">Reservations</span>
    <div>
      <label class="field-label">Reservation hours</label>
      <div style="display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;">
        <div class="slot on">17:00</div>
        <div class="slot on">18:00</div>
        <div class="slot on">19:00</div>
        <div class="slot on">20:00</div>
        <div class="slot">21:00</div>
        <div class="slot">22:00</div>
      </div>
    </div>
    <div>
      <label class="field-label">Bonus time after reservation expires</label>
      <div style="position:relative;">
        <input class="field-input" type="number" value="15" style="padding-right:60px;" />
        <span style="position:absolute;top:13px;right:15px;font-size:12px;color:var(--text-faint);font-weight:600;">min</span>
      </div>
    </div>
  </div>

  <!-- Challenges -->
  <div class="section-card">
    <span class="section-title">Challenges &amp; Rewards</span>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;">
      <div>
        <label class="field-label">Rewards per period</label>
        <input class="field-input" type="number" value="4" />
      </div>
      <div>
        <label class="field-label">Initiation delay</label>
        <select class="field-input"><option selected>24 hours</option><option>48 hours</option></select>
      </div>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;">
      <div>
        <label class="field-label">Reset day</label>
        <select class="field-input"><option selected>Monday</option><option>Sunday</option></select>
      </div>
      <div>
        <label class="field-label">Reset period</label>
        <select class="field-input"><option selected>Weekly</option><option>Monthly</option></select>
      </div>
    </div>

    <div style="display:flex;align-items:center;justify-content:space-between;background:var(--violet-soft);border:1px solid var(--violet);border-radius:14px;padding:13px 15px;">
      <div style="display:flex;flex-direction:column;gap:2px;">
        <span style="font-size:13px;font-weight:700;">Custom period</span>
        <span style="font-size:10.5px;color:var(--text-muted);">Off — auto weekly/monthly cycles apply</span>
      </div>
      <div style="width:42px;height:24px;border-radius:999px;background:var(--bg-elevated-2);border:1px solid var(--border);position:relative;flex-shrink:0;">
        <div style="width:18px;height:18px;border-radius:999px;background:var(--text-faint);position:absolute;top:2px;left:2px;"></div>
      </div>
    </div>
    <span style="font-size:10.5px;color:var(--text-faint);line-height:1.5;">Turning this on redirects challenge setup to the Custom Period manager.</span>
  </div>

  <a href="#" style="text-align:center;font-size:14px;font-weight:700;padding:15px 0;border-radius:999px;background:linear-gradient(135deg,var(--amber),var(--coral));color:#2b1502;">Save settings</a>

</div>
</x-dc>
<script data-dc-script data-props='{}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
