<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Sora:wght@400;500;600;700&display=swap');
    :root {
      --bg: oklch(0.15 0.018 290);
      --bg-elevated: oklch(0.195 0.02 290);
      --bg-elevated-2: oklch(0.245 0.022 290);
      --border: oklch(0.34 0.02 290 / 0.55);
      --text: oklch(0.96 0.01 90);
      --text-muted: oklch(0.7 0.02 290);
      --text-faint: oklch(0.52 0.02 290);
      --amber: oklch(0.78 0.16 75);
      --coral: oklch(0.68 0.19 25);
      --teal: oklch(0.72 0.14 165);
      --violet: oklch(0.66 0.17 300);
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: #0b0b0d; font-family: 'Sora', ui-sans-serif, system-ui, sans-serif; }
    .display { font-family: 'Bricolage Grotesque', ui-sans-serif, system-ui, sans-serif; }
    .icon-btn { width: 42px; height: 42px; border-radius: 999px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .eyebrow { font-size: 11px; font-weight: 700; letter-spacing: 0.08em; color: var(--amber); text-transform: uppercase; }
    .tenant-row { display: flex; align-items: center; gap: 14px; background: var(--bg-elevated); border: 1px solid var(--border); border-radius: 18px; padding: 14px 16px; }
    .mark { width: 44px; height: 44px; border-radius: 14px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 17px; color: #fff; }
  </style>
</helmet>

<div style="width:393px;background:var(--bg);color:var(--text);padding:24px 20px 40px;display:flex;flex-direction:column;gap:22px;">

  <div class="icon-btn" style="background:var(--bg-elevated);border:1px solid var(--border);">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--text)" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
  </div>

  <div style="display:flex;flex-direction:column;gap:8px;">
    <span class="eyebrow">Platform</span>
    <span class="display" style="font-size:27px;font-weight:800;">Tenants</span>
    <span style="font-size:12.5px;color:var(--text-muted);">Select a venue to inspect its platform access.</span>
  </div>

  <div style="display:flex;flex-direction:column;gap:10px;">

    <a href="#" class="tenant-row">
      <div class="mark" style="background:linear-gradient(135deg,var(--amber),var(--coral));color:#2b1502;">R</div>
      <div style="flex:1;display:flex;flex-direction:column;">
        <span style="font-size:14.5px;font-weight:700;">The Rolling Dice Cafe</span>
        <span style="font-size:11px;color:var(--text-faint);font-family:monospace;">tn_8f2a91c4</span>
      </div>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--text-faint)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>
    </a>

    <a href="#" class="tenant-row">
      <div class="mark" style="background:linear-gradient(135deg,var(--teal),var(--violet));">M</div>
      <div style="flex:1;display:flex;flex-direction:column;">
        <span style="font-size:14.5px;font-weight:700;">Meeple &amp; Mug</span>
        <span style="font-size:11px;color:var(--text-faint);font-family:monospace;">tn_1c74de20</span>
      </div>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--text-faint)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>
    </a>

    <a href="#" class="tenant-row">
      <div class="mark" style="background:linear-gradient(135deg,#5a4fcf,#8ea2ff);">N</div>
      <div style="flex:1;display:flex;flex-direction:column;">
        <span style="font-size:14.5px;font-weight:700;">Nexus Board Game Club</span>
        <span style="font-size:11px;color:var(--text-faint);font-family:monospace;">tn_ab30f871</span>
      </div>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--text-faint)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>
    </a>

  </div>

</div>
</x-dc>
<script data-dc-script data-props='{}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
