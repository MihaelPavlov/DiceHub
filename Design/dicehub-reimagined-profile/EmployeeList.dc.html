<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Sora:wght@400;500;600;700&display=swap');
    :root {
      --bg: oklch(0.15 0.018 290);
      --bg-elevated: oklch(0.195 0.02 290);
      --bg-elevated-2: oklch(0.245 0.022 290);
      --border: oklch(0.34 0.02 290 / 0.55);
      --text: oklch(0.96 0.01 90);
      --text-muted: oklch(0.7 0.02 290);
      --text-faint: oklch(0.52 0.02 290);
      --amber: oklch(0.78 0.16 75);
      --teal: oklch(0.72 0.14 165);
      --teal-soft: oklch(0.72 0.14 165 / 0.16);
      --coral: oklch(0.68 0.19 25);
      --coral-soft: oklch(0.68 0.19 25 / 0.16);
      --violet: oklch(0.66 0.17 300);
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: #0b0b0d; font-family: 'Sora', ui-sans-serif, system-ui, sans-serif; }
    .display { font-family: 'Bricolage Grotesque', ui-sans-serif, system-ui, sans-serif; }
    .icon-btn { width: 42px; height: 42px; border-radius: 999px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .emp-row { background: var(--bg-elevated); border: 1px solid var(--border); border-radius: 18px; padding: 14px 16px; display: flex; flex-direction: column; gap: 12px; }
    .avatar { width: 38px; height: 38px; border-radius: 50%; flex-shrink: 0; background: var(--bg-elevated-2); display: flex; align-items: center; justify-content: center; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 13px; color: var(--text-muted); }
  </style>
</helmet>

<div style="width:393px;background:var(--bg);color:var(--text);padding:24px 20px 40px;display:flex;flex-direction:column;gap:20px;">

  <div style="display:flex;align-items:center;justify-content:space-between;">
    <span class="display" style="font-size:26px;font-weight:800;">Employees</span>
    <div class="icon-btn" style="background:var(--amber);">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#2b1a02" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
    </div>
  </div>

  <div style="display:flex;align-items:center;gap:10px;background:var(--bg-elevated);border:1px solid var(--border);border-radius:999px;padding:13px 18px;">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--text-faint)" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M20 20l-4.8-4.8"/></svg>
    <span style="font-size:14px;color:var(--text-faint);font-weight:500;">Search employees…</span>
  </div>

  <div style="display:flex;flex-direction:column;gap:10px;">

    <!-- expanded row -->
    <div class="emp-row">
      <div style="display:flex;align-items:center;gap:12px;">
        <div class="avatar" style="background:linear-gradient(135deg,var(--violet),var(--teal));color:#fff;">JC</div>
        <span style="flex:1;font-size:14.5px;font-weight:700;">jonc_staff</span>
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="var(--text-faint)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="transform:rotate(90deg);"><path d="M9 5l7 7-7 7"/></svg>
      </div>
      <div style="display:flex;gap:10px;">
        <a href="#" style="flex:1;display:flex;align-items:center;justify-content:center;gap:6px;font-size:12.5px;font-weight:700;padding:10px 0;border-radius:999px;background:var(--teal-soft);color:var(--teal);">
          <svg width="14" height="14" viewBox="0 -960 960 960" fill="var(--teal)"><path d="M194-194h43.92l407.93-407.92-43.93-42.93L194-236.92V-194Z"/></svg>
          Update
        </a>
        <a href="#" style="flex:1;display:flex;align-items:center;justify-content:center;gap:6px;font-size:12.5px;font-weight:700;padding:10px 0;border-radius:999px;background:var(--coral-soft);color:var(--coral);">
          <svg width="14" height="14" viewBox="0 -960 960 960" fill="var(--coral)"><path d="M300.62-128q-38.85 0-64.74-25.88Q210-179.77 210-218.62V-724h-40v-66h188v-38.77h246V-790h188v66h-40v505.38q0 38.35-26.14 64.48Q699.73-128 661.38-128H300.62Z"/></svg>
          Delete
        </a>
      </div>
    </div>

    <div class="emp-row">
      <div style="display:flex;align-items:center;gap:12px;">
        <div class="avatar" style="background:linear-gradient(135deg,var(--amber),var(--coral));color:#2b1502;">SL</div>
        <span style="flex:1;font-size:14.5px;font-weight:700;">sara.l</span>
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="var(--text-faint)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>
      </div>
    </div>

    <div class="emp-row">
      <div style="display:flex;align-items:center;gap:12px;">
        <div class="avatar">TB</div>
        <span style="flex:1;font-size:14.5px;font-weight:700;">theo_b</span>
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="var(--text-faint)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>
      </div>
    </div>

  </div>

</div>
</x-dc>
<script data-dc-script data-props='{}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
